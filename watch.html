<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="referrer" content="no-referrer">


    <title>Watch - Sports Zone</title>



    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">



    <!-- SHAKA PLAYER -->
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@5.1.10/dist/shaka-player.ui.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@5.1.10/dist/controls.min.css">



    <!-- HLS PLAYER -->

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>




    <link rel="stylesheet" href="css/watch.css">


</head>


<body>



    <header class="player-header">


        <div class="player-header-inner">



            <a href="index.html" class="player-brand gradient-text">

                SPORTS ZONE

            </a>




            <a href="https://t.me/+rtK_sfY8t_A2NDU1" class="btn-telegram" target="_blank">

                JOIN TELEGRAM

            </a>



        </div>


    </header>







    <main class="player-container">



        <section class="match-header-info">


            <div class="title-row">


                <span class="live-indicator">
                    LIVE
                </span>



                <h1 id="matchName">
                    LOADING...
                </h1>



            </div>



            <h2 id="matchTitle">
                PLEASE WAIT
            </h2>



        </section>










        <div class="video-wrapper">



            <div id="loader">

                Loading Stream...

            </div>








            <!-- SHAKA PLAYER -->

            <div id="shaka-container" class="shaka-video-container">



                <video id="videoPlayer" playsinline autoplay muted style="width:100%;height:100%">

                </video>



            </div>










            <!-- HLS PLAYER -->

            <div id="ios-container">



                <video id="ios-video" controls playsinline autoplay muted>
                </video>



            </div>









            <!-- IFRAME PLAYER -->

            <div id="iframe-container">



                <iframe id="stream-frame" width="100%" height="100%" frameborder="0"
                    allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen>

                </iframe>



            </div>

            <!-- JW PLAYER -->

            <div id="jw-container" style="display:none;width:100%;height:100%;">

                <div id="jw-player"></div>

            </div>



        </div>









        <div id="serverList" class="server-list">

        </div>






    </main>








    <footer class="player-footer">


        © SPORTS ZONE • ALL RIGHTS RESERVED


    </footer>









    <!-- POPUNDER -->

    <script id="aclib" type="text/javascript" src="//acscdn.com/script/aclib.js"></script>


    <script>


        let clickCount = 0;


        document.addEventListener(
            "click",
            function () {


                clickCount++;



                if (clickCount % 2 !== 0) {



                    if (typeof aclib !== "undefined") {


                        aclib.runPop({

                            zoneId: '11800802'

                        });


                    }



                }



            },
            true
        );



    </script>







    <script type="module" src="js/player.js"></script>
    <script type="module" src="js/cookie-shaka.js"></script>



</body>

</html>
