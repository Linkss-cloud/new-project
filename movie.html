<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Player</title>

<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    width:100%;
    height:100%;
    background:#000;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}


/* Player container */
.video-container{
    width:100vw;
    max-width:100vw;
}


/* Video */
video{
    width:100%;
    height:auto;
    display:block;
}


/* Plyr color */
.plyr{
    --plyr-color-main:#00bcd4;
}


/* Fullscreen Fix */
.plyr--fullscreen-active{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
}


.plyr--fullscreen-active .plyr__video-wrapper{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}


.plyr--fullscreen-active video{
    width:100%;
    height:100%;
    object-fit:contain;
}


/* Mobile fullscreen */
@media(max-width:768px){

    .video-container{
        width:100vw;
    }

    .plyr--fullscreen-active video{
        object-fit:contain;
    }

}

</style>

</head>

<body>


<div class="video-container">

    <video id="video-player" playsinline controls>

        <source 
        src="https://dd-stream.vercel.app/download?path=6a7574d5ac7f37d1039ac097"
        type="video/mp4">

    </video>

</div>



<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>


<script>

const player = new Plyr('#video-player', {

    controls:[
        'play-large',
        'play',
        'progress',
        'current-time',
        'mute',
        'volume',
        'captions',
        'settings',
        'pip',
        'airplay',
        'fullscreen'
    ],

    seekTime:10,

    keyboard:{
        focused:true,
        global:true
    }

});

</script>


</body>
</html>
