<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPORTS ZONE - Video Player</title>

<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}


/* VIDEO HIDDEN UNTIL TELEGRAM CLOSE */

.video-container{
    width:100vw;
    max-width:100vw;
    display:none;
}


video{
    width:100%;
    height:auto;
    display:block;
}


.plyr{
    --plyr-color-main:#00bcd4;
}


.plyr--fullscreen-active{
    width:100%;
    height:100%;
    background:#000;
}


/* TELEGRAM POPUP */

.telegram-overlay{

    display:block;

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.8);

    z-index:99999;

}


.telegram-box{

    width:320px;

    background:#fff;

    color:#111;

    padding:25px;

    border-radius:15px;

    text-align:center;

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    font-family:Arial;

}


.telegram-box h2{

    margin-bottom:15px;

}


.telegram-box p{

    margin-bottom:20px;

}


.telegram-btn{

    background:#0088cc;

    color:#fff;

    padding:12px 25px;

    border-radius:8px;

    text-decoration:none;

    display:inline-block;

}


.close-btn{

    position:absolute;

    right:15px;

    top:10px;

    font-size:25px;

    cursor:pointer;

}


</style>

</head>


<body>



<!-- VIDEO PLAYER -->

<div class="video-container">

<video id="video-player" playsinline controls>

<source

src="https://dd-stream.vercel.app/download?path=6a7574d5ac7f37d1039ac097"

type="video/mp4">

</video>

</div>




<!-- TELEGRAM POPUP -->

<div class="telegram-overlay" id="telegramPopup">


<div class="telegram-box">


<span class="close-btn" onclick="closeTelegram()">×</span>


<h2>Join Our Telegram</h2>


<p>Get latest updates and videos.</p>


<a class="telegram-btn"

href="https://t.me/your_channel_name"

target="_blank">

Join Telegram

</a>


</div>

</div>





<!-- AD SCRIPT -->

<script id="aclib" type="text/javascript" src="//acscdn.com/script/aclib.js"></script>





<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>



<script>


const player = new Plyr('#video-player',{


controls:[

'play-large',

'play',

'progress',

'current-time',

'mute',

'volume',

'captions',

'settings',

'pip',

'airplay',

'fullscreen'

],


seekTime:10,


keyboard:{

focused:true,

global:true

}


});





function showAd(){


try{


aclib.runPop({

zoneId:'11800802'

});


}

catch(e){

console.log(e);

}


}





function closeTelegram(){


// hide telegram

document.getElementById("telegramPopup").style.display="none";



// show ad once

showAd();



// load player after delay


setTimeout(function(){


document.querySelector(".video-container").style.display="block";


player.play();


},3000);



}



</script>



</body>

</html>
