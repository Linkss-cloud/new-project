<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPORTS ZONE - Video Player</title>

<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    background:#000;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}


/* VIDEO HIDDEN UNTIL TELEGRAM CLOSE */

.video-container{
    width:100vw;
    max-width:100vw;
    display:none;
}


video{
    width:100%;
    height:auto;
    display:block;
}


.plyr{
    --plyr-color-main:#00bcd4;
}


.plyr--fullscreen-active{
    width:100%;
    height:100%;
    background:#000;
}


/* TELEGRAM POPUP */

.telegram-overlay{

    display:block;

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.8);

    z-index:99999;

}


.telegram-box{

    width:320px;

    background:#fff;

    color:#111;

    padding:25px;

    border-radius:15px;

    text-align:center;

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    font-family:Arial;

}


.telegram-box h2{

    margin-bottom:15px;

}


.telegram-box p{

    margin-bottom:20px;

}


.telegram-btn{

    background:#0088cc;

    color:#fff;

    padding:12px 25px;

    border-radius:8px;

    text-decoration:none;

    display:inline-block;

}


.close-btn{

    position:absolute;

    right:15px;
    top:10px;

    font-size:25px;

    cursor:pointer;

}


</style>

</head>


<body>


<!-- =========================
     VIDEO PLAYER
========================= -->

<div class="video-container">

    <video id="video-player" playsinline controls>

        <source
            src="https://dd-stream.vercel.app/download?path=6a7574d5ac7f37d1039ac097"
            type="video/mp4">

    </video>

</div>



<!-- =========================
     TELEGRAM POPUP
========================= -->

<div class="telegram-overlay" id="telegramPopup">

    <div class="telegram-box">

        <span
            class="close-btn"
            onclick="closeTelegram()">
            ×
        </span>

        <h2>Join Our Telegram</h2>

        <p>Get latest updates and videos.</p>

        <a
            class="telegram-btn"
            href="https://t.me/+rtK_sfY8t_A2NDU1"
            target="_blank">

            Join Telegram

        </a>

    </div>

</div>



<!-- =========================
     AD SCRIPT
========================= -->

<script
    id="aclib"
    type="text/javascript"
    src="//acscdn.com/script/aclib.js">
</script>



<!-- =========================
     PLYR
========================= -->

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>



<script>


// ===============================
// PLYR PLAYER
// ===============================

const player = new Plyr('#video-player', {

    controls: [

        'play-large',
        'play',
        'progress',
        'current-time',
        'mute',
        'volume',
        'captions',
        'settings',
        'pip',
        'airplay',
        'fullscreen'

    ],

    seekTime: 10,

    keyboard: {

        focused: true,
        global: true

    }

});



// ===============================
// AD CONTROL
// ===============================

// 1 HOUR = 60 MINUTES
const AD_COOLDOWN = 60 * 60 * 1000;


// First ad status
let firstAdShown = false;


// Is the next ad allowed?
let adReady = false;


// Prevent duplicate click/touch
let interactionLocked = false;



// ===============================
// SHOW AD
// ===============================

function showAd(){

    // Prevent duplicate trigger
    if(interactionLocked){

        return;

    }


    interactionLocked = true;


    try{

        aclib.runPop({

            zoneId: '11800802'

        });


        // Start 1-hour cooldown
        adReady = false;


        setTimeout(function(){

            // After 1 hour,
            // next user interaction can trigger ad

            adReady = true;

        }, AD_COOLDOWN);


    }
    catch(e){

        console.log("Ad error:", e);

    }


    // Prevent duplicate click/touch
    setTimeout(function(){

        interactionLocked = false;

    }, 1000);

}



// ===============================
// TELEGRAM POPUP CLOSE
// ===============================

function closeTelegram(){

    // Hide Telegram popup
    document.getElementById("telegramPopup").style.display = "none";


    // ===========================
    // FIRST AD
    // ===========================

    if(!firstAdShown){

        firstAdShown = true;


        // Show ad immediately
        showAd();

    }


    // ===========================
    // LOAD VIDEO PLAYER
    // ===========================

    setTimeout(function(){

        document.querySelector(".video-container").style.display = "block";


        // Try autoplay
        player.play().catch(function(error){

            console.log("Autoplay blocked:", error);

        });

    }, 3000);

}



// ===============================
// USER INTERACTION
// ===============================

function handleUserInteraction(){

    // Telegram popup hasn't been closed
    if(!firstAdShown){

        return;

    }


    // 1-hour cooldown is still active
    if(!adReady){

        return;

    }


    // Cooldown finished
    // Show ad on next user interaction
    showAd();

}



// ===============================
// DESKTOP CLICK
// ===============================

document.addEventListener("click", function(){

    handleUserInteraction();

});



// ===============================
// MOBILE TOUCH
// ===============================

document.addEventListener("touchend", function(){

    handleUserInteraction();

});


</script>


</body>

</html>
