<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportlink-Sayan10 | Premium Live Sports Streaming Hub</title>
    <meta name="description" content="Sportlink-18 - Your premium destination for live sports streaming across all platforms worldwide.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #06080d;
            --bg-secondary: #0c1017;
            --accent-cyan: #00c6ff;
            --accent-purple: #7b2fff;
            --accent-blue: #0072ff;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.35);
            --shadow-glow: 0 0 40px rgba(0, 198, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background Canvas */
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Geometric overlay */
        .geo-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .geo-overlay svg {
            width: 100%;
            height: 100%;
            opacity: 0.12;
        }

        /* Main Wrapper */
        .wrapper {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 48px 24px 80px;
        }

        /* Header */
        .hub-header {
            text-align: center;
            margin-bottom: 52px;
            animation: fadeDown 0.8s ease both;
        }

        .hub-logo {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 4px;
        }

        .hub-icon {
            width: 52px;
            height: 52px;
            animation: spinPulse 3s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(0, 198, 255, 0.6));
        }

        .hub-title {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--text-primary);
        }

        .hub-title span {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hub-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 400;
            margin-top: 8px;
        }

        /* Cards Grid - always 2 columns minimum */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        /* Card */
        .card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px 14px 20px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            cursor: pointer;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at 50% 0%, var(--card-accent, rgba(0, 198, 255, 0.08)), transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 0;
        }

        .card::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 20%;
            right: 20%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--card-accent-solid, var(--accent-cyan)), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4), var(--shadow-glow);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card:hover::after {
            opacity: 1;
        }

        /* Card accent colors */
        .card[data-accent="orange"] {
            --card-accent: rgba(255, 165, 0, 0.1);
            --card-accent-solid: #ff9500;
        }

        .card[data-accent="blue"] {
            --card-accent: rgba(0, 114, 255, 0.1);
            --card-accent-solid: #0072ff;
        }

        .card[data-accent="red"] {
            --card-accent: rgba(255, 50, 50, 0.1);
            --card-accent-solid: #ff3232;
        }

        .card[data-accent="purple"] {
            --card-accent: rgba(123, 47, 255, 0.1);
            --card-accent-solid: #7b2fff;
        }

        .card[data-accent="green"] {
            --card-accent: rgba(0, 200, 83, 0.1);
            --card-accent-solid: #00c853;
        }

        .card[data-accent="yellow"] {
            --card-accent: rgba(255, 214, 0, 0.1);
            --card-accent-solid: #ffd600;
        }

        /* Live indicator dot */
        .live-dot {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 9px;
            height: 9px;
            background: #00e676;
            border-radius: 50%;
            animation: livePulse 2s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(0, 230, 118, 0.6);
            z-index: 2;
        }

        /* Card Logo */
        .card-logo-wrap {
            width: 100%;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            position: relative;
            z-index: 1;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-img img {
            max-width: 80%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 10px;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
            transition: transform 0.4s ease, filter 0.4s ease;
        }

        .card:hover .logo-img img {
            transform: scale(1.08);
            filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.4));
        }

        /* Text fallback when a logo fails to load */
        .logo-fallback {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-align: center;
            opacity: 0.85;
            padding: 0 6px;
        }

        /* Card Name */
        .card-name {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-align: center;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
            line-height: 1.3;
        }

        .card-name small {
            display: block;
            font-size: 0.65rem;
            font-weight: 400;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 3px;
        }

        /* Explore Button */
        .btn-explore {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-secondary);
            transition: all 0.35s ease;
            position: relative;
            z-index: 1;
        }

        .card:hover .btn-explore {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 20px rgba(0, 198, 255, 0.3);
        }

        /* Footer */
        .hub-footer {
            text-align: center;
            margin-top: 64px;
            padding-top: 32px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            animation: fadeUp 0.8s ease 0.5s both;
        }

        .hub-footer p {
            color: var(--text-muted);
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .hub-footer .footer-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 16px;
        }

        .hub-footer .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .hub-footer .footer-links a:hover {
            color: var(--accent-cyan);
        }

        /* Animations */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spinPulse {
            0%, 100% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
        }

        @keyframes livePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card {
            animation: cardIn 0.7s ease both;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .wrapper {
                padding: 28px 12px 60px;
            }

            .hub-title {
                font-size: 1.3rem;
            }

            .hub-subtitle {
                font-size: 0.68rem;
                letter-spacing: 1.5px;
            }

            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .card {
                padding: 20px 10px 16px;
                border-radius: 16px;
            }

            .card-logo-wrap {
                height: 75px;
            }

            .card-name {
                font-size: 0.82rem;
            }

            .btn-explore {
                padding: 7px 14px;
                font-size: 0.65rem;
            }
        }

        @media (min-width: 481px) and (max-width: 768px) {
            .wrapper {
                padding: 32px 16px 60px;
            }

            .hub-title {
                font-size: 1.5rem;
            }

            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .cards-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 1025px) {
            .cards-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }
    </style>
</head>

<body>

    <canvas id="canvas"></canvas>

    <!-- Geometric Overlay -->
    <div class="geo-overlay">
        <svg viewBox="0 0 1440 900" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#00c6ff" stop-opacity="0.3" />
                    <stop offset="100%" stop-color="#7b2fff" stop-opacity="0.1" />
                </linearGradient>
            </defs>
            <line x1="0" y1="0" x2="1440" y2="900" stroke="url(#lineGrad)" stroke-width="0.5" />
            <line x1="1440" y1="0" x2="0" y2="900" stroke="url(#lineGrad)" stroke-width="0.5" />
            <line x1="720" y1="0" x2="720" y2="900" stroke="url(#lineGrad)" stroke-width="0.3" />
            <line x1="0" y1="450" x2="1440" y2="450" stroke="url(#lineGrad)" stroke-width="0.3" />
            <circle cx="720" cy="450" r="200" stroke="url(#lineGrad)" stroke-width="0.5" fill="none" />
            <circle cx="720" cy="450" r="350" stroke="url(#lineGrad)" stroke-width="0.3" fill="none" />
        </svg>
    </div>

    <div class="wrapper">

        <!-- Header -->
        <header class="hub-header">
            <div class="hub-logo">
                <svg class="hub-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="24" cy="24" r="20" stroke="#00c6ff" stroke-width="1.5" fill="none" opacity="0.5" />
                    <ellipse cx="24" cy="24" rx="12" ry="20" stroke="#00c6ff" stroke-width="1" fill="none" opacity="0.4" />
                    <line x1="4" y1="24" x2="44" y2="24" stroke="#00c6ff" stroke-width="0.8" opacity="0.3" />
                    <line x1="24" y1="4" x2="24" y2="44" stroke="#00c6ff" stroke-width="0.8" opacity="0.3" />
                    <circle cx="32" cy="22" r="3.5" fill="#00c6ff" opacity="0.9" />
                    <circle cx="32" cy="22" r="1.5" fill="#fff" />
                    <path d="M35 14 Q42 20 38 30" stroke="#7b2fff" stroke-width="1.5" stroke-linecap="round" fill="none" />
                    <path d="M38 11 Q48 20 43 34" stroke="#7b2fff" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.6" />
                </svg>
                <span class="hub-title">Sportlink <span>Live TV</span> Hub</span>
            </div>
            <p class="hub-subtitle">Live Sports &bull; All Platforms &bull; Worldwide</p>
        </header>

        <!-- Cards Grid -->
        <div class="cards-grid" id="hubs-grid">
            <!-- Cards injected by JS -->
        </div>

        <!-- Footer -->
        <footer class="hub-footer">
            <p>&copy; 2026 Sportlink; All Rights Reserved by Sayan Pal.</p>
        </footer>

    </div>

    <script>
        /* ------------------------------------------------------------------
           HUB DATA — all URLs now on sportlink10-ajp.pages.dev
        ------------------------------------------------------------------ */
        const HUBS = [
            {
                name: "FanCode",
                subtitle: "India",
                url: "https://sportlink10-ajp.pages.dev/fancode",
                logo: "logos/fancode.jpg",
                accent: "orange"
            },
            {
                name: "Jio TV",
                subtitle: "India",
                url: "https://sportlink10-ajp.pages.dev/jtv",
                logo: "logos/Jio_Tv_logo.jpg",
                accent: "blue"
            },
            {
                name: "Sony Network",
                subtitle: "India",
                url: "https://sportlink10-ajp.pages.dev/sony",
                logo: "logos/SonyLIV.jpg",
                accent: "blue"
            },
            {
                name: "ZEE Network",
                subtitle: "India",
                url: "https://sportlink10-ajp.pages.dev/zee",
                logo: "logos/zee.png",
                accent: "blue"
            },
            {
                name: "Jio TV +",
                subtitle: "India",
                url: "https://sportlink10-ajp.pages.dev/jtv",
                logo: "logos/Jio_Tv_logo.jpg",
                accent: "blue"
            },
            {
                name: "Star Sports",
                subtitle: "India",
                url: "https://sportlink10-ajp.pages.dev/star",
                logo: "logos/starsports.jpg",
                accent: "red"
            },
            {
                name: "Willow Sports",
                subtitle: "India",
                url: "https://sportlink10-ajp.pages.dev/willow",
                logo: "logos/willow.jpg",
                accent: "blue"
            },
            {
                name: "Kids",
                subtitle: "India",
                url: "https://sportlink10-ajp.pages.dev/kid",
                logo: "logos/kid.jpg",
                accent: "yellow"
            },
            {
                name: "Star Sports",
                subtitle: "India",
                url: "https://sportlink10-ajp.pages.dev/star",
                logo: "logos/starsports.jpg",
                accent: "red"
            },
            {
                name: "Jio TV +",
                subtitle: "India",
                url: "https://sportlink10-ajp.pages.dev/jtv",
                logo: "logos/Jio_Tv_logo.jpg",
                accent: "blue"
            }
        ];

        /* ------------------------------------------------------------------
           RENDER
        ------------------------------------------------------------------ */
        function renderCards(hubs, grid) {
            const frag = document.createDocumentFragment();

            hubs.forEach((hub, index) => {
                const card = document.createElement('a');
                card.className = 'card';
                card.href = hub.url;
                card.target = '_blank';
                card.rel = 'noopener noreferrer';
                card.setAttribute('data-accent', hub.accent || 'blue');
                card.style.animationDelay = `${(index + 1) * 0.08}s`;

                card.innerHTML = `
                    <div class="live-dot"></div>
                    <div class="card-logo-wrap">
                        <div class="logo-img">
                            <img src="${hub.logo}" alt="${hub.name} logo" loading="lazy">
                        </div>
                    </div>
                    <div class="card-name">${hub.name}<small>${hub.subtitle}</small></div>
                    <span class="btn-explore">Explore</span>
                `;

                // Graceful logo fallback (text label) if the image is missing
                const img = card.querySelector('img');
                img.addEventListener('error', () => {
                    const wrap = card.querySelector('.logo-img');
                    wrap.innerHTML = '';
                    const span = document.createElement('span');
                    span.className = 'logo-fallback';
                    span.textContent = hub.name;
                    wrap.appendChild(span);
                }, { once: true });

                frag.appendChild(card);
            });

            grid.innerHTML = '';
            grid.appendChild(frag);
        }

        /* Tries hubs.json first (so you can update content without touching
           the HTML), then falls back to the embedded HUBS array above. */
        async function loadHubs() {
            const grid = document.getElementById('hubs-grid');
            try {
                const res = await fetch('hubs.json', { cache: 'no-store' });
                if (!res.ok) throw new Error('hubs.json not available');
                const data = await res.json();
                if (Array.isArray(data) && data.length) {
                    renderCards(data, grid);
                    return;
                }
                throw new Error('hubs.json is empty');
            } catch (err) {
                renderCards(HUBS, grid);
            }
        }

        loadHubs();

        /* ------------------------------------------------------------------
           PARTICLE BACKGROUND
        ------------------------------------------------------------------ */
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let W, H;
        const DOTS = [];
        const DOT_COUNT = 90;
        const MAX_DIST = 140;

        function initCanvas() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            DOTS.length = 0;
            for (let i = 0; i < DOT_COUNT; i++) {
                DOTS.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    r: Math.random() * 2 + 0.8,
                    alpha: Math.random() * 0.4 + 0.15
                });
            }
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();

        function draw() {
            ctx.clearRect(0, 0, W, H);

            DOTS.forEach(d => {
                d.x += d.vx;
                d.y += d.vy;
                if (d.x < 0) d.x = W;
                if (d.x > W) d.x = 0;
                if (d.y < 0) d.y = H;
                if (d.y > H) d.y = 0;

                ctx.beginPath();
                ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0,198,255,${d.alpha})`;
                ctx.fill();
            });

            for (let i = 0; i < DOTS.length; i++) {
                for (let j = i + 1; j < DOTS.length; j++) {
                    const dx = DOTS[i].x - DOTS[j].x;
                    const dy = DOTS[i].y - DOTS[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < MAX_DIST) {
                        ctx.beginPath();
                        ctx.moveTo(DOTS[i].x, DOTS[i].y);
                        ctx.lineTo(DOTS[j].x, DOTS[j].y);
                        ctx.strokeStyle = `rgba(0,198,255,${0.07 * (1 - dist / MAX_DIST)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(draw);
        }

        draw();
    </script>

</body>

</html>
