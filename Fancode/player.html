<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="referrer" content="no-referrer">

    <title>SPORTS ZONE – Live Player</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">


    <script src="https://cdn.jsdelivr.net/npm/shaka-player@5.1.10/dist/shaka-player.ui.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@5.1.10/dist/controls.min.css">

    <link rel="stylesheet" href="player.css">


</head>


<body>


<header class="player-header">

    <div class="player-header-inner">


        <a href="index.html" class="player-brand gradient-text">
            SPORTS ZONE
        </a>



        <a href="https://t.me/+rtK_sfY8t_A2NDU1"
           target="_blank"
           rel="noopener noreferrer"
           class="btn-telegram">


            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">


                <line x1="22" y1="2" x2="11" y2="13"></line>

                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>


            </svg>


            <span>JOIN TELEGRAM</span>


        </a>


    </div>


</header>





<main class="player-container">



    <div class="match-header-info">


        <div class="match-titles">


            <div class="title-row">


                <span class="live-indicator">
                    LIVE
                </span>


                <h1 id="matchName">
                    LOADING MATCH...
                </h1>


            </div>



            <h2 id="matchTitle">
                PLEASE WAIT
            </h2>


        </div>





        <div class="match-badges">


            <div class="badge-item">
                ANDROID
            </div>


            <div class="badge-item">
                IOS
            </div>


            <div class="badge-item">
                DESKTOP
            </div>


            <div class="badge-item">
                SMART TV
            </div>


        </div>



    </div>






    <div class="video-wrapper shaka-video-container" id="videoContainer">


        <video id="videoPlayer"
               playsinline
               autoplay
               muted
               style="width:100%;height:100%;background-color:transparent!important;">
        </video>


    </div>






    <div id="serverList" class="server-list">

    </div>




</main>







<footer class="player-footer">


    <p>
        © SPORTS ZONE • ALL RIGHTS RESERVED
    </p>


</footer>







<!-- PLAYER JS -->

<script type="module" src="player.js"></script>






<!-- ACLIB AD POPUP -->

<script id="aclib" type="text/javascript" src="//acscdn.com/script/aclib.js"></script>

<script type="text/javascript">

    aclib.runPop({

        zoneId: '11800802',

    });

</script>






</body>

</html>
