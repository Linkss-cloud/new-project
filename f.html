<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Sports Zone - Live Player</title>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#main-iframe {
    position: fixed;
    inset: 0;
    width: 1000vw;
    height: 1000vh;
    min-width: 100vw;
    min-height: 100vh;
    border: none;
    margin: 0;
    padding: 0;
    display: block;
    background: #000;
}

.error-msg {
    color: #fff;
    text-align: center;
    font-family: Arial, sans-serif;
    position: fixed;
    width: 100%;
    top: 50%;
    left: 0;
    transform: translateY(-50%);
    margin: 0;
    z-index: 9999;
}
</style>
</head>

<body>

<iframe
    id="main-iframe"
    allowfullscreen
    allow="encrypted-media; fullscreen; autoplay; picture-in-picture">
</iframe>

<script>
const urlParams = new URLSearchParams(window.location.search);
const id = urlParams.get("id");

const iframe = document.getElementById("main-iframe");

if (id) {

    fetch("https://cricketttttt.pages.dev/Secure/frame.json")
        .then(function(response) {

            if (!response.ok) {
                throw new Error("JSON load failed");
            }

            return response.json();
        })

        .then(function(data) {

            if (data[id]) {

                iframe.src = data[id];

            } else {

                showError("Stream not found");

            }

        })

        .catch(function(error) {

            console.error(error);
            showError("Error loading stream");

        });

} else {

    showError("No ID provided");

}


function showError(message) {

    iframe.style.display = "none";

    const error = document.createElement("div");

    error.className = "error-msg";
    error.textContent = message;

    document.body.appendChild(error);
}
</script>

</body>
</html>
