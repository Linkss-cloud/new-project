<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,
           maximum-scale=1,user-scalable=no">

<title>SPORTLINK</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #070710;
  color: #e2e8f0;
  font-family: Arial, sans-serif;
}

body {
  overflow: hidden;
}

#app {
  width: 100%;
  height: 100%;
}

#loading {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #070710;
  z-index: 100;
}

.loader {
  width: 42px;
  height: 42px;
  border: 4px solid #25253d;
  border-top-color: #6366f1;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

#list {
  width: 100%;
  height: 100%;
  overflow-y: auto;
  padding: 20px;
}

header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}

.logo {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    linear-gradient(135deg,#6366f1,#ec4899);
  font-size: 20px;
}

h1 {
  margin: 0;
  font-size: 21px;
}

.subtitle {
  color: #64748b;
  font-size: 11px;
  margin-top: 3px;
}

#search {
  width: 100%;
  padding: 13px 15px;
  border-radius: 12px;
  border: 1px solid #25253d;
  outline: none;
  background: #111122;
  color: white;
  margin-bottom: 15px;
}

#search:focus {
  border-color: #6366f1;
}

#channels {
  display: grid;
  grid-template-columns:
    repeat(auto-fill,minmax(145px,1fr));
  gap: 12px;
}

.channel {
  position: relative;
  min-height: 125px;
  padding: 15px;
  border-radius: 15px;
  background: #101020;
  border: 1px solid #25253d;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 9px;
  transition: .2s;
}

.channel:hover {
  transform: translateY(-2px);
  border-color: #6366f1;
}

.channel img {
  max-width: 90px;
  max-height: 48px;
  object-fit: contain;
}

.channel-name {
  text-align: center;
  font-size: 12px;
  font-weight: 600;
}

.source {
  position: absolute;
  top: 7px;
  right: 7px;
  padding: 3px 7px;
  border-radius: 8px;
  font-size: 8px;
  background: #1d1d38;
  color: #818cf8;
}

#player {
  position: fixed;
  inset: 0;
  background: #000;
  display: none;
}

#video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

#back {
  position: absolute;
  top: 15px;
  left: 15px;
  z-index: 10;
  border: 0;
  border-radius: 10px;
  padding: 9px 13px;
  color: white;
  background: rgba(0,0,0,.65);
  cursor: pointer;
}

#message {
  position: fixed;
  left: 50%;
  bottom: 25px;
  transform: translateX(-50%);
  padding: 10px 15px;
  border-radius: 10px;
  background: rgba(20,20,35,.95);
  color: #cbd5e1;
  font-size: 12px;
  display: none;
  z-index: 200;
}
</style>
</head>

<body>

<div id="app">

  <div id="loading">
    <div class="loader"></div>
  </div>

  <section id="list">

    <header>
      <div class="logo">⚡</div>

      <div>
        <h1>SPORTLINK</h1>

        <div class="subtitle">
          Unified FC · WC · JTV · ST · SY
        </div>
      </div>
    </header>

    <input
      id="search"
      type="search"
      placeholder="Search channels..."
      autocomplete="off">

    <div id="channels"></div>

  </section>

  <section id="player">

    <button id="back">
      ← Back
    </button>

    <video
      id="video"
      controls
      playsinline
      webkit-playsinline>
    </video>

  </section>

</div>

<div id="message"></div>

<script>
"use strict";


// ============================================================
// CONFIG
// ============================================================

const WORKER_URL =
  "https://YOUR-WORKER.YOUR-SUBDOMAIN.workers.dev";


// ============================================================
// ELEMENTS
// ============================================================

const loading =
  document.getElementById("loading");

const list =
  document.getElementById("list");

const channelsEl =
  document.getElementById("channels");

const search =
  document.getElementById("search");

const player =
  document.getElementById("player");

const video =
  document.getElementById("video");

const back =
  document.getElementById("back");

const message =
  document.getElementById("message");


// ============================================================
// SOURCE ROUTER
// ============================================================

function getSource(id) {

  const value =
    String(id || "")
      .trim()
      .toLowerCase();

  const sources = [
    "fc",
    "wc",
    "jtv",
    "st",
    "sy"
  ];

  for (const source of sources) {
    if (
      value.startsWith(
        source + "-"
      )
    ) {
      return source;
    }
  }

  return null;
}


// ============================================================
// MESSAGE
// ============================================================

function showMessage(text) {

  message.textContent = text;
  message.style.display = "block";

  clearTimeout(
    showMessage.timer
  );

  showMessage.timer =
    setTimeout(() => {
      message.style.display = "none";
    }, 4000);
}


// ============================================================
// AUTH
// ============================================================

async function authenticate() {

  const existing =
    sessionStorage.getItem(
      "sportlink_token"
    );

  if (existing) {
    return existing;
  }

  const response =
    await fetch(
      WORKER_URL +
      "/api/auth",
      {
        method: "POST",
        cache: "no-store"
      }
    );

  if (!response.ok) {
    throw new Error(
      "Authentication failed"
    );
  }

  const result =
    await response.json();

  if (
    !result.success ||
    !result.token
  ) {
    throw new Error(
      result.error ||
      "Authentication failed"
    );
  }

  sessionStorage.setItem(
    "sportlink_token",
    result.token
  );

  return result.token;
}


// ============================================================
// API
// ============================================================

async function api(id) {

  const source =
    getSource(id);

  if (!source) {
    throw new Error(
      "Unknown source: " + id
    );
  }

  const token =
    await authenticate();

  const url =
    WORKER_URL +
    "/api/events?ssid=" +
    encodeURIComponent(source) +
    "&id=" +
    encodeURIComponent(id);

  const response =
    await fetch(
      url,
      {
        method: "GET",
        cache: "no-store",
        headers: {
          "Authorization":
            "Bearer " + token
        }
      }
    );

  if (
    response.status === 401
  ) {
    sessionStorage.removeItem(
      "sportlink_token"
    );

    throw new Error(
      "Session expired. Please try again."
    );
  }

  if (!response.ok) {
    throw new Error(
      "API error " +
      response.status
    );
  }

  const result =
    await response.json();

  if (!result.success) {
    throw new Error(
      result.error ||
      "API error"
    );
  }

  return result;
}


// ============================================================
// OPEN CHANNEL
// ============================================================

async function openChannel(id) {

  const source =
    getSource(id);

  if (!source) {
    showMessage(
      "Unknown stream source"
    );

    return;
  }

  showMessage(
    "Loading " +
    source.toUpperCase() +
    "..."
  );

  try {

    const result =
      await api(id);

    await playAuthorizedStream(
      result
    );

  } catch (error) {

    console.error(error);

    showMessage(
      error.message ||
      "Unable to load channel"
    );
  }
}


// ============================================================
// PLAY AUTHORIZED STREAM
// ============================================================

async function playAuthorizedStream(
  result
) {

  const data =
    result.data || {};

  const streamUrl =
    data.stream_url ||
    data.playback_url ||
    data.url;

  if (!streamUrl) {
    throw new Error(
      "No authorized playback URL returned"
    );
  }

  list.style.display =
    "none";

  player.style.display =
    "block";

  video.pause();

  video.removeAttribute(
    "src"
  );

  video.load();

  video.src =
    streamUrl;

  try {

    await video.play();

  } catch (_) {

    showMessage(
      "Press play to start"
    );
  }
}


// ============================================================
// BACK
// ============================================================

back.addEventListener(
  "click",
  () => {

    video.pause();

    video.removeAttribute(
      "src"
    );

    video.load();

    player.style.display =
      "none";

    list.style.display =
      "block";

    history.replaceState(
      null,
      "",
      location.pathname
    );
  }
);


// ============================================================
// DIRECT ?id=... SUPPORT
// ============================================================

async function boot() {

  loading.style.display =
    "flex";

  try {

    const params =
      new URLSearchParams(
        location.search
      );

    const id =
      params.get("id");

    if (id) {

      list.style.display =
        "none";

      await openChannel(
        id
      );

      return;
    }

    /*
     * List mode.
     *
     * The Worker currently provides item-by-ID access.
     * Put your own authorized channel catalog here if
     * you want the home page to display all channels.
     */

    channelsEl.innerHTML = `
      <div style="
        grid-column:1/-1;
        text-align:center;
        color:#64748b;
        padding:50px 20px;">
        Open a channel link using ?id=...
      </div>
    `;

  } catch (error) {

    console.error(error);

    showMessage(
      error.message ||
      "Unable to initialize"
    );

  } finally {

    loading.style.display =
      "none";
  }
}


// ============================================================
// SEARCH
// ============================================================

search.addEventListener(
  "input",
  () => {

    const query =
      search.value
        .trim()
        .toLowerCase();

    const cards =
      document.querySelectorAll(
        ".channel"
      );

    cards.forEach(card => {

      const name =
        card
          .querySelector(
            ".channel-name"
          )
          ?.textContent
          .toLowerCase() || "";

      card.style.display =
        !query ||
        name.includes(query)
          ? ""
          : "none";
    });
  }
);


// ============================================================
// START
// ============================================================

document.addEventListener(
  "DOMContentLoaded",
  boot
);
</script>

</body>
</html>
