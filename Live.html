<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Sportlink TV</title>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.compiled.js"></script>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080a0f;
    color: #f8fafc;
    font-family: Arial, sans-serif;
}

header {
    padding: 18px;
    background: #10131a;
    border-bottom: 1px solid #252b36;
}

header h1 {
    margin: 0;
    color: #f97316;
}

header p {
    margin: 5px 0 0;
    color: #94a3b8;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.status {
    padding: 12px;
    margin-bottom: 18px;
    border-radius: 10px;
    background: #111827;
    color: #94a3b8;
}

.status.ok {
    color: #10b981;
}

.status.error {
    color: #ef4444;
}

.events {
    display: grid;
    gap: 15px;
}

.event {
    background: #11141c;
    border: 1px solid #252b36;
    border-radius: 16px;
    overflow: hidden;
}

.event-image {
    width: 100%;
    height: 170px;
    object-fit: cover;
    background: #1e293b;
}

.event-content {
    padding: 16px;
}

.event-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 7px;
}

.event-category {
    color: #94a3b8;
    font-size: 13px;
    margin-bottom: 12px;
}

.streams {
    display: flex;
    gap: 8px;
    overflow-x: auto;
}

.stream-btn {
    flex-shrink: 0;
    padding: 10px 14px;
    border: 0;
    border-radius: 9px;
    background: #1e293b;
    color: white;
    cursor: pointer;
}

.stream-btn:hover {
    background: #f97316;
    color: #000;
}

.badge {
    font-size: 10px;
    padding: 3px 6px;
    margin-left: 5px;
    border-radius: 5px;
    background: #334155;
}

.player-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #000;
}

.player-modal.open {
    display: flex;
    flex-direction: column;
}

.player-header {
    height: 55px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 15px;
    background: #0f1117;
}

.close-btn {
    width: 35px;
    height: 35px;
    border: 0;
    border-radius: 50%;
    background: #1e293b;
    color: white;
    cursor: pointer;
}

.player-title {
    font-weight: bold;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-area {
    flex: 1;
    min-height: 0;
    background: black;
    display: flex;
    align-items: center;
    justify-content: center;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.player-status {
    position: absolute;
    top: 65px;
    right: 15px;
    padding: 7px 12px;
    background: #1e293b;
    border-radius: 20px;
    font-size: 12px;
}

.loading {
    text-align: center;
    color: #64748b;
    padding: 40px;
}

</style>

</head>

<body>

<header>

<h1>⚽ Sportlink TV</h1>

<p>Live Sports</p>

</header>


<div class="container">

<div
    id="status"
    class="status"
>
Connecting...
</div>

<div
    id="events"
    class="events"
>
<div class="loading">
Loading events...
</div>
</div>

</div>


<!-- PLAYER -->

<div
    id="playerModal"
    class="player-modal"
>

<div class="player-header">

<button
    class="close-btn"
    onclick="closePlayer()"
>
✕
</button>

<div
    id="playerTitle"
    class="player-title"
>
Loading...
</div>

</div>

<div class="player-area">

<video
    id="video"
    controls
    playsinline
></video>

<div
    id="playerStatus"
    class="player-status"
>
Idle
</div>

</div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API_URL =
    "https://sportlink-api.movieszonemedia.workers.dev";


/* =========================================================
   STATE
========================================================= */

let token = null;

let shakaPlayer = null;

let hlsPlayer = null;


/* =========================================================
   ELEMENTS
========================================================= */

const statusEl =
    document.getElementById("status");

const eventsEl =
    document.getElementById("events");

const modal =
    document.getElementById("playerModal");

const video =
    document.getElementById("video");

const playerTitle =
    document.getElementById("playerTitle");

const playerStatus =
    document.getElementById("playerStatus");


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    text,
    type = ""
) {

    statusEl.textContent = text;

    statusEl.className =
        "status " + type;
}


function setPlayerStatus(text) {

    playerStatus.textContent = text;
}


/* =========================================================
   AUTH
========================================================= */

async function getToken() {

    const response =
        await fetch(
            API_URL + "/api/auth",
            {
                method: "POST"
            }
        );

    const data =
        await response.json();

    if (
        !response.ok ||
        !data.token
    ) {

        throw new Error(
            data.error ||
            "Authentication failed"
        );
    }

    token =
        data.token;

    return token;
}


/* =========================================================
   EVENTS
========================================================= */

async function getEvents() {

    if (!token) {
        await getToken();
    }

    let response =
        await fetch(
            API_URL + "/api/events",
            {
                headers: {
                    Authorization:
                        "Bearer " + token
                }
            }
        );


    /*
     * Token expired.
     */

    if (response.status === 401) {

        token = null;

        await getToken();

        response =
            await fetch(
                API_URL + "/api/events",
                {
                    headers: {
                        Authorization:
                            "Bearer " + token
                    }
                }
            );
    }


    const data =
        await response.json();


    if (!response.ok) {

        throw new Error(
            data.error ||
            "Events request failed"
        );
    }


    return data;
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================================================
   RENDER
========================================================= */

function renderEvents(data) {

    eventsEl.innerHTML = "";

    const events =
        Array.isArray(data.events)
            ? data.events
            : [];


    if (!events.length) {

        eventsEl.innerHTML =
            '<div class="loading">No events available.</div>';

        return;
    }


    events.forEach(event => {

        const card =
            document.createElement("div");

        card.className =
            "event";


        const title =
            event.title ||
            "Live Event";


        const category =
            event.category ||
            "Sports";


        let imageHTML = "";

        if (event.image) {

            imageHTML = `
                <img
                    class="event-image"
                    src="${escapeHTML(event.image)}"
                    alt=""
                    loading="lazy"
                >
            `;
        }


        const streams =
            Array.isArray(event.streams)
                ? event.streams
                : [];


        let streamHTML = "";


        streams.forEach(
            (stream, index) => {

                const type =
                    stream.type === "dash"
                        ? "DASH"
                        : "HLS";


                const button =
                    document.createElement("button");

                button.className =
                    "stream-btn";

                button.innerHTML =
                    `▶ ${escapeHTML(
                        stream.title ||
                        "Stream " + (index + 1)
                    )}
                    <span class="badge">
                        ${type}
                    </span>`;


                button.addEventListener(
                    "click",
                    () => {

                        openPlayer(
                            stream,
                            title
                        );

                    }
                );


                if (!streamHTML) {

                    streamHTML =
                        '<div class="streams"></div>';
                }


                card.appendChild(
                    document.createElement("div")
                );

                setTimeout(() => {

                    const streamBox =
                        card.querySelector(
                            ".streams"
                        );

                    if (streamBox) {
                        streamBox.appendChild(
                            button
                        );
                    }

                }, 0);
            }
        );


        card.innerHTML = `
            ${imageHTML}

            <div class="event-content">

                <div class="event-title">
                    ${escapeHTML(title)}
                </div>

                <div class="event-category">
                    ${escapeHTML(category)}
                </div>

                <div class="streams"></div>

            </div>
        `;


        /*
         * Add stream buttons after innerHTML.
         */

        const streamBox =
            card.querySelector(
                ".streams"
            );


        streams.forEach(
            (stream, index) => {

                const type =
                    stream.type === "dash"
                        ? "DASH"
                        : "HLS";


                const button =
                    document.createElement(
                        "button"
                    );

                button.className =
                    "stream-btn";


                button.innerHTML =
                    `▶ ${escapeHTML(
                        stream.title ||
                        "Stream " + (index + 1)
                    )}
                    <span class="badge">
                        ${type}
                    </span>`;


                button.addEventListener(
                    "click",
                    () => {

                        openPlayer(
                            stream,
                            title
                        );

                    }
                );


                streamBox.appendChild(
                    button
                );
            }
        );


        eventsEl.appendChild(card);

    });
}


/* =========================================================
   DESTROY PLAYER
========================================================= */

async function destroyPlayer() {

    if (shakaPlayer) {

        try {
            await shakaPlayer.destroy();
        } catch {}

        shakaPlayer = null;
    }


    if (hlsPlayer) {

        try {
            hlsPlayer.destroy();
        } catch {}

        hlsPlayer = null;
    }


    video.pause();

    video.removeAttribute("src");

    video.load();
}


/* =========================================================
   OPEN PLAYER
========================================================= */

async function openPlayer(
    stream,
    title
) {

    if (
        !stream ||
        !stream.url
    ) {
        return;
    }


    modal.classList.add("open");

    playerTitle.textContent =
        title || stream.title || "Player";


    await destroyPlayer();


    /*
     * DASH
     */

    if (
        stream.type === "dash"
    ) {

        await playDASH(
            stream.url
        );

        return;
    }


    /*
     * HLS
     */

    if (
        stream.type === "hls"
    ) {

        playHLS(
            stream.url
        );

        return;
    }


    setPlayerStatus(
        "Unknown stream type"
    );
}


/* =========================================================
   SHAKA / DASH
========================================================= */

async function playDASH(url) {

    setPlayerStatus(
        "Loading DASH..."
    );


    if (
        !window.shaka ||
        !shaka.Player.isBrowserSupported()
    ) {

        setPlayerStatus(
            "DASH not supported"
        );

        return;
    }


    shaka.polyfill.installAll();


    shakaPlayer =
        new shaka.Player(video);


    shakaPlayer.addEventListener(
        "error",
        event => {

            console.error(
                "Shaka error:",
                event.detail
            );

            setPlayerStatus(
                "DASH playback error"
            );
        }
    );


    try {

        await shakaPlayer.load(
            url
        );


        await video.play();

        setPlayerStatus(
            "● LIVE"
        );

    } catch (error) {

        console.error(
            error
        );

        setPlayerStatus(
            "DASH unavailable"
        );
    }
}


/* =========================================================
   HLS
========================================================= */

function playHLS(url) {

    setPlayerStatus(
        "Loading HLS..."
    );


    /*
     * Chrome / Android / Desktop
     */

    if (
        window.Hls &&
        Hls.isSupported()
    ) {

        hlsPlayer =
            new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backBufferLength: 30
            });


        hlsPlayer.loadSource(
            url
        );


        hlsPlayer.attachMedia(
            video
        );


        hlsPlayer.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                video
                    .play()
                    .catch(() => {});


                setPlayerStatus(
                    "● LIVE"
                );
            }
        );


        hlsPlayer.on(
            Hls.Events.ERROR,
            (_, data) => {

                if (
                    data.fatal
                ) {

                    console.error(
                        "HLS error:",
                        data
                    );

                    setPlayerStatus(
                        "HLS playback error"
                    );
                }
            }
        );


        return;
    }


    /*
     * Safari / native HLS
     */

    if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src = url;


        video.addEventListener(
            "loadedmetadata",
            () => {

                video
                    .play()
                    .catch(() => {});

                setPlayerStatus(
                    "● LIVE"
                );

            },
            {
                once: true
            }
        );


        return;
    }


    setPlayerStatus(
        "HLS not supported"
    );
}


/* =========================================================
   CLOSE PLAYER
========================================================= */

async function closePlayer() {

    modal.classList.remove(
        "open"
    );

    await destroyPlayer();

    setPlayerStatus(
        "Idle"
    );
}


/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape" &&
            modal.classList.contains("open")
        ) {

            closePlayer();
        }

    }
);


/* =========================================================
   START
========================================================= */

async function init() {

    try {

        setStatus(
            "🔐 Authenticating..."
        );


        const data =
            await getEvents();


        setStatus(
            "✅ API connected — " +
            (data.count || 0) +
            " events",
            "ok"
        );


        renderEvents(
            data
        );


    } catch (error) {

        console.error(
            error
        );


        setStatus(
            "❌ " +
            error.message,
            "error"
        );


        eventsEl.innerHTML = `
            <div class="loading">
                ${escapeHTML(
                    error.message
                )}
            </div>
        `;
    }
}


init();

</script>

</body>
</html>
