<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sportlink TV</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#080b10;
    color:#f8fafc;
    font-family:Inter,Arial,sans-serif;
}

.header{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(12,15,21,.96);
    backdrop-filter:blur(15px);
    border-bottom:1px solid #202631;
    padding:16px;
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    font-size:21px;
    font-weight:800;
    color:#f97316;
}

.logo span{
    color:#fff;
}

.status{
    font-size:12px;
    color:#94a3b8;
}

.container{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:20px 15px 50px;
}

.toolbar{
    display:flex;
    gap:10px;
    overflow-x:auto;
    margin-bottom:20px;
    scrollbar-width:none;
}

.toolbar::-webkit-scrollbar{
    display:none;
}

.filter{
    border:1px solid #26303d;
    background:#11161f;
    color:#94a3b8;
    padding:9px 15px;
    border-radius:30px;
    white-space:nowrap;
    cursor:pointer;
}

.filter.active{
    background:#f97316;
    color:#000;
    border-color:#f97316;
    font-weight:700;
}

.events{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:14px;
}

.event-card{
    background:#11161f;
    border:1px solid #242c38;
    border-radius:16px;
    padding:16px;
    cursor:pointer;
    transition:.2s;
}

.event-card:hover{
    border-color:#f97316;
    transform:translateY(-2px);
}

.event-card:active{
    transform:scale(.98);
}

.event-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:13px;
}

.category{
    color:#38bdf8;
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
}

.live{
    color:#ef4444;
    font-size:11px;
    font-weight:700;
}

.title{
    font-size:16px;
    font-weight:700;
    line-height:1.35;
    margin-bottom:10px;
}

.teams{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    color:#cbd5e1;
    font-size:13px;
}

.vs{
    color:#64748b;
    font-size:11px;
    font-weight:700;
}

.stream-count{
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid #202936;
    color:#94a3b8;
    font-size:11px;
}

.loading,
.error,
.empty{
    padding:40px 20px;
    text-align:center;
    color:#94a3b8;
}

.error{
    color:#ef4444;
}

/* PLAYER */

.player-overlay{
    position:fixed;
    inset:0;
    z-index:1000;
    background:#000;
    display:none;
    flex-direction:column;
}

.player-overlay.open{
    display:flex;
}

.player-header{
    height:58px;
    flex-shrink:0;
    background:#0d1118;
    border-bottom:1px solid #202631;
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 14px;
}

.back{
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:#1d2632;
    color:#fff;
    cursor:pointer;
    font-size:18px;
}

.player-title{
    flex:1;
    min-width:0;
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.player-area{
    position:relative;
    flex:1;
    min-height:0;
    background:#000;
}

video{
    width:100%;
    height:100%;
    display:none;
    background:#000;
    object-fit:contain;
}

.streams{
    display:flex;
    gap:8px;
    overflow-x:auto;
    background:#0d1118;
    padding:12px;
    border-top:1px solid #202631;
    flex-shrink:0;
}

.streams:empty{
    display:none;
}

.stream-btn{
    flex-shrink:0;
    padding:9px 14px;
    border-radius:25px;
    border:1px solid #334155;
    background:#17202c;
    color:#cbd5e1;
    cursor:pointer;
    font-size:12px;
}

.stream-btn.active{
    background:#f97316;
    border-color:#f97316;
    color:#000;
    font-weight:700;
}

.player-message{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
    color:#94a3b8;
}

.player-message.show{
    display:flex;
}

.spinner{
    width:30px;
    height:30px;
    border:3px solid #334155;
    border-top-color:#f97316;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:auto auto 12px;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

@media(max-width:650px){

    .header-inner{
        align-items:flex-start;
        flex-direction:column;
    }

    .events{
        grid-template-columns:1fr;
    }

    .container{
        padding:15px 12px 35px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">
        <div class="logo">
            ⚽ Sportlink <span>TV</span>
        </div>

        <div id="apiStatus" class="status">
            Connecting...
        </div>
    </div>
</header>

<main class="container">

    <div class="toolbar">
        <button class="filter active" data-filter="all">
            All
        </button>

        <button class="filter" data-filter="live">
            🔴 Live
        </button>

        <button class="filter" data-filter="upcoming">
            Upcoming
        </button>

        <button class="filter" data-filter="recent">
            Recent
        </button>
    </div>

    <div id="events" class="events">
        <div class="loading">
            Loading events...
        </div>
    </div>

</main>


<!-- PLAYER -->

<div id="playerOverlay" class="player-overlay">

    <div class="player-header">

        <button id="backBtn" class="back">
            ←
        </button>

        <div id="playerTitle" class="player-title">
            Loading...
        </div>

    </div>

    <div class="player-area">

        <video
            id="video"
            controls
            playsinline
            webkit-playsinline>
        </video>

        <div id="playerMessage" class="player-message">

            <div>
                <div class="spinner"></div>
                <div id="messageText">
                    Loading stream...
                </div>
            </div>

        </div>

    </div>

    <div id="streams" class="streams"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.compiled.js"></script>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API_URL =
    "https://sportlink-api.movieszonemedia.workers.dev";


/* =========================================================
   GLOBALS
========================================================= */

let token = null;

let allEvents = [];

let activeFilter = "all";

let hls = null;

let shakaPlayer = null;


/* =========================================================
   ELEMENTS
========================================================= */

const eventsEl =
    document.getElementById("events");

const apiStatus =
    document.getElementById("apiStatus");

const overlay =
    document.getElementById("playerOverlay");

const video =
    document.getElementById("video");

const streamsEl =
    document.getElementById("streams");

const playerTitle =
    document.getElementById("playerTitle");

const playerMessage =
    document.getElementById("playerMessage");

const messageText =
    document.getElementById("messageText");


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================================
   STATUS
========================================================= */

function setAPIStatus(text,color="#94a3b8"){

    apiStatus.textContent = text;

    apiStatus.style.color = color;
}


/* =========================================================
   AUTH
========================================================= */

async function getToken(){

    const response =
        await fetch(
            API_URL + "/api/auth",
            {
                method:"POST",
                headers:{
                    "Accept":"application/json"
                }
            }
        );

    let data;

    try{
        data = await response.json();
    }catch{
        throw new Error(
            "Invalid authentication response"
        );
    }

    if(!response.ok){

        throw new Error(
            data.error ||
            "Authentication failed"
        );
    }

    if(!data.token){

        throw new Error(
            "Token missing from API response"
        );
    }

    token = data.token;

    return token;
}


/* =========================================================
   GET EVENTS
========================================================= */

async function fetchEvents(){

    if(!token){

        await getToken();

    }

    let response =
        await fetch(
            API_URL + "/api/events",
            {
                method:"GET",
                headers:{
                    "Authorization":
                        "Bearer " + token,

                    "Accept":
                        "application/json"
                }
            }
        );


    /*
     * Token expired
     */

    if(response.status === 401){

        token = null;

        await getToken();

        response =
            await fetch(
                API_URL + "/api/events",
                {
                    headers:{
                        "Authorization":
                            "Bearer " + token,

                        "Accept":
                            "application/json"
                    }
                }
            );
    }


    let data;

    try{

        data =
            await response.json();

    }catch{

        throw new Error(
            "Invalid events response"
        );
    }


    if(!response.ok){

        throw new Error(
            data.error ||
            "Events request failed"
        );
    }


    return data;
}


/* =========================================================
   NORMALIZE EVENT
========================================================= */

function normalizeEvent(event){

    const info =
        event.eventInfo || {};


    /*
     * IMPORTANT:
     *
     * Worker returns resolved_streams
     * while player expects streams.
     */

    const streams =
        Array.isArray(
            event.resolved_streams
        )
        ?
        event.resolved_streams

            .filter(
                stream =>
                    stream &&
                    stream.link
            )

            .map(stream => {

                const url =
                    String(
                        stream.link
                    ).trim();

                let type =
                    stream.type;


                if(type === "1"){

                    type = "mpd";

                }else if(type === "0"){

                    type = "hls";

                }else if(
                    url.toLowerCase()
                        .includes(".mpd")
                ){

                    type = "mpd";

                }else{

                    type = "hls";

                }


                return {

                    url:url,

                    title:
                        stream.title ||
                        "Stream",

                    type:type,

                    /*
                     * Keep API metadata available
                     * for your authorized playback setup.
                     */

                    api:
                        stream.api || ""

                };

            })

        :
        (
            Array.isArray(event.streams)
                ? event.streams
                : []
        );


    const eventName =
        info.teamA &&
        info.teamB
        ?
        `${info.teamA} vs ${info.teamB}`
        :
        (
            info.eventName ||
            event.title ||
            event.name ||
            "Live Event"
        );


    return {

        ...event,

        name:eventName,

        category:
            info.eventCat ||
            event.category_name ||
            "Sports",

        teamA:
            info.teamA || "",

        teamB:
            info.teamB || "",

        streams:streams

    };

}


/* =========================================================
   EVENT STATUS
========================================================= */

function getEventStatus(event){

    const now =
        Math.floor(
            Date.now()/1000
        );


    /*
     * If your API provides timestamps.
     */

    const start =
        Number(
            event.starts_at ||
            event.start_at ||
            0
        );

    const end =
        Number(
            event.ends_at ||
            event.end_at ||
            0
        );


    if(start && end){

        if(now >= start && now <= end){

            return "live";

        }

        if(now < start){

            return "upcoming";

        }

        return "recent";

    }


    /*
     * If no timestamps are available,
     * don't hide the event.
     */

    return "live";
}


/* =========================================================
   FILTER
========================================================= */

function filteredEvents(){

    if(activeFilter === "all"){

        return allEvents;

    }

    return allEvents.filter(
        event =>
            getEventStatus(event)
            === activeFilter
    );
}


/* =========================================================
   RENDER EVENTS
========================================================= */

function renderEvents(){

    const events =
        filteredEvents();


    if(!events.length){

        eventsEl.innerHTML = `
            <div class="empty">
                No events found.
            </div>
        `;

        return;
    }


    eventsEl.innerHTML = "";


    events.forEach(
        (event,index) => {

            const card =
                document.createElement("div");


            card.className =
                "event-card";


            const status =
                getEventStatus(event);


            const streamCount =
                event.streams.length;


            card.innerHTML = `

                <div class="event-top">

                    <div class="category">
                        ${escapeHTML(
                            event.category
                        )}
                    </div>

                    <div class="live">
                        ${
                            status === "live"
                            ? "● LIVE"
                            : status.toUpperCase()
                        }
                    </div>

                </div>


                <div class="title">
                    ${escapeHTML(
                        event.name
                    )}
                </div>


                ${
                    event.teamA ||
                    event.teamB
                    ?
                    `
                    <div class="teams">

                        <span>
                            ${escapeHTML(
                                event.teamA ||
                                "TBA"
                            )}
                        </span>

                        <span class="vs">
                            VS
                        </span>

                        <span>
                            ${escapeHTML(
                                event.teamB ||
                                "TBA"
                            )}
                        </span>

                    </div>
                    `
                    :
                    ""
                }


                <div class="stream-count">

                    ${
                        streamCount
                        ? `▶ ${streamCount}
                           stream${streamCount > 1 ? "s" : ""}`
                        : "⚠ No stream available"
                    }

                </div>

            `;


            /*
             * IMPORTANT:
             *
             * Click handler is attached
             * directly to the card.
             */

            card.addEventListener(
                "click",
                () => {

                    openEvent(
                        event
                    );

                }
            );


            eventsEl.appendChild(
                card
            );

        }
    );
}


/* =========================================================
   DESTROY PLAYER
========================================================= */

async function destroyPlayer(){

    if(hls){

        try{
            hls.destroy();
        }catch(e){}

        hls = null;

    }


    if(shakaPlayer){

        try{
            await shakaPlayer.destroy();
        }catch(e){}

        shakaPlayer = null;

    }


    try{

        video.pause();

    }catch(e){}


    video.removeAttribute("src");

    video.load();

    video.style.display =
        "none";
}


/* =========================================================
   PLAYER MESSAGE
========================================================= */

function showMessage(text){

    messageText.textContent =
        text;

    playerMessage.classList.add(
        "show"
    );

}


function hideMessage(){

    playerMessage.classList.remove(
        "show"
    );

}


/* =========================================================
   OPEN EVENT
========================================================= */

async function openEvent(event){

    const streams =
        event.streams || [];


    if(!streams.length){

        alert(
            "No stream available for this event."
        );

        return;

    }


    overlay.classList.add(
        "open"
    );


    playerTitle.textContent =
        event.name;


    streamsEl.innerHTML = "";


    streams.forEach(
        (stream,index) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "stream-btn" +
                (
                    index === 0
                    ? " active"
                    : ""
                );


            button.textContent =
                stream.title ||
                `Stream ${index + 1}`;


            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(
                            ".stream-btn"
                        )
                        .forEach(
                            btn =>
                                btn.classList
                                    .remove(
                                        "active"
                                    )
                        );


                    button.classList.add(
                        "active"
                    );


                    playStream(
                        stream
                    );

                }
            );


            streamsEl.appendChild(
                button
            );

        }
    );


    /*
     * Automatically play first stream.
     */

    await playStream(
        streams[0]
    );

}


/* =========================================================
   PLAY STREAM
========================================================= */

async function playStream(stream){

    if(!stream || !stream.url){

        showMessage(
            "Stream URL unavailable"
        );

        return;

    }


    await destroyPlayer();

    showMessage(
        "Loading stream..."
    );


    const url =
        stream.url.trim();


    const type =
        stream.type ||
        (
            url.toLowerCase()
                .includes(".mpd")
            ?
            "mpd"
            :
            "hls"
        );


    if(
        type === "mpd" ||
        type === "dash"
    ){

        await playDASH(
            url
        );

    }else{

        await playHLS(
            url
        );

    }

}


/* =========================================================
   HLS
========================================================= */

async function playHLS(url){

    video.style.display =
        "block";


    /*
     * Safari / native HLS
     */

    if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src = url;


        video.onloadedmetadata =
            async () => {

                hideMessage();

                try{
                    await video.play();
                }catch(e){}

            };


        video.onerror =
            () => {

                showMessage(
                    "HLS playback failed."
                );

            };


        return;

    }


    /*
     * HLS.js
     */

    if(
        window.Hls &&
        Hls.isSupported()
    ){

        hls =
            new Hls({

                enableWorker:true,

                lowLatencyMode:true,

                backBufferLength:30

            });


        hls.loadSource(
            url
        );


        hls.attachMedia(
            video
        );


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            async () => {

                hideMessage();

                try{

                    await video.play();

                }catch(e){}

            }
        );


        hls.on(
            Hls.Events.ERROR,
            (_,data) => {

                if(
                    data &&
                    data.fatal
                ){

                    showMessage(
                        "HLS stream error."
                    );

                }

            }
        );


        return;

    }


    showMessage(
        "HLS is not supported by this browser."
    );

}


/* =========================================================
   DASH / SHAKA
========================================================= */

async function playDASH(url){

    video.style.display =
        "block";


    if(
        !window.shaka ||
        !shaka.Player
    ){

        showMessage(
            "Shaka Player unavailable."
        );

        return;

    }


    shaka.polyfill.installAll();


    if(
        !shaka.Player
            .isBrowserSupported()
    ){

        showMessage(
            "DASH is not supported by this browser."
        );

        return;

    }


    try{

        shakaPlayer =
            new shaka.Player(
                video
            );


        shakaPlayer.addEventListener(
            "error",
            event => {

                console.error(
                    "Shaka error:",
                    event.detail
                );


                showMessage(
                    "DASH playback error."
                );

            }
        );


        await shakaPlayer.load(
            url
        );


        hideMessage();


        try{

            await video.play();

        }catch(e){

            /*
             * Browser autoplay policy may
             * require the user to press play.
             */

        }


    }catch(error){

        console.error(
            "DASH load error:",
            error
        );


        showMessage(
            "Unable to load DASH stream."
        );

    }

}


/* =========================================================
   CLOSE PLAYER
========================================================= */

async function closePlayer(){

    await destroyPlayer();

    streamsEl.innerHTML = "";

    overlay.classList.remove(
        "open"
    );

}


/* =========================================================
   BACK BUTTON
========================================================= */

document
    .getElementById("backBtn")
    .addEventListener(
        "click",
        closePlayer
    );


/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape" &&
            overlay.classList.contains(
                "open"
            )
        ){

            closePlayer();

        }

    }
);


/* =========================================================
   FILTER BUTTONS
========================================================= */

document
    .querySelectorAll(".filter")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(
                            ".filter"
                        )
                        .forEach(
                            btn =>
                                btn.classList
                                    .remove(
                                        "active"
                                    )
                        );


                    button.classList.add(
                        "active"
                    );


                    activeFilter =
                        button.dataset.filter;


                    renderEvents();

                }
            );

        }
    );


/* =========================================================
   INITIALIZE
========================================================= */

async function init(){

    try{

        setAPIStatus(
            "Authenticating..."
        );


        const data =
            await fetchEvents();


        /*
         * Convert API events to frontend events.
         */

        allEvents =
            (
                Array.isArray(
                    data.events
                )
                ?
                data.events
                :
                []
            )
            .map(
                normalizeEvent
            );


        setAPIStatus(
            `● ${allEvents.length} events`,
            "#10b981"
        );


        renderEvents();


    }catch(error){

        console.error(
            error
        );


        setAPIStatus(
            "API Error",
            "#ef4444"
        );


        eventsEl.innerHTML = `

            <div class="error">

                ❌ ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}


init();

</script>

</body>
</html>
