<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Secure Sports API</title>

    <!-- Shaka Player -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.16.4/shaka-player.compiled.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080b10;
            color: #f8fafc;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            color: #f97316;
            margin-top: 0;
        }

        .status {
            padding: 14px;
            margin: 15px 0;
            border-radius: 10px;
            background: #111827;
            border: 1px solid #1f2937;
        }

        .success {
            color: #10b981;
            border-color: #065f46;
        }

        .error {
            color: #ef4444;
            border-color: #7f1d1d;
        }

        .loading {
            color: #facc15;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 11px 16px;
            cursor: pointer;
            font-weight: bold;
            background: #f97316;
            color: #000;
        }

        button:hover {
            background: #fb923c;
        }

        .events {
            display: grid;
            gap: 15px;
        }

        .event {
            background: #11151d;
            border: 1px solid #1f2937;
            border-radius: 14px;
            padding: 16px;
        }

        .event-title {
            color: #38bdf8;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .event-info {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .streams {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .stream-btn {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
        }

        .stream-btn:hover {
            background: #334155;
            color: white;
        }

        .stream-btn.dash {
            border-color: #7c3aed;
        }

        .stream-btn.hls {
            border-color: #0284c7;
        }

        .player-box {
            display: none;
            margin-top: 25px;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #1f2937;
        }

        video {
            width: 100%;
            display: block;
            background: #000;
            max-height: 600px;
        }

        .player-header {
            padding: 12px 15px;
            background: #111827;
            color: #e2e8f0;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
            background: #05070a;
            padding: 15px;
            border-radius: 10px;
            color: #94a3b8;
            font-size: 12px;
            overflow-x: auto;
        }

        .section {
            margin-top: 25px;
        }

        .empty {
            padding: 20px;
            color: #94a3b8;
            background: #111827;
            border-radius: 10px;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>🔐 Secure Sports API</h1>

    <div id="status" class="status loading">
        Connecting...
    </div>

    <button onclick="loadEvents()">
        🔄 Reload Events
    </button>


    <!-- PLAYER -->

    <div
        id="playerBox"
        class="player-box"
    >

        <div
            id="playerTitle"
            class="player-header"
        >
            Player
        </div>

        <video
            id="video"
            controls
            playsinline
        ></video>

    </div>


    <!-- EVENTS -->

    <div class="section">

        <h2>📺 Events</h2>

        <div
            id="events"
            class="events"
        >
            Loading...
        </div>

    </div>


    <!-- DEBUG -->

    <div class="section">

        <h2>🛠 Debug</h2>

        <pre id="debug">
Waiting...
        </pre>

    </div>

</div>


<script>

/* =========================================================
   CONFIG
   ========================================================= */

const API_URL =
    "https://sportlink-api.movieszonemedia.workers.dev";


/*
 * JWT token
 */

let API_TOKEN = null;


/*
 * Shaka instance
 */

let shakaPlayer = null;


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(
    message,
    type = ""
) {

    const element =
        document.getElementById("status");

    element.textContent =
        message;

    element.className =
        "status " + type;
}


/* =========================================================
   DEBUG
   ========================================================= */

function debug(data) {

    document.getElementById(
        "debug"
    ).textContent =
        typeof data === "string"
            ? data
            : JSON.stringify(
                data,
                null,
                2
            );
}


/* =========================================================
   GET TOKEN
   ========================================================= */

async function getToken() {

    setStatus(
        "🔑 Getting secure token...",
        "loading"
    );


    const response =
        await fetch(
            API_URL + "/api/auth",
            {
                method: "POST"
            }
        );


    let data;

    try {

        data =
            await response.json();

    } catch {

        throw new Error(
            "Invalid authentication response"
        );
    }


    if (!response.ok) {

        throw new Error(
            data.error ||
            "Authentication failed"
        );
    }


    if (!data.token) {

        throw new Error(
            "Token missing from server response"
        );
    }


    API_TOKEN =
        data.token;


    return API_TOKEN;
}


/* =========================================================
   GET EVENTS
   ========================================================= */

async function fetchEvents() {

    if (!API_TOKEN) {

        await getToken();
    }


    let response =
        await fetch(
            API_URL + "/api/events",
            {
                method: "GET",

                headers: {
                    "Authorization":
                        "Bearer " + API_TOKEN
                }
            }
        );


    /*
     * Token expired
     */

    if (response.status === 401) {

        API_TOKEN = null;

        await getToken();


        response =
            await fetch(
                API_URL + "/api/events",
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            "Bearer " + API_TOKEN
                    }
                }
            );
    }


    let data;

    try {

        data =
            await response.json();

    } catch {

        throw new Error(
            "Invalid API response"
        );
    }


    debug(data);


    if (!response.ok) {

        throw new Error(
            data.error ||
            "Events request failed"
        );
    }


    return data;
}


/* =========================================================
   LOAD EVENTS
   ========================================================= */

async function loadEvents() {

    try {

        document.getElementById(
            "events"
        ).innerHTML = `
            <div class="empty">
                ⏳ Loading events...
            </div>
        `;


        const data =
            await fetchEvents();


        const events =
            Array.isArray(data.events)
                ? data.events
                : [];


        setStatus(
            "✅ API connected — " +
            events.length +
            " events",
            "success"
        );


        renderEvents(events);


    } catch (error) {

        console.error(error);


        setStatus(
            "❌ " + error.message,
            "error"
        );


        document.getElementById(
            "events"
        ).innerHTML = `
            <div class="empty">
                ❌ ${escapeHTML(error.message)}
            </div>
        `;
    }
}


/* =========================================================
   RENDER EVENTS
   ========================================================= */

function renderEvents(events) {

    const container =
        document.getElementById(
            "events"
        );


    container.innerHTML = "";


    if (!events.length) {

        container.innerHTML = `
            <div class="empty">
                ❌ No events found.
            </div>
        `;

        return;
    }


    events.forEach(
        (event, index) => {

            const info =
                event.eventInfo || {};


            const title =
                info.eventName ||
                "Unknown Event";


            const teamA =
                info.teamA || "";


            const teamB =
                info.teamB || "";


            /*
             * NEW WORKER FORMAT
             *
             * event.streams
             */

            const streams =
                Array.isArray(
                    event.streams
                )
                    ? event.streams
                    : [];


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "event";


            let streamHTML = "";


            if (!streams.length) {

                streamHTML = `
                    <div class="empty">
                        ❌ No streams available
                    </div>
                `;

            } else {

                streamHTML =
                    `<div class="streams">`;


                streams.forEach(
                    (stream, streamIndex) => {

                        const type =
                            stream.type;


                        const name =
                            stream.title ||
                            (
                                type === "dash"
                                    ? "DASH"
                                    : "HLS"
                            );


                        streamHTML += `

                            <button
                                class="stream-btn ${
                                    type === "dash"
                                        ? "dash"
                                        : "hls"
                                }"
                                onclick='playStream(
                                    ${JSON.stringify(stream)}
                                )'
                            >

                                ${
                                    type === "dash"
                                        ? "▶ DASH"
                                        : "▶ HLS"
                                }

                                ${escapeHTML(name)}

                            </button>

                        `;
                    }
                );


                streamHTML +=
                    `</div>`;
            }


            card.innerHTML = `

                <div class="event-title">

                    ${index + 1}.
                    ${escapeHTML(title)}

                </div>


                <div class="event-info">

                    ${
                        teamA && teamB
                            ? escapeHTML(
                                teamA +
                                " vs " +
                                teamB
                              )
                            : ""
                    }

                    ${
                        info.eventCat
                            ? " • " +
                              escapeHTML(
                                info.eventCat
                              )
                            : ""
                    }

                </div>


                ${streamHTML}

            `;


            container.appendChild(
                card
            );

        }
    );
}


/* =========================================================
   PLAY STREAM
   ========================================================= */

async function playStream(stream) {

    try {

        const video =
            document.getElementById(
                "video"
            );


        const playerBox =
            document.getElementById(
                "playerBox"
            );


        const playerTitle =
            document.getElementById(
                "playerTitle"
            );


        playerBox.style.display =
            "block";


        playerTitle.textContent =
            "▶ " +
            (
                stream.title ||
                "Stream"
            );


        /*
         * Destroy previous Shaka
         */

        if (shakaPlayer) {

            await shakaPlayer.destroy();

            shakaPlayer = null;
        }


        /*
         * Reset video
         */

        video.pause();

        video.removeAttribute(
            "src"
        );

        video.load();


        /* =================================================
           HLS
           ================================================= */

        if (
            stream.type === "hls" &&
            stream.m3u8
        ) {

            /*
             * Native HLS
             */

            if (
                video.canPlayType(
                    "application/vnd.apple.mpegurl"
                )
            ) {

                video.src =
                    stream.m3u8;

                await video.play()
                    .catch(() => {});

                return;
            }


            /*
             * Browsers without native HLS
             *
             * hls.js would normally be used here.
             */

            throw new Error(
                "This browser does not support native HLS playback."
            );
        }


        /* =================================================
           DASH
           ================================================= */

        if (
            stream.type === "dash" &&
            stream.mpd
        ) {

            if (
                !window.shaka
            ) {

                throw new Error(
                    "Shaka Player failed to load."
                );
            }


            if (
                !shaka.Player.isBrowserSupported()
            ) {

                throw new Error(
                    "DASH is not supported by this browser."
                );
            }


            shakaPlayer =
                new shaka.Player(
                    video
                );


            shakaPlayer.addEventListener(
                "error",
                event => {

                    console.error(
                        "Shaka error:",
                        event.detail
                    );

                    debug({
                        playerError:
                            event.detail
                    });
                }
            );


            /*
             * IMPORTANT:
             *
             * If the stream requires DRM,
             * use your authorized DRM
             * license server here.
             *
             * Do not put private
             * license credentials
             * directly into public HTML.
             */


            await shakaPlayer.load(
                stream.mpd
            );


            await video.play()
                .catch(() => {});


            return;
        }


        throw new Error(
            "Invalid stream format"
        );


    } catch (error) {

        console.error(
            "Player error:",
            error
        );


        setStatus(
            "❌ Player: " +
            error.message,
            "error"
        );
    }
}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}


/* =========================================================
   START
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        loadEvents();

    }
);

</script>

</body>
</html>
