<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sportlink TV</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.compiled.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    min-height:100%;
    background:#080b10;
    color:#f1f5f9;
    font-family:Inter,Arial,sans-serif;
}

body{
    overflow-x:hidden;
}

.header{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(10,13,18,.94);
    backdrop-filter:blur(18px);
    border-bottom:1px solid #202632;
    padding:15px 18px;
}

.header-inner{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:21px;
    font-weight:800;
    background:linear-gradient(135deg,#f97316,#ef4444);
    -webkit-background-clip:text;
    color:transparent;
}

.logo-sub{
    color:#64748b;
    font-size:10px;
    margin-top:3px;
}

.online{
    background:#101923;
    border:1px solid #243142;
    color:#10b981;
    padding:7px 12px;
    border-radius:30px;
    font-size:11px;
    font-weight:700;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:22px 16px 45px;
}

.hero{
    background:
        radial-gradient(circle at 10% 10%,rgba(249,115,22,.15),transparent 35%),
        radial-gradient(circle at 90% 80%,rgba(59,130,246,.12),transparent 35%),
        #10151d;
    border:1px solid #202936;
    border-radius:22px;
    padding:22px;
    margin-bottom:20px;
}

.hero h1{
    font-size:26px;
    margin-bottom:7px;
}

.hero p{
    color:#94a3b8;
    font-size:13px;
}

.status{
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-top:14px;
    color:#10b981;
    font-size:11px;
    font-weight:700;
}

.status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#10b981;
    box-shadow:0 0 10px #10b981;
}

.filters{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:8px;
    margin-bottom:18px;
    scrollbar-width:none;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filter{
    flex-shrink:0;
    border:1px solid #293241;
    background:#111720;
    color:#94a3b8;
    border-radius:30px;
    padding:9px 15px;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
}

.filter.active{
    color:#fff;
    background:linear-gradient(135deg,#ef4444,#f97316);
    border-color:transparent;
}

.section-title{
    font-size:17px;
    font-weight:800;
    margin-bottom:13px;
}

.events{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:13px;
}

.card{
    background:#11161e;
    border:1px solid #222b38;
    border-radius:17px;
    overflow:hidden;
    cursor:pointer;
    transition:.2s;
}

.card:hover{
    transform:translateY(-2px);
    border-color:#f97316;
}

.card-top{
    padding:10px 13px;
    border-bottom:1px solid #202733;
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
}

.category{
    color:#94a3b8;
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
}

.live{
    color:#ef4444;
    font-size:9px;
    font-weight:800;
    display:flex;
    align-items:center;
    gap:5px;
}

.live i{
    width:6px;
    height:6px;
    background:#ef4444;
    border-radius:50%;
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{opacity:.25}
}

.card-body{
    padding:16px;
}

.teams{
    display:flex;
    align-items:center;
    gap:10px;
}

.team{
    flex:1;
    min-width:0;
}

.team.right{
    text-align:right;
}

.team-name{
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.vs{
    flex-shrink:0;
    color:#64748b;
    font-size:10px;
    font-weight:800;
}

.time{
    margin-top:13px;
    color:#38bdf8;
    font-size:11px;
    font-weight:700;
}

.empty{
    background:#10151d;
    border:1px solid #202936;
    border-radius:17px;
    padding:35px 20px;
    text-align:center;
    color:#64748b;
    font-size:13px;
    grid-column:1/-1;
}

.error{
    color:#f87171;
}

.viewer{
    position:fixed;
    inset:0;
    background:#000;
    z-index:100;
    display:none;
    flex-direction:column;
}

.viewer.open{
    display:flex;
}

.viewer-head{
    height:58px;
    flex-shrink:0;
    background:#0d1117;
    border-bottom:1px solid #222;
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 14px;
}

.back{
    width:36px;
    height:36px;
    border:0;
    border-radius:50%;
    background:#1d2733;
    color:#fff;
    cursor:pointer;
    font-size:17px;
}

.viewer-title{
    flex:1;
    min-width:0;
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.player-area{
    position:relative;
    flex:1;
    min-height:0;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
}

video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}

.player-message{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    color:#94a3b8;
    font-size:13px;
    text-align:center;
    padding:20px;
}

.streams{
    background:#0d1117;
    border-top:1px solid #222;
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:10px;
}

.stream-btn{
    flex-shrink:0;
    background:#1a2330;
    color:#cbd5e1;
    border:1px solid #303b4a;
    border-radius:20px;
    padding:8px 13px;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
}

.stream-btn.active{
    background:linear-gradient(135deg,#ef4444,#f97316);
    border-color:transparent;
    color:#fff;
}

.spinner{
    width:24px;
    height:24px;
    border:3px solid #293241;
    border-top-color:#f97316;
    border-radius:50%;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

@media(max-width:700px){
    .events{
        grid-template-columns:1fr;
    }

    .hero h1{
        font-size:22px;
    }

    .container{
        padding:17px 12px 35px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">
        <div>
            <div class="logo">⚽ Sportlink TV</div>
            <div class="logo-sub">Live Sports Hub</div>
        </div>

        <div class="online">
            ● API ONLINE
        </div>
    </div>
</header>


<main class="container">

    <section class="hero">
        <h1>Live Sports</h1>
        <p>Watch available live events from your authorized streaming sources.</p>

        <div class="status">
            <span class="status-dot"></span>
            <span id="statusText">Connecting...</span>
        </div>
    </section>


    <div class="filters" id="filters">
        <button class="filter active" data-filter="all">
            All
        </button>

        <button class="filter" data-filter="live">
            🔴 Live
        </button>

        <button class="filter" data-filter="upcoming">
            📅 Upcoming
        </button>

        <button class="filter" data-filter="recent">
            🕘 Recent
        </button>
    </div>


    <div class="section-title">
        Live Events
    </div>

    <section class="events" id="events">
        <div class="empty">
            <div class="spinner" style="margin:auto auto 12px"></div>
            Loading events...
        </div>
    </section>

</main>


<!-- PLAYER -->

<div class="viewer" id="viewer">

    <div class="viewer-head">

        <button class="back" id="closeViewer">
            ←
        </button>

        <div class="viewer-title" id="viewerTitle">
            Player
        </div>

    </div>


    <div class="player-area">

        <video
            id="video"
            playsinline
            controls
            preload="metadata">
        </video>

        <div
            class="player-message"
            id="playerMessage">
        </div>

    </div>


    <div
        class="streams"
        id="streams">
    </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API_URL =
    "https://sportlink-api.movieszonemedia.workers.dev";


/* =========================================================
   STATE
========================================================= */

let API_TOKEN = null;
let EVENTS = [];
let ACTIVE_FILTER = "all";

let hls = null;
let shakaPlayer = null;


/* =========================================================
   ELEMENTS
========================================================= */

const eventsEl =
    document.getElementById("events");

const statusText =
    document.getElementById("statusText");

const viewer =
    document.getElementById("viewer");

const video =
    document.getElementById("video");

const viewerTitle =
    document.getElementById("viewerTitle");

const playerMessage =
    document.getElementById("playerMessage");

const streamsEl =
    document.getElementById("streams");


/* =========================================================
   TOKEN
========================================================= */

async function getToken(){

    const response =
        await fetch(
            API_URL + "/api/auth",
            {
                method:"POST"
            }
        );

    const data =
        await response.json();

    if(
        !response.ok ||
        !data.token
    ){
        throw new Error(
            data.error ||
            "Authentication failed"
        );
    }

    API_TOKEN =
        data.token;

    return API_TOKEN;
}


/* =========================================================
   EVENTS
========================================================= */

async function getEvents(){

    if(!API_TOKEN){
        await getToken();
    }

    let response =
        await fetch(
            API_URL + "/api/events",
            {
                method:"GET",

                headers:{
                    Authorization:
                        "Bearer " +
                        API_TOKEN
                }
            }
        );


    /*
    Token expired:
    get a fresh token once.
    */

    if(response.status === 401){

        API_TOKEN = null;

        await getToken();

        response =
            await fetch(
                API_URL + "/api/events",
                {
                    method:"GET",

                    headers:{
                        Authorization:
                            "Bearer " +
                            API_TOKEN
                    }
                }
            );
    }


    const data =
        await response.json();


    if(!response.ok){

        throw new Error(
            data.error ||
            "Unable to load events"
        );
    }


    if(
        !Array.isArray(
            data.events
        )
    ){
        throw new Error(
            "Invalid API response"
        );
    }


    return data.events;
}


/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function timestamp(value){

    if(!value)
        return 0;

    const ms =
        Date.parse(
            String(value)
                .replace(
                    /^(\d{4})\/(\d{2})\/(\d{2})/,
                    "$1-$2-$3"
                )
        );

    return Number.isNaN(ms)
        ? 0
        : Math.floor(ms / 1000);
}


function eventStart(event){

    const info =
        event.eventInfo || {};

    return timestamp(
        info.startTime
    );
}


function eventEnd(event){

    const info =
        event.eventInfo || {};

    return timestamp(
        info.endTime
    );
}


function getStatus(event){

    const now =
        Math.floor(
            Date.now()/1000
        );

    const start =
        eventStart(event);

    const end =
        eventEnd(event);


    if(
        start &&
        end &&
        now >= start &&
        now <= end
    ){
        return "live";
    }


    if(
        start &&
        now < start
    ){
        return "upcoming";
    }


    if(
        end &&
        now > end
    ){
        return "recent";
    }


    return "upcoming";
}


function formatTime(value){

    const ts =
        timestamp(value);

    if(!ts)
        return "";

    return new Date(
        ts * 1000
    ).toLocaleTimeString(
        "en-IN",
        {
            hour:"2-digit",
            minute:"2-digit",
            hour12:true,
            timeZone:"Asia/Kolkata"
        }
    ) + " IST";
}


/*
Get event streams.

Supports the structure used by your API:
resolved_streams -> link/type/title

Also supports a normalized:
streams -> url/type/title
*/

function getStreams(event){

    if(
        Array.isArray(
            event.streams
        )
    ){
        return event.streams
            .filter(
                s => s && s.url
            )
            .map(
                s => ({
                    url:s.url,
                    title:s.title || "Stream",
                    type:s.type || ""
                })
            );
    }


    if(
        Array.isArray(
            event.resolved_streams
        )
    ){
        return event.resolved_streams
            .filter(
                s =>
                    s &&
                    s.link &&
                    s.link.trim()
            )
            .map(
                s => ({
                    url:s.link,
                    title:s.title || "Stream",
                    type:
                        s.type === "1"
                            ? "mpd"
                            : "hls"
                })
            );
    }


    return [];
}


function eventName(event){

    const info =
        event.eventInfo || {};

    if(
        info.teamA &&
        info.teamB &&
        info.teamA !== info.teamB
    ){
        return (
            info.teamA +
            " vs " +
            info.teamB
        );
    }

    return (
        info.eventName ||
        event.title ||
        "Live Event"
    );
}


function eventCategory(event){

    const info =
        event.eventInfo || {};

    return (
        info.eventCat ||
        event.category_name ||
        "Sports"
    );
}


/* =========================================================
   FILTER
========================================================= */

function filteredEvents(){

    if(
        ACTIVE_FILTER === "all"
    ){
        return EVENTS;
    }

    return EVENTS.filter(
        event =>
            getStatus(event) ===
            ACTIVE_FILTER
    );
}


/* =========================================================
   RENDER
========================================================= */

function render(){

    const list =
        filteredEvents();


    eventsEl.innerHTML = "";


    if(!list.length){

        eventsEl.innerHTML = `
            <div class="empty">
                No events available.
            </div>
        `;

        return;
    }


    list.forEach(
        event => {

            const info =
                event.eventInfo || {};

            const name =
                eventName(event);

            const category =
                eventCategory(event);

            const status =
                getStatus(event);

            const streams =
                getStreams(event);

            const teamA =
                info.teamA || name;

            const teamB =
                info.teamB || "";


            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "card";


            card.innerHTML = `

                <div class="card-top">

                    <span class="category">
                        ${escapeHTML(category)}
                    </span>

                    ${
                        status === "live"
                        ?
                        `
                        <span class="live">
                            <i></i>
                            LIVE
                        </span>
                        `
                        :
                        `
                        <span class="category">
                            ${escapeHTML(status)}
                        </span>
                        `
                    }

                </div>


                <div class="card-body">

                    <div class="teams">

                        <div class="team">

                            <div class="team-name">
                                ${escapeHTML(teamA)}
                            </div>

                        </div>

                        ${
                            teamB
                            ?
                            `
                            <div class="vs">
                                VS
                            </div>

                            <div class="team right">

                                <div class="team-name">
                                    ${escapeHTML(teamB)}
                                </div>

                            </div>
                            `
                            :
                            ""
                        }

                    </div>


                    <div class="time">

                        ${
                            formatTime(
                                info.startTime
                            ) ||
                            "Watch event"
                        }

                        ${
                            streams.length
                            ?
                            ` • ${streams.length} stream${streams.length > 1 ? "s" : ""}`
                            :
                            ""
                        }

                    </div>

                </div>
            `;


            card.addEventListener(
                "click",
                () =>
                    openEvent(
                        event
                    )
            );


            eventsEl.appendChild(
                card
            );

        }
    );
}


/* =========================================================
   FILTER BUTTONS
========================================================= */

document
    .getElementById("filters")
    .addEventListener(
        "click",
        event => {

            const button =
                event.target.closest(
                    ".filter"
                );

            if(!button)
                return;


            document
                .querySelectorAll(
                    ".filter"
                )
                .forEach(
                    b =>
                        b.classList.remove(
                            "active"
                        )
                );


            button.classList.add(
                "active"
            );


            ACTIVE_FILTER =
                button.dataset.filter;


            render();
        }
    );


/* =========================================================
   DESTROY PLAYER
========================================================= */

async function destroyPlayer(){

    if(hls){

        try{
            hls.destroy();
        }catch(e){}

        hls = null;
    }


    if(shakaPlayer){

        try{
            await shakaPlayer.destroy();
        }catch(e){}

        shakaPlayer = null;
    }


    video.pause();

    video.removeAttribute(
        "src"
    );

    video.load();
}


/* =========================================================
   PLAYER MESSAGE
========================================================= */

function playerStatus(message){

    playerMessage.innerHTML = `
        <div class="spinner"></div>
        <div>${escapeHTML(message)}</div>
    `;
}


/* =========================================================
   HLS PLAYER
========================================================= */

function playHLS(url){

    destroyPlayer();

    playerStatus(
        "Loading stream..."
    );


    if(
        window.Hls &&
        Hls.isSupported()
    ){

        hls =
            new Hls({
                enableWorker:true,
                lowLatencyMode:true,
                backBufferLength:30
            });


        hls.loadSource(url);

        hls.attachMedia(video);


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                playerMessage.innerHTML = "";

                video.play()
                    .catch(
                        () => {}
                    );
            }
        );


        hls.on(
            Hls.Events.ERROR,
            (_,data) => {

                if(data.fatal){

                    playerMessage.innerHTML = `
                        <div>❌ Stream unavailable</div>
                        <div style="font-size:11px">
                            Try another available stream.
                        </div>
                    `;
                }
            }
        );


        return;
    }


    /*
    Safari / native HLS
    */

    if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src = url;

        video.addEventListener(
            "loadedmetadata",
            () => {

                playerMessage.innerHTML = "";

                video.play()
                    .catch(
                        () => {}
                    );
            },
            {
                once:true
            }
        );

        return;
    }


    playerMessage.innerHTML =
        "HLS is not supported in this browser.";
}


/* =========================================================
   SHAKA / MPD
========================================================= */

async function playMPD(url){

    await destroyPlayer();

    playerStatus(
        "Loading DASH stream..."
    );


    if(
        !window.shaka
    ){

        playerMessage.innerHTML =
            "DASH player unavailable.";

        return;
    }


    shaka.polyfill.installAll();


    if(
        !shaka.Player.isBrowserSupported()
    ){

        playerMessage.innerHTML =
            "DASH is not supported in this browser.";

        return;
    }


    try{

        shakaPlayer =
            new shaka.Player();


        await shakaPlayer.attach(
            video
        );


        shakaPlayer.addEventListener(
            "error",
            () => {

                playerMessage.innerHTML = `
                    <div>❌ Stream unavailable</div>
                    <div style="font-size:11px">
                        Try another available stream.
                    </div>
                `;
            }
        );


        await shakaPlayer.load(
            url
        );


        playerMessage.innerHTML = "";

        video.play()
            .catch(
                () => {}
            );


    }catch(error){

        console.error(
            "DASH error:",
            error
        );


        playerMessage.innerHTML = `
            <div>❌ Unable to play stream</div>
        `;
    }
}


/* =========================================================
   PLAY STREAM
========================================================= */

async function playStream(
    stream,
    button
){

    document
        .querySelectorAll(
            ".stream-btn"
        )
        .forEach(
            b =>
                b.classList.remove(
                    "active"
                )
        );


    if(button){
        button.classList.add(
            "active"
        );
    }


    const url =
        stream.url;


    if(!url){
        return;
    }


    const type =
        String(
            stream.type || ""
        ).toLowerCase();


    if(
        type === "mpd" ||
        type === "dash" ||
        url.toLowerCase()
            .includes(".mpd")
    ){

        await playMPD(url);

    }else{

        playHLS(url);
    }
}


/* =========================================================
   OPEN EVENT
========================================================= */

async function openEvent(event){

    const streams =
        getStreams(event);


    if(!streams.length){

        alert(
            "No playable stream available for this event."
        );

        return;
    }


    viewerTitle.textContent =
        eventName(event);


    streamsEl.innerHTML = "";


    streams.forEach(
        (stream,index) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "stream-btn" +
                (
                    index === 0
                    ? " active"
                    : ""
                );


            button.textContent =
                stream.title ||
                `Stream ${index + 1}`;


            button.addEventListener(
                "click",
                () =>
                    playStream(
                        stream,
                        button
                    )
            );


            streamsEl.appendChild(
                button
            );
        }
    );


    viewer.classList.add(
        "open"
    );


    document.body.style.overflow =
        "hidden";


    await playStream(
        streams[0],
        streamsEl.querySelector(
            ".stream-btn"
        )
    );
}


/* =========================================================
   CLOSE VIEWER
========================================================= */

document
    .getElementById("closeViewer")
    .addEventListener(
        "click",
        async () => {

            await destroyPlayer();

            viewer.classList.remove(
                "open"
            );

            document.body.style.overflow =
                "";

            streamsEl.innerHTML = "";
            playerMessage.innerHTML = "";
        }
    );


document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape" &&
            viewer.classList.contains(
                "open"
            )
        ){

            document
                .getElementById(
                    "closeViewer"
                )
                .click();
        }
    }
);


/* =========================================================
   LOAD APPLICATION
========================================================= */

async function loadApp(){

    try{

        statusText.textContent =
            "Connecting to secure API...";


        EVENTS =
            await getEvents();


        statusText.textContent =
            EVENTS.length +
            " events available";


        render();


    }catch(error){

        console.error(error);


        statusText.textContent =
            "API connection failed";


        eventsEl.innerHTML = `
            <div class="empty error">
                ❌ Unable to load events.
                <br><br>
                Please try again later.
            </div>
        `;
    }
}


/* =========================================================
   START
========================================================= */

loadApp();


/*
Refresh event status every 30 seconds.
*/

setInterval(
    render,
    30000
);

</script>

</body>
</html>
