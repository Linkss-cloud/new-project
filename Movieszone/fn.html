<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Sports Zone · HLS Player</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet">

<!-- Shaka Player -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:'Poppins',sans-serif;
}

.video-container{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  background:#000;
}

.shaka-video-container{
  position:relative;
  width:100%;
  height:100%;
}

video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
  outline:none;
}

/* =========================
   LOADING
========================= */

.loading-overlay{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  background:#000;
  color:#fff;

  z-index:2000;

  font-size:1rem;
  font-weight:500;
  letter-spacing:.5px;

  transition:opacity .3s ease;

  pointer-events:none;
}

.loading-overlay.hidden{
  opacity:0;
  display:none;
}

.spinner{
  border:4px solid rgba(255,255,255,.15);
  border-top:4px solid #3b82f6;

  border-radius:50%;

  width:44px;
  height:44px;

  animation:spin .9s linear infinite;

  margin-bottom:16px;

  box-shadow:
  0 0 12px rgba(59,130,246,.3);
}

@keyframes spin{

  0%{
    transform:rotate(0deg);
  }

  100%{
    transform:rotate(360deg);
  }

}

.error-message{
  color:#ff7b7b;
  font-size:.9rem;
  text-align:center;
  padding:0 20px;
  max-width:90%;
}

.shaka-controls-container{
  font-family:'Poppins',sans-serif;
}

/* =========================
   TELEGRAM BUTTON
========================= */

.social-badges{

  position:fixed;

  top:15px;
  left:15px;

  z-index:9999;

  display:flex;

  flex-direction:column;

  gap:8px;

  pointer-events:auto;
}

.telegram-btn{

  display:flex;

  align-items:center;

  gap:10px;

  background:
  linear-gradient(
    135deg,
    #1e88e5,
    #1565c0
  );

  padding:9px 15px;

  border-radius:12px;

  text-decoration:none;

  color:#fff;

  font-size:15px;

  font-weight:600;

  box-shadow:
  0 4px 14px rgba(0,0,0,.5);

  transition:
  transform .15s ease,
  box-shadow .15s ease;
}

.telegram-btn:hover{

  transform:translateY(-1px);

  box-shadow:
  0 6px 18px rgba(0,0,0,.6);
}

.telegram-btn:active{

  transform:scale(.96);
}

.telegram-icon{

  width:30px;
  height:30px;

  background:
  rgba(255,255,255,.15);

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  border:2px solid #fff;

  flex-shrink:0;
}

.telegram-icon svg{

  width:16px;
  height:16px;

  fill:#fff;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .social-badges{

    top:10px;
    left:10px;
  }

  .telegram-btn{

    padding:7px 11px;

    border-radius:10px;

    font-size:12px;

    gap:7px;
  }

  .telegram-icon{

    width:26px;
    height:26px;
  }

  .telegram-icon svg{

    width:14px;
    height:14px;
  }

}

</style>

</head>

<body>

<!-- =========================
     VIDEO PLAYER
========================= -->

<div class="video-container">

  <div
    class="shaka-video-container"
    data-shaka-player>

    <video
      id="video"
      autoplay
      playsinline
      muted>
    </video>

    <div
      id="loading"
      class="loading-overlay">

      <div class="spinner"></div>

      <div id="loadingText">
        Analyzing the stream…
      </div>

    </div>

  </div>

</div>


<!-- =========================
     TELEGRAM BUTTON
========================= -->

<div
  class="social-badges"
  id="social-badges">

  <a
    href="https://t.me/+rtK_sfY8t_A2NDU1"
    target="_blank"
    rel="noopener noreferrer"
    class="telegram-btn"
    id="join-button">

    <div class="telegram-icon">

      <svg viewBox="0 0 24 24">

        <path d="
        M9.993 15.674
        l-.398 5.604
        c.57 0 .817-.245
        1.113-.54
        l2.67-2.557
        5.53 4.047
        c1.014.558
        1.734.264
        1.987-.939
        l3.6-16.86
        .001-.001
        c.3-1.4-.506-1.95
        -1.496-1.58
        L1.27 9.64
        c-1.37.53-1.35 1.29
        -.233 1.64
        l5.68 1.77
        L19.29 5.73
        c.59-.39
        1.13-.175
        .69.215"/>

      </svg>

    </div>

    <span>
      Join SPORTS ZONE
    </span>

  </a>

</div>


<!-- =========================
     ACLIB
========================= -->

<script
  id="aclib"
  type="text/javascript"
  src="//acscdn.com/script/aclib.js">
</script>


<script>

/* =========================
   POPUNDER
========================= */

let lastPopunder = 0;

function runPopunder(){

  const now = Date.now();

  if(now - lastPopunder < 5000){
    return;
  }

  lastPopunder = now;

  try{

    if(
      window.aclib &&
      typeof window.aclib.runPop === 'function'
    ){

      window.aclib.runPop({
        zoneId:'11800802'
      });

    }

  }
  catch(error){

    console.warn(
      'Popunder error:',
      error
    );

  }

}


/* =========================
   PLAYER CLICK
========================= */

const playerArea =
document.querySelector(
  '.shaka-video-container'
);

playerArea.addEventListener(
  'click',
  function(){

    runPopunder();

  },
  true
);


/* =========================
   TOUCH SUPPORT
========================= */

playerArea.addEventListener(
  'touchend',
  function(){

    runPopunder();

  },
  {
    capture:true,
    passive:true
  }
);

</script>


<!-- =========================
     SHAKA PLAYER
========================= -->

<script>

(function(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const dataParam =
    params.get('data');

  const urlParam =
    params.get('url');

  let streamUrl = '';


  /* =========================
     BASE64 DATA
  ========================= */

  if(dataParam){

    try{

      streamUrl =
        atob(dataParam);

    }

    catch(e){

      console.warn(
        'Invalid base64 data parameter, falling back to url'
      );

      streamUrl =
        urlParam || '';

    }

  }


  /* =========================
     NORMAL URL
  ========================= */

  else if(urlParam){

    streamUrl =
      urlParam;

  }


  /* =========================
     HASH FALLBACK
  ========================= */

  if(
    !streamUrl &&
    window.location.hash
  ){

    streamUrl =
      window.location.hash.substring(1);

  }


  /* =========================
     ELEMENTS
  ========================= */

  const video =
    document.getElementById(
      'video'
    );

  const loadingOverlay =
    document.getElementById(
      'loading'
    );

  const loadingText =
    document.getElementById(
      'loadingText'
    );


  /* =========================
     ERROR
  ========================= */

  function showError(message){

    loadingOverlay.classList.remove(
      'hidden'
    );

    loadingText.innerHTML =
      `<span class="error-message">
        ⚠️ ${message}
      </span>`;

    const spinner =
      loadingOverlay.querySelector(
        '.spinner'
      );

    if(spinner){

      spinner.style.display =
        'none';

    }

  }


  /* =========================
     CHECK STREAM
  ========================= */

  if(
    !streamUrl ||
    streamUrl.trim() === ''
  ){

    showError(
      'Missing stream URL. Use ?url= or ?data='
    );

    return;

  }


  let player = null;

  let ui = null;


  /* =========================
     INITIALIZE PLAYER
  ========================= */

  async function initPlayer(){

    try{

      player =
        new shaka.Player(video);


      const container =
        document.querySelector(
          '.shaka-video-container'
        );


      ui =
        new shaka.ui.Overlay(
          player,
          container,
          video
        );


      /* =========================
         UI CONFIG
      ========================= */

      ui.configure({

        controlPanelElements:[

          'play_pause',

          'mute',

          'time_and_duration',

          'spacer',

          'quality',

          'language',

          'picture_in_picture',

          'fullscreen',

          'overflow_menu'

        ],

        addSeekBar:true,

        overflowMenuButtons:[

          'captions',

          'quality',

          'language',

          'picture_in_picture'

        ],

        enableKeyboardPlaybackControls:true,

        seekBarColors:{

          base:
          'rgba(255,255,255,0.2)',

          buffered:
          'rgba(255,255,255,0.4)',

          played:
          '#3b82f6'

        }

      });


      /* =========================
         STREAM CONFIG
      ========================= */

      player.configure({

        streaming:{

          bufferingGoal:8,

          rebufferingGoal:1.5,

          bufferBehind:20,

          lowLatencyMode:true,

          retryParameters:{

            maxAttempts:3,

            baseDelay:1000,

            backoffFactor:2,

            fuzzFactor:.5,

            timeout:30000

          }

        },

        manifest:{

          retryParameters:{

            maxAttempts:3,

            baseDelay:1000,

            backoffFactor:2

          }

        }

      });


      /* =========================
         PLAYER ERROR
      ========================= */

      player.addEventListener(
        'error',
        function(event){

          const error =
            event.detail;

          console.error(
            'Shaka Player error:',
            error
          );


          if(
            !player._fallbackAttempted
          ){

            player._fallbackAttempted =
              true;

            console.warn(
              'Shaka failed, trying native HLS…'
            );

            video.src =
              streamUrl;

            video.play()
              .catch(function(e){

                showError(
                  'Playback error: ' +
                  (
                    e.message ||
                    'unknown'
                  )
                );

              });

          }

          else{

            showError(
              'Playback error: ' +
              (
                error.message ||
                'unknown'
              )
            );

          }

        }
      );


      /* =========================
         PLAYING
      ========================= */

      video.addEventListener(
        'playing',
        function(){

          loadingOverlay.classList.add(
            'hidden'
          );

        }
      );


      /* =========================
         CAN PLAY
      ========================= */

      video.addEventListener(
        'canplay',
        function(){

          loadingOverlay.classList.add(
            'hidden'
          );

        }
      );


      /* =========================
         LOAD STREAM
      ========================= */

      await player.load(
        streamUrl
      );


      console.log(
        'Shaka Player loaded:',
        streamUrl
      );


      /* =========================
         AUTOPLAY
      ========================= */

      try{

        await video.play();

      }

      catch(playError){

        console.warn(
          'Autoplay blocked:',
          playError
        );

        video.muted = true;

        await video.play();

      }


      /* =========================
         LOADING TIMEOUT
      ========================= */

      setTimeout(
        function(){

          if(
            video.paused ||
            video.readyState < 2
          ){

            loadingText.textContent =
              'Still loading… please check your connection.';

          }

        },
        10000
      );

    }


    catch(e){

      console.error(
        'Initialization error:',
        e
      );


      /* =========================
         NATIVE HLS FALLBACK
      ========================= */

      if(
        !player ||
        !player._fallbackAttempted
      ){

        if(player){

          player._fallbackAttempted =
            true;

        }

        console.warn(
          'Trying native video fallback…'
        );

        video.src =
          streamUrl;

        video.play()
          .catch(function(err){

            showError(
              'Native playback failed: ' +
              (
                err.message ||
                'unknown error'
              )
            );

          });


        video.addEventListener(
          'playing',
          function(){

            loadingOverlay.classList.add(
              'hidden'
            );

          }
        );


        video.addEventListener(
          'error',
          function(){

            showError(
              'Native playback error'
            );

          }
        );

      }

      else{

        showError(
          'Failed to load stream: ' +
          (
            e.message ||
            'unknown error'
          )
        );

      }

    }

  }


  /* =========================
     START PLAYER
  ========================= */

  if(
    document.readyState === 'loading'
  ){

    document.addEventListener(
      'DOMContentLoaded',
      initPlayer
    );

  }

  else{

    initPlayer();

  }


  /* =========================
     DEBUG
  ========================= */

  window.__player =
  function(){

    return player;

  };

})();

</script>

</body>
</html>
