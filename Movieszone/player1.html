<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">

    <title>Live Stream</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #player-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        #plyr-player {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* Custom 10 sec buttons */
        .custom-seek-button {
            display: inline-flex !important;
            align-items: center;
            justify-content: center;

            width: 42px !important;
            min-width: 42px !important;
            height: 40px !important;

            padding: 0 !important;
            margin: 0 !important;

            color: #fff !important;
            background: transparent !important;
            border: 0 !important;

            cursor: pointer;
            font-size: 13px !important;
            font-weight: 600;

            opacity: 0.9;
        }

        .custom-seek-button:hover {
            opacity: 1;
            color: #fff !important;
        }

        .custom-seek-button:active {
            transform: scale(0.9);
        }

        .seek-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .seek-icon {
            font-size: 20px;
            line-height: 17px;
        }

        .seek-seconds {
            font-size: 9px;
            line-height: 10px;
        }

        /* 2x indicator */
        #speed-indicator {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            display: none;

            padding: 10px 18px;

            border-radius: 10px;

            background: rgba(0, 0, 0, 0.75);

            color: #fff;

            font-size: 22px;
            font-weight: 700;

            z-index: 100;

            pointer-events: none;
        }

        #speed-indicator.show {
            display: block;
        }

        /* Fullscreen */
        .plyr--fullscreen-active {
            width: 100%;
            height: 100%;
        }

        .plyr--fullscreen-active .plyr__controls {
            display: flex !important;
        }

        @media (max-width: 600px) {

            .custom-seek-button {
                width: 38px !important;
                min-width: 38px !important;
            }

            .seek-icon {
                font-size: 18px;
            }

            .seek-seconds {
                font-size: 8px;
            }
        }
    </style>
</head>

<body>

<div id="player-wrapper">

    <video
        id="plyr-player"
        controls
        playsinline
        preload="auto">
    </video>

    <div id="speed-indicator">
        2×
    </div>

</div>


<script>

function qp(key) {
    return new URLSearchParams(location.search).get(key);
}

function isM3U8(url) {
    return url && url.toLowerCase().includes(".m3u8");
}

const video = document.getElementById("plyr-player");
const speedIndicator = document.getElementById("speed-indicator");

let player;


/* ==========================================
   PLAYER INITIALIZATION
   ========================================== */

async function initPlayer() {

    const videoSrc =
        decodeURIComponent(qp("url") || "");

    if (!videoSrc) {
        alert("Use ?url=");
        return;
    }

    const config = {

        clickToPlay: true,

        controls: [
            "play-large",
            "play",
            "progress",
            "current-time",
            "mute",
            "volume",
            "pip",
            "settings",
            "fullscreen"
        ],

        settings: [
            "quality",
            "speed"
        ]
    };


    /* ======================================
       HLS
       ====================================== */

    if (
        Hls.isSupported() &&
        isM3U8(videoSrc)
    ) {

        const hls = new Hls({
            maxBufferLength: 30
        });

        hls.loadSource(videoSrc);
        hls.attachMedia(video);


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                const qualities = [
                    ...new Set(
                        hls.levels
                            .map(level => level.height)
                            .filter(Boolean)
                    )
                ].sort((a, b) => a - b);


                if (qualities.length) {

                    config.quality = {

                        default:
                            qualities[qualities.length - 1],

                        options:
                            qualities,

                        forced: true,

                        onChange: (quality) => {

                            hls.levels.forEach(
                                (level, index) => {

                                    if (
                                        level.height === quality
                                    ) {
                                        hls.currentLevel = index;
                                    }

                                }
                            );

                        }
                    };

                }


                player = new Plyr(
                    video,
                    config
                );


                player.on(
                    "ready",
                    () => {

                        addCustomSeekButtons();

                    }
                );


                player.play().catch(() => {});

            }
        );


    } else {

        /* ==================================
           NORMAL VIDEO
           ================================== */

        video.src = videoSrc;

        player = new Plyr(
            video,
            config
        );


        player.on(
            "ready",
            () => {

                addCustomSeekButtons();

            }
        );


        player.play().catch(() => {});
    }
}


/* ==========================================
   ADD BUTTONS TO PLYR CONTROL BAR
   ========================================== */

function addCustomSeekButtons() {

    const controls =
        document.querySelector(".plyr__controls");

    if (!controls) {
        return;
    }


    /* Already added */
    if (
        document.getElementById("plyr-back-10")
    ) {
        return;
    }


    /*
     * Find actual Play button
     */
    const playButton =
        controls.querySelector(
            '[data-plyr="play"]'
        );


    /* ======================================
       BACK 10 BUTTON
       ====================================== */

    const backButton =
        document.createElement("button");

    backButton.type = "button";

    backButton.id = "plyr-back-10";

    backButton.className =
        "plyr__control custom-seek-button";

    backButton.setAttribute(
        "aria-label",
        "Back 10 seconds"
    );

    backButton.setAttribute(
        "data-tooltip",
        "Back 10 seconds"
    );

    backButton.innerHTML = `
        <span class="seek-content">
            <span class="seek-icon">↶</span>
            <span class="seek-seconds">10</span>
        </span>
    `;


    /* ======================================
       FORWARD 10 BUTTON
       ====================================== */

    const forwardButton =
        document.createElement("button");

    forwardButton.type = "button";

    forwardButton.id =
        "plyr-forward-10";

    forwardButton.className =
        "plyr__control custom-seek-button";

    forwardButton.setAttribute(
        "aria-label",
        "Forward 10 seconds"
    );

    forwardButton.setAttribute(
        "data-tooltip",
        "Forward 10 seconds"
    );

    forwardButton.innerHTML = `
        <span class="seek-content">
            <span class="seek-icon">↷</span>
            <span class="seek-seconds">10</span>
        </span>
    `;


    /* ======================================
       PUT BUTTONS AROUND PLAY
       ====================================== */

    if (playButton) {

        /*
         * Back button before Play
         */
        playButton.parentNode.insertBefore(
            backButton,
            playButton
        );


        /*
         * Forward button after Play
         */
        if (playButton.nextSibling) {

            playButton.parentNode.insertBefore(
                forwardButton,
                playButton.nextSibling
            );

        } else {

            playButton.parentNode.appendChild(
                forwardButton
            );
        }

    } else {

        controls.prepend(backButton);
        controls.prepend(forwardButton);

    }


    /* ======================================
       BACK 10 ACTION
       ====================================== */

    backButton.addEventListener(
        "click",
        function (e) {

            e.preventDefault();
            e.stopPropagation();

            video.currentTime = Math.max(
                0,
                video.currentTime - 10
            );

        }
    );


    /* ======================================
       FORWARD 10 ACTION
       ====================================== */

    forwardButton.addEventListener(
        "click",
        function (e) {

            e.preventDefault();
            e.stopPropagation();


            if (isFinite(video.duration)) {

                video.currentTime = Math.min(
                    video.duration,
                    video.currentTime + 10
                );

            } else {

                video.currentTime += 10;

            }

        }
    );

}


/* ==========================================
   PRESS & HOLD = 2X SPEED
   ========================================== */

let holdTimer = null;
let isHolding = false;


video.addEventListener(
    "pointerdown",
    function (e) {

        /*
         * Only left mouse button
         */
        if (
            e.pointerType === "mouse" &&
            e.button !== 0
        ) {
            return;
        }


        holdTimer = setTimeout(
            () => {

                isHolding = true;


                /* 2x */
                video.playbackRate = 2;


                /* Show indicator */
                speedIndicator.classList.add(
                    "show"
                );


                /* Play if paused */
                if (video.paused) {

                    video.play().catch(
                        () => {}
                    );

                }

            },
            450
        );

    }
);


/* ==========================================
   RELEASE = NORMAL SPEED
   ========================================== */

function stopHold() {

    if (holdTimer) {

        clearTimeout(holdTimer);

        holdTimer = null;
    }


    if (isHolding) {

        video.playbackRate = 1;

        speedIndicator.classList.remove(
            "show"
        );

        isHolding = false;
    }
}


video.addEventListener(
    "pointerup",
    stopHold
);


video.addEventListener(
    "pointercancel",
    stopHold
);


video.addEventListener(
    "pointerleave",
    function (e) {

        if (e.pointerType === "mouse") {
            stopHold();
        }

    }
);


/* ==========================================
   DISABLE CONTEXT MENU
   ========================================== */

video.addEventListener(
    "contextmenu",
    function (e) {
        e.preventDefault();
    }
);


/* ==========================================
   START
   ========================================== */

initPlayer();

</script>

</body>
</html>
