<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">

    <title>Live Stream</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #player-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        #plyr-player {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* =================================
           CUSTOM SEEK BUTTONS
           ================================= */

        #seek-controls {
            position: absolute;

            left: 50%;
            bottom: 65px;

            transform: translateX(-50%);

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 22px;

            z-index: 50;

            pointer-events: none;
        }

        .seek-btn {
            width: 48px;
            height: 48px;

            border: 0;
            border-radius: 50%;

            background: rgba(0, 0, 0, 0.65);
            color: #fff;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            font-size: 14px;
            font-weight: 700;

            backdrop-filter: blur(4px);

            pointer-events: auto;

            transition: background 0.15s, transform 0.15s;
        }

        .seek-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.08);
        }

        .seek-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.35);
        }

        .seek-icon {
            font-size: 22px;
            line-height: 1;
        }

        .seek-text {
            font-size: 11px;
            margin-top: 1px;
        }

        /* =================================
           2X INDICATOR
           ================================= */

        #speed-indicator {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            display: none;

            padding: 10px 18px;

            border-radius: 10px;

            background: rgba(0, 0, 0, 0.75);

            color: #fff;

            font-size: 22px;
            font-weight: 700;

            z-index: 60;

            pointer-events: none;
        }

        #speed-indicator.show {
            display: block;
        }

        /* =================================
           MOBILE
           ================================= */

        @media (max-width: 600px) {

            #seek-controls {
                bottom: 58px;
                gap: 18px;
            }

            .seek-btn {
                width: 44px;
                height: 44px;
            }

            .seek-icon {
                font-size: 20px;
            }

            .seek-text {
                font-size: 10px;
            }
        }

    </style>
</head>

<body>

<div id="player-wrapper">

    <video
        id="plyr-player"
        controls
        playsinline
        preload="auto">
    </video>


    <!-- CUSTOM SEEK BUTTONS -->

    <div id="seek-controls">

        <!-- 10 SEC BACK -->

        <button
            id="back10"
            class="seek-btn"
            type="button"
            aria-label="Back 10 seconds">

            <span>
                <span class="seek-icon">↶</span>
                <br>
                <span class="seek-text">10</span>
            </span>

        </button>


        <!-- 10 SEC FORWARD -->

        <button
            id="forward10"
            class="seek-btn"
            type="button"
            aria-label="Forward 10 seconds">

            <span>
                <span class="seek-icon">↷</span>
                <br>
                <span class="seek-text">10</span>
            </span>

        </button>

    </div>


    <!-- 2X INDICATOR -->

    <div id="speed-indicator">
        2×
    </div>

</div>


<script>

function qp(key) {
    return new URLSearchParams(location.search).get(key);
}

function isM3U8(url) {
    return url && url.toLowerCase().includes(".m3u8");
}

const video = document.getElementById("plyr-player");

const back10 = document.getElementById("back10");
const forward10 = document.getElementById("forward10");

const speedIndicator =
    document.getElementById("speed-indicator");

let player;


/* ==========================================
   PLAYER INITIALIZATION
   ========================================== */

async function initPlayer() {

    const videoSrc =
        decodeURIComponent(qp("url") || "");


    if (!videoSrc) {

        alert("Use ?url=");

        return;
    }


    const config = {

        clickToPlay: true,

        controls: [
            "play-large",
            "play",
            "progress",
            "current-time",
            "mute",
            "volume",
            "pip",
            "settings",
            "fullscreen"
        ],

        settings: [
            "quality",
            "speed"
        ]
    };


    /* ======================================
       HLS
       ====================================== */

    if (
        Hls.isSupported() &&
        isM3U8(videoSrc)
    ) {

        const hls = new Hls({
            maxBufferLength: 30
        });


        hls.loadSource(videoSrc);

        hls.attachMedia(video);


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                const qualities = [
                    ...new Set(
                        hls.levels
                            .map(level => level.height)
                            .filter(Boolean)
                    )
                ].sort((a, b) => a - b);


                if (qualities.length) {

                    config.quality = {

                        default:
                            qualities[qualities.length - 1],

                        options:
                            qualities,

                        forced: true,

                        onChange:
                            (quality) => {

                                hls.levels.forEach(
                                    (level, index) => {

                                        if (
                                            level.height ===
                                            quality
                                        ) {

                                            hls.currentLevel =
                                                index;
                                        }

                                    }
                                );
                            }
                    };
                }


                player = new Plyr(
                    video,
                    config
                );


                player.play().catch(
                    () => {}
                );

            }
        );


    } else {

        /* ==================================
           NORMAL VIDEO
           ================================== */

        video.src = videoSrc;


        player = new Plyr(
            video,
            config
        );


        player.play().catch(
            () => {}
        );
    }
}


/* ==========================================
   BACK 10 SECONDS
   ========================================== */

back10.addEventListener(
    "click",
    function (e) {

        e.preventDefault();

        e.stopPropagation();


        video.currentTime = Math.max(
            0,
            video.currentTime - 10
        );

    }
);


/* ==========================================
   FORWARD 10 SECONDS
   ========================================== */

forward10.addEventListener(
    "click",
    function (e) {

        e.preventDefault();

        e.stopPropagation();


        if (isFinite(video.duration)) {

            video.currentTime = Math.min(
                video.duration,
                video.currentTime + 10
            );

        } else {

            video.currentTime += 10;
        }

    }
);


/* ==========================================
   PRESS & HOLD = 2X SPEED
   ========================================== */

let holdTimer = null;
let isHolding = false;


/*
 * Press start
 */

video.addEventListener(
    "pointerdown",
    function (e) {

        if (
            e.pointerType === "mouse" &&
            e.button !== 0
        ) {
            return;
        }


        holdTimer = setTimeout(
            function () {

                isHolding = true;


                /*
                 * 2X speed
                 */

                video.playbackRate = 2;


                /*
                 * Show indicator
                 */

                speedIndicator.classList.add(
                    "show"
                );


                /*
                 * Play if paused
                 */

                if (video.paused) {

                    video.play().catch(
                        () => {}
                    );
                }

            },
            450
        );

    }
);


/*
 * Stop hold
 */

function stopHold() {

    if (holdTimer) {

        clearTimeout(holdTimer);

        holdTimer = null;
    }


    if (isHolding) {

        /*
         * Back to normal speed
         */

        video.playbackRate = 1;


        /*
         * Hide 2x indicator
         */

        speedIndicator.classList.remove(
            "show"
        );


        isHolding = false;
    }
}


video.addEventListener(
    "pointerup",
    stopHold
);


video.addEventListener(
    "pointercancel",
    stopHold
);


/*
 * Mouse video se bahar chala jaye
 */

video.addEventListener(
    "pointerleave",
    function (e) {

        if (e.pointerType === "mouse") {
            stopHold();
        }

    }
);


/*
 * Context menu disable
 */

video.addEventListener(
    "contextmenu",
    function (e) {

        e.preventDefault();

    }
);


/* ==========================================
   START
   ========================================== */

initPlayer();

</script>

</body>
</html>
