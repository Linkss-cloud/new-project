<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">

    <title>Live Stream</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            touch-action: manipulation;
        }

        #player-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        #plyr-player {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* 2x indicator */
        #speed-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            display: none;

            padding: 12px 20px;
            border-radius: 10px;

            background: rgba(0, 0, 0, 0.75);
            color: #fff;

            font-size: 22px;
            font-weight: 700;

            z-index: 20;
            pointer-events: none;
        }

        #speed-indicator.show {
            display: block;
        }

        /* Seek indicators */
        .seek-indicator {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);

            display: none;

            padding: 12px 18px;
            border-radius: 50px;

            background: rgba(0, 0, 0, 0.7);
            color: #fff;

            font-size: 18px;
            font-weight: 600;

            z-index: 20;
            pointer-events: none;
        }

        #back-indicator {
            left: 15%;
        }

        #forward-indicator {
            right: 15%;
        }

        .seek-indicator.show {
            display: block;
            animation: seekAnimation 0.5s ease;
        }

        @keyframes seekAnimation {
            0% {
                opacity: 0;
                transform: translateY(-50%) scale(0.8);
            }

            50% {
                opacity: 1;
                transform: translateY(-50%) scale(1.1);
            }

            100% {
                opacity: 0;
                transform: translateY(-50%) scale(1);
            }
        }
    </style>
</head>

<body>

<div id="player-wrapper">

    <video
        id="plyr-player"
        controls
        playsinline
        preload="auto">
    </video>

    <div id="speed-indicator">2×</div>

    <div id="back-indicator" class="seek-indicator">
        ↶ 10 sec
    </div>

    <div id="forward-indicator" class="seek-indicator">
        10 sec ↷
    </div>

</div>


<script>

function qp(key) {
    return new URLSearchParams(location.search).get(key);
}

function isM3U8(url) {
    return url && url.toLowerCase().includes(".m3u8");
}

const video = document.getElementById("plyr-player");

const speedIndicator = document.getElementById("speed-indicator");
const backIndicator = document.getElementById("back-indicator");
const forwardIndicator = document.getElementById("forward-indicator");

let player;


/* ==========================================
   INITIALIZE PLAYER
   ========================================== */

async function initPlayer() {

    const videoSrc = decodeURIComponent(qp("url") || "");

    if (!videoSrc) {
        alert("Use ?url=");
        return;
    }

    const config = {

        clickToPlay: true,

        controls: [
            "play-large",
            "play",
            "progress",
            "current-time",
            "mute",
            "volume",
            "pip",
            "settings",
            "fullscreen"
        ],

        settings: [
            "quality",
            "speed"
        ]
    };


    /* ======================================
       HLS / M3U8
       ====================================== */

    if (Hls.isSupported() && isM3U8(videoSrc)) {

        const hls = new Hls({
            maxBufferLength: 30
        });

        hls.loadSource(videoSrc);
        hls.attachMedia(video);


        hls.on(Hls.Events.MANIFEST_PARSED, () => {

            const qualities = [
                ...new Set(
                    hls.levels
                        .map(level => level.height)
                        .filter(Boolean)
                )
            ].sort((a, b) => a - b);


            if (qualities.length > 0) {

                config.quality = {

                    default: qualities[qualities.length - 1],

                    options: qualities,

                    forced: true,

                    onChange: (quality) => {

                        hls.levels.forEach((level, index) => {

                            if (level.height === quality) {
                                hls.currentLevel = index;
                            }

                        });

                    }
                };
            }


            player = new Plyr(video, config);

            player.play().catch(() => {});

        });


    } else {

        /* ==================================
           NORMAL VIDEO
           ================================== */

        video.src = videoSrc;

        player = new Plyr(video, config);

        player.play().catch(() => {});
    }
}


/* ==========================================
   SEEK INDICATOR
   ========================================== */

function showSeekIndicator(indicator) {

    indicator.classList.remove("show");

    // Force animation restart
    void indicator.offsetWidth;

    indicator.classList.add("show");

    setTimeout(() => {
        indicator.classList.remove("show");
    }, 500);
}


/* ==========================================
   DOUBLE CLICK / DOUBLE TAP
   ==========================================

   LEFT  = -10 seconds
   RIGHT = +10 seconds

   Works with:
   - Mouse
   - Touch
   - Stylus
   ========================================== */

let lastTapTime = 0;
let lastTapX = 0;

video.addEventListener("pointerup", function (e) {

    /*
     * Agar long press hua tha,
     * to ise double tap nahi maanenge.
     */
    if (video.dataset.longPress === "true") {

        video.dataset.longPress = "false";

        return;
    }


    const now = Date.now();

    const rect = video.getBoundingClientRect();

    const clickX = e.clientX - rect.left;

    const width = rect.width;


    const timeSinceLastTap = now - lastTapTime;


    /*
     * Double click / double tap
     */
    if (
        timeSinceLastTap < 350 &&
        Math.abs(clickX - lastTapX) < 180
    ) {

        /* ================================
           LEFT SIDE = 10 SEC BACK
           ================================= */

        if (clickX < width / 2) {

            video.currentTime = Math.max(
                0,
                video.currentTime - 10
            );

            showSeekIndicator(backIndicator);


        } else {

            /* ================================
               RIGHT SIDE = 10 SEC FORWARD
               ================================= */

            if (isFinite(video.duration)) {

                video.currentTime = Math.min(
                    video.duration,
                    video.currentTime + 10
                );

            } else {

                video.currentTime += 10;
            }

            showSeekIndicator(forwardIndicator);
        }


        lastTapTime = 0;

        return;
    }


    /*
     * First tap/click
     */
    lastTapTime = now;
    lastTapX = clickX;

});


/* ==========================================
   PRESS & HOLD = 2X SPEED
   ========================================== */

let holdTimer = null;
let isHolding = false;


/*
 * Press down
 */
video.addEventListener("pointerdown", function (e) {

    /*
     * Sirf primary mouse button
     */
    if (
        e.pointerType === "mouse" &&
        e.button !== 0
    ) {
        return;
    }


    video.dataset.longPress = "false";


    /*
     * 450ms hold ke baad 2x
     */
    holdTimer = setTimeout(() => {

        isHolding = true;

        video.dataset.longPress = "true";


        /* 2X playback */
        video.playbackRate = 2;


        /* Show 2x indicator */
        speedIndicator.classList.add("show");


        /*
         * Agar video paused hai
         * to automatically play
         */
        if (video.paused) {

            video.play().catch(() => {});

        }

    }, 450);

});


/* ==========================================
   STOP HOLD
   ========================================== */

function stopHold() {

    /*
     * Timer cancel
     */
    if (holdTimer) {

        clearTimeout(holdTimer);

        holdTimer = null;
    }


    /*
     * Agar 2x mode active tha
     */
    if (isHolding) {

        /*
         * Normal speed
         */
        video.playbackRate = 1;


        /*
         * Hide indicator
         */
        speedIndicator.classList.remove("show");


        isHolding = false;
    }
}


/* ==========================================
   POINTER EVENTS
   ========================================== */

video.addEventListener("pointerup", stopHold);

video.addEventListener("pointercancel", stopHold);


/*
 * Mouse video se bahar chala jaye
 */
video.addEventListener("pointerleave", function (e) {

    if (e.pointerType === "mouse") {
        stopHold();
    }

});


/* ==========================================
   CONTEXT MENU DISABLE
   ========================================== */

video.addEventListener("contextmenu", function (e) {

    e.preventDefault();

});


/* ==========================================
   PREVENT UNWANTED LONG-PRESS SELECTION
   ========================================== */

video.addEventListener("selectstart", function (e) {

    e.preventDefault();

});


/* ==========================================
   START PLAYER
   ========================================== */

initPlayer();

</script>

</body>
</html>
