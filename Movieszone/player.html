<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="referrer" content="no-referrer">

<title>Live Stream</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#player-wrapper{
    width:100%;
    height:100%;
    background:#000;
}

#plyr-player{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}


/* Telegram Popup */

#telegram-popup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:320px;
    background:#111;
    color:#fff;
    padding:25px;
    border-radius:18px;
    display:none;
    flex-direction:column;
    align-items:center;
    gap:18px;
    z-index:99999;
    font-family:Arial,sans-serif;
    text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.8);
}

#telegram-popup span{
    font-size:20px;
    font-weight:bold;
}

#telegram-popup button{
    width:100%;
    background:#229ED9;
    color:white;
    border:none;
    padding:14px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

#telegram-popup .close{
    background:#333;
}

</style>

</head>

<body>


<div id="player-wrapper">
    <video id="plyr-player" controls playsinline></video>
</div>


<!-- Telegram Popup -->

<div id="telegram-popup">
    <span>Join our Telegram channel for updates</span>
    <button onclick="openTelegram()">Join</button>
    <button class="close" onclick="closeTelegram()">×</button>
</div>



<script>

function qp(key){
    return new URLSearchParams(location.search).get(key);
}


function isM3U8(url){
    return url && url.toLowerCase().includes(".m3u8");
}


const video=document.getElementById("plyr-player");
let player;


async function initPlayer(){

    const videoSrc=decodeURIComponent(qp("url")||"");

    if(!videoSrc){
        alert("Use ?url=");
        return;
    }


    const config={

        clickToPlay:true,

        controls:[
            "play-large",
            "play",
            "progress",
            "current-time",
            "mute",
            "volume",
            "pip",
            "settings",
            "fullscreen"
        ],

        settings:[
            "quality",
            "speed"
        ]

    };



    if(Hls.isSupported() && isM3U8(videoSrc)){


        const hls=new Hls({
            maxBufferLength:30
        });


        hls.loadSource(videoSrc);
        hls.attachMedia(video);



        hls.on(Hls.Events.MANIFEST_PARSED,()=>{


            const qualities=[...new Set(
                hls.levels
                .map(level=>level.height)
                .filter(Boolean)

            )].sort((a,b)=>a-b);



            config.quality={

                default:qualities[qualities.length-1],

                options:qualities,

                forced:true,


                onChange:(quality)=>{

                    hls.levels.forEach((level,index)=>{

                        if(level.height===quality){

                            hls.currentLevel=index;

                        }

                    });

                }

            };



            player=new Plyr(video,config);

            player.play().catch(()=>{});

        });



    }else{


        video.src=videoSrc;

        player=new Plyr(video,config);

        player.play().catch(()=>{});

    }

}



initPlayer();




// Telegram Popup

const telegramLink="https://t.me/+rtK_sfY8t_A2NDU1";


function showTelegram(){

    document.getElementById("telegram-popup").style.display="flex";

}


function closeTelegram(){

    document.getElementById("telegram-popup").style.display="none";

}


function openTelegram(){

    window.open(telegramLink,"_blank");

}


// popup delay

setTimeout(showTelegram,5000);


</script>


</body>
</html>
