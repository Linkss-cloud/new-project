<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Stream</title>

<link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

.video-js{
    width:100%!important;
    height:100vh!important;
}

.video-js video{
    object-fit:contain!important;
}

.loading{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:#fff;
    background:rgba(0,0,0,.8);
    padding:10px 20px;
    border-radius:30px;
    z-index:9999;
}

#error{
    display:none;
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#e53935;
    color:#fff;
    padding:10px 20px;
    border-radius:30px;
    z-index:9999;
}
</style>
</head>

<body>

<video id="player"
class="video-js vjs-big-play-centered"
controls
autoplay
muted
playsinline>
</video>

<div class="loading" id="loading">Loading Stream...</div>
<div id="error">Failed to load stream.</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/videojs-contrib-quality-levels@2.1.0/dist/videojs-contrib-quality-levels.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-hls-quality-selector@1.1.4/dist/videojs-hls-quality-selector.min.js"></script>

<script>
const url = new URLSearchParams(location.search).get("url");

if(!url){
    document.body.innerHTML="<h2 style='color:white;text-align:center;margin-top:40vh'>No URL Provided</h2>";
    throw new Error("Missing URL");
}

const loading=document.getElementById("loading");
const error=document.getElementById("error");

const player=videojs("player",{
    autoplay:true,
    controls:true,
    preload:"auto",
    liveui:true
});

player.hlsQualitySelector({
    displayCurrentQuality:true
});

player.src({
    src:decodeURIComponent(url),
    type:"application/x-mpegURL"
});

player.ready(()=>{
    player.play().catch(()=>{});
});

player.on("playing",()=>{
    loading.style.display="none";
    error.style.display="none";
});

player.on("waiting",()=>{
    loading.style.display="block";
});

player.on("error",()=>{
    loading.style.display="none";
    error.style.display="block";
});
</script>

</body>
</html>
