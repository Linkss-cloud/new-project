<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SPORTS ZONE X NS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 2rem 1rem;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1f1c2c, #928dab);
            color: white;
            min-height: 100vh;
        }

        h1 {
            font-size: 2rem;
            margin: 0 0 1.2rem;
            text-align: center;
            background: linear-gradient(#f5f5f5, #e91e63);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Telegram Button */

        .telegram-wrapper {
            text-align: center;
            margin-bottom: 2rem;
        }

        .telegram-join-top {
            display: none;
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #0088cc, #005f99);
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .telegram-join-top:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Section Title */

        .section-title {
            font-size: 1.5rem;
            margin: 3rem auto 1rem;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 5px;
            width: 100%;
            max-width: 1200px;
        }

        /* Match Grid */

        .match-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
            margin: auto;
        }

        /* Match Card */

        .match-card {
            backdrop-filter: blur(16px);
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s;
        }

        .match-card:hover {
            transform: scale(1.02);
        }

        .match-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
            background: #222;
        }

        .match-content {
            padding: 1rem;
        }

        .match-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .match-details {
            font-size: 0.85rem;
            color: #ccc;
            margin-bottom: 12px;
            line-height: 1.6;
        }

        /* Buttons */

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .watch-btn,
        .copy-btn {
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            font-weight: bold;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.25s;
        }

        .watch-btn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
        }

        .watch-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .copy-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .copy-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .copy-btn.copied {
            background: linear-gradient(135deg, #00b09b, #96c93d);
        }

        /* Disabled */

        .disabled-btn {
            background: #555 !important;
            color: #bbb !important;
            cursor: not-allowed !important;
            transform: none !important;
        }

        /* No Live */

        .no-live {
            padding: 2rem;
            text-align: center;
            color: #eee;
        }

        /* Popup */

        #popup {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .popup-box {
            background: #1e1e1e;
            padding: 2rem;
            border-radius: 16px;
            max-width: 90%;
            width: 400px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .popup-box h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #ff4b2b;
        }

        .popup-box p {
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
            color: #ddd;
        }

        .playstore-btn {
            display: inline-block;
            background: linear-gradient(135deg, #34A853, #0F9D58);
            color: #fff;
            padding: 12px 24px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 10px;
        }

        .playstore-btn:hover {
            opacity: 0.9;
        }

        .close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 22px;
            color: #fff;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #ff4b2b;
        }

        /* Mobile */

        @media (max-width: 600px) {

            body {
                padding: 1.5rem 0.8rem;
            }

            h1 {
                font-size: 1.6rem;
            }

            .section-title {
                font-size: 1.25rem;
                margin-top: 2rem;
            }

            .match-grid {
                grid-template-columns: 1fr;
                gap: 1.2rem;
            }

            .match-card img {
                height: 180px;
            }

            .popup-box {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>

    <h1>🔥 Live Sports Stream</h1>

    <!-- Telegram -->

    <div class="telegram-wrapper">

        <button
            id="telegramTop"
            class="telegram-join-top"
            type="button">

            📣 Join Telegram For All Streams

        </button>

    </div>


    <!-- Live Matches -->

    <div class="section-title">
        🔴 Live Matches
    </div>

    <div
        class="match-grid"
        id="liveMatches">
    </div>


    <!-- Upcoming Matches -->

    <div class="section-title">
        📅 Upcoming Matches
    </div>

    <div
        class="match-grid"
        id="upcomingMatches">
    </div>


    <!-- NS PLAYER POPUP -->

    <div id="popup">

        <div class="popup-box">

            <div
                class="close-btn"
                id="closePopup">
                ✖
            </div>

            <h2>📱 Android Only</h2>

            <p>
                This streaming system only works on
                <b>Android phones</b>.
                <br><br>
                Before watching any stream, please install
                <b>NS Player</b> from Play Store.
            </p>

            <a
                class="playstore-btn"
                href="https://play.google.com/store/apps/details?id=com.genuine.leone"
                target="_blank"
                rel="noopener noreferrer">

                📥 Install NS Player

            </a>

        </div>

    </div>


    <script>

        /* =====================================
           ELEMENTS
        ===================================== */

        const liveContainer =
            document.getElementById("liveMatches");

        const upcomingContainer =
            document.getElementById("upcomingMatches");

        const telegramTop =
            document.getElementById("telegramTop");

        const popup =
            document.getElementById("popup");

        const closePopup =
            document.getElementById("closePopup");


        /* =====================================
           TELEGRAM
        ===================================== */

        telegramTop.addEventListener("click", function () {

            window.location.href =
                "https://t.me/+rtK_sfY8t_A2NDU1";

        });


        /* =====================================
           CLOSE POPUP
        ===================================== */

        closePopup.addEventListener("click", function () {

            popup.style.display = "none";

        });


        /* =====================================
           OPEN STREAM
        ===================================== */

        function openStream(url) {

            if (!url) {

                alert(
                    "Stream URL is not available."
                );

                return;
            }

            console.log(
                "Opening stream:",
                url
            );


            /*
             * Remove http:// or https://
             */

            const cleanUrl =
                url.replace(
                    /^https?:\/\//i,
                    ""
                );


            /*
             * Android NS Player intent
             */

            const intentUrl =
                "intent://" +
                cleanUrl +
                "#Intent;" +
                "scheme=https;" +
                "package=com.genuine.leone;" +
                "type=video/*;" +
                "S.browser_fallback_url=" +
                encodeURIComponent(url) +
                ";" +
                "end";


            window.location.href =
                intentUrl;
        }


        /* =====================================
           COPY URL
        ===================================== */

        async function copyUrl(
            url,
            button
        ) {

            if (!url) {

                alert(
                    "URL is not available."
                );

                return;
            }


            const originalText =
                button.innerHTML;


            try {

                /*
                 * Modern clipboard
                 */

                if (
                    navigator.clipboard &&
                    window.isSecureContext
                ) {

                    await navigator.clipboard
                        .writeText(url);

                } else {

                    /*
                     * Fallback
                     */

                    const textarea =
                        document.createElement(
                            "textarea"
                        );

                    textarea.value = url;

                    textarea.style.position =
                        "fixed";

                    textarea.style.left =
                        "-9999px";

                    textarea.style.top =
                        "-9999px";

                    document.body.appendChild(
                        textarea
                    );

                    textarea.focus();

                    textarea.select();

                    document.execCommand(
                        "copy"
                    );

                    textarea.remove();
                }


                button.innerHTML =
                    "✅ URL Copied!";

                button.classList.add(
                    "copied"
                );


                setTimeout(function () {

                    button.innerHTML =
                        originalText;

                    button.classList.remove(
                        "copied"
                    );

                }, 2000);


            } catch (error) {

                console.error(
                    "Copy failed:",
                    error
                );

                alert(
                    "Unable to copy URL. Please copy it manually."
                );

            }

        }


        /* =====================================
           CREATE BUTTON
        ===================================== */

        function createButton(
            text,
            className,
            callback
        ) {

            const button =
                document.createElement(
                    "button"
                );

            button.type = "button";

            button.className =
                className;

            button.textContent =
                text;

            button.addEventListener(
                "click",
                callback
            );

            return button;
        }


        /* =====================================
           CREATE COPY BUTTON
        ===================================== */

        function createCopyButton(
            text,
            url
        ) {

            const button =
                createButton(
                    text,
                    "copy-btn",
                    function () {

                        copyUrl(
                            url,
                            button
                        );

                    }
                );

            return button;
        }


        /* =====================================
           CREATE MATCH CARD
        ===================================== */

        function createMatchCard(
            match
        ) {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "match-card";


            /* IMAGE */

            const image =
                document.createElement(
                    "img"
                );

            image.src =
                match.src || "";

            image.alt =
                "Match poster";

            image.loading =
                "lazy";

            image.onerror =
                function () {

                    this.style.display =
                        "none";

                };

            card.appendChild(
                image
            );


            /* CONTENT */

            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "match-content";


            /* TITLE */

            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "match-title";

            title.textContent =
                match.match_name ||
                "Unknown Match";

            content.appendChild(
                title
            );


            /* DETAILS */

            const details =
                document.createElement(
                    "div"
                );

            details.className =
                "match-details";

            details.innerHTML =
                "🏆 " +
                escapeHtml(
                    match.event_name ||
                    "Unknown Event"
                ) +
                "<br>" +
                "📺 " +
                escapeHtml(
                    match.broadcast_channel ||
                    "N/A"
                ) +
                " | 🔊 " +
                escapeHtml(
                    match.audioLanguageName ||
                    "N/A"
                );

            content.appendChild(
                details
            );


            /* BUTTON GROUP */

            const buttonGroup =
                document.createElement(
                    "div"
                );

            buttonGroup.className =
                "btn-group";


            /* =================================
               MAIN STREAM
            ================================= */

            if (
                match.isLive &&
                match.video_url
            ) {

                const watchButton =
                    createButton(
                        "▶️ Main Stream",
                        "watch-btn",
                        function () {

                            openStream(
                                match.video_url
                            );

                        }
                    );


                const copyButton =
                    createCopyButton(
                        "📋 Copy Main URL",
                        match.video_url
                    );


                buttonGroup.appendChild(
                    watchButton
                );

                buttonGroup.appendChild(
                    copyButton
                );

            }


            /* =================================
               DAI STREAM
            ================================= */

            if (
                match.isLive &&
                match.dai_url
            ) {

                const watchButton =
                    createButton(
                        "💡 DAI Stream",
                        "watch-btn",
                        function () {

                            openStream(
                                match.dai_url
                            );

                        }
                    );


                const copyButton =
                    createCopyButton(
                        "📋 Copy DAI URL",
                        match.dai_url
                    );


                buttonGroup.appendChild(
                    watchButton
                );

                buttonGroup.appendChild(
                    copyButton
                );

            }


            /* =================================
               PUB STREAM
            ================================= */

            if (
                match.isLive &&
                match.pub_url
            ) {

                const watchButton =
                    createButton(
                        "📺 PUB Stream",
                        "watch-btn",
                        function () {

                            openStream(
                                match.pub_url
                            );

                        }
                    );


                const copyButton =
                    createCopyButton(
                        "📋 Copy PUB URL",
                        match.pub_url
                    );


                buttonGroup.appendChild(
                    watchButton
                );

                buttonGroup.appendChild(
                    copyButton
                );

            }


            /*
             * If no stream URLs exist
             */

            if (
                match.isLive &&
                !match.video_url &&
                !match.dai_url &&
                !match.pub_url
            ) {

                const unavailable =
                    createButton(
                        "⚠️ Stream Not Available",
                        "watch-btn disabled-btn",
                        function () {

                            alert(
                                "No stream URL is available for this match."
                            );

                        }
                    );

                buttonGroup.appendChild(
                    unavailable
                );

            }


            content.appendChild(
                buttonGroup
            );

            card.appendChild(
                content
            );


            return card;
        }


        /* =====================================
           ESCAPE HTML
        ===================================== */

        function escapeHtml(
            value
        ) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =====================================
           LOAD MATCH DATA
        ===================================== */

        async function loadMatches() {

            try {

                const response =
                    await fetch(
                        "https://raw.githubusercontent.com/drmlive/sliv-live-events/main/sonyliv.json",
                        {
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "HTTP Error: " +
                        response.status
                    );

                }


                const data =
                    await response.json();


                if (
                    !data.matches ||
                    !Array.isArray(
                        data.matches
                    )
                ) {

                    throw new Error(
                        "Invalid match data."
                    );

                }


                liveContainer.innerHTML =
                    "";

                upcomingContainer.innerHTML =
                    "";


                let liveCount = 0;


                /* =================================
                   PROCESS MATCHES
                ================================= */

                data.matches.forEach(
                    function (match) {

                        const card =
                            createMatchCard(
                                match
                            );


                        if (
                            match.isLive
                        ) {

                            liveContainer
                                .appendChild(
                                    card
                                );

                            liveCount++;

                        } else {

                            upcomingContainer
                                .appendChild(
                                    card
                                );

                        }

                    }
                );


                /* =================================
                   TELEGRAM BUTTON
                ================================= */

                telegramTop.style.display =
                    "inline-block";


                /* =================================
                   NO LIVE MATCHES
                ================================= */

                if (
                    liveCount === 0
                ) {

                    liveContainer.innerHTML =
                        '<div class="no-live">' +
                        '🔴 No live matches currently.' +
                        '</div>';

                }


                /* =================================
                   NO UPCOMING MATCHES
                ================================= */

                if (
                    upcomingContainer
                        .children.length === 0
                ) {

                    upcomingContainer.innerHTML =
                        '<div class="no-live">' +
                        '📅 No upcoming matches.' +
                        '</div>';

                }


            } catch (error) {

                console.error(
                    "Match loading error:",
                    error
                );


                liveContainer.innerHTML =
                    '<div class="no-live">' +
                    '⚠️ Failed to load matches.' +
                    '<br><br>' +
                    '<small>' +
                    escapeHtml(
                        error.message
                    ) +
                    '</small>' +
                    '</div>';

            }

        }


        /* =====================================
           START
        ===================================== */

        loadMatches();

    </script>

</body>

</html>
