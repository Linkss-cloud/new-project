<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sports Zone TV</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0d12;
      color: #fff;
      min-height: 100vh;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: #12151d;
      border-bottom: 1px solid #292d38;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      padding: 15px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    /* LEFT LOGO */

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: white;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(
        135deg,
        #ef4444,
        #7c3aed
      );

      font-size: 20px;
    }

    .brand-text {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    /* TELEGRAM */

    .telegram-btn {
      display: flex;
      align-items: center;
      gap: 9px;

      padding: 10px 16px;

      border-radius: 8px;

      background: #229ed9;
      color: white;

      text-decoration: none;

      font-size: 14px;
      font-weight: 700;

      transition: 0.2s;
    }

    .telegram-btn:hover {
      background: #168ac2;
      transform: translateY(-1px);
    }

    .telegram-icon {
      font-size: 19px;
    }


    /* =========================
       MAIN
    ========================= */

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 30px 20px;
    }

    .page-title {
      margin-bottom: 22px;
    }

    .page-title h1 {
      font-size: 25px;
      margin-bottom: 5px;
    }

    .page-title p {
      color: #8d94a5;
      font-size: 14px;
    }


    /* =========================
       CHANNEL GRID
    ========================= */

    .channels {
      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(210px, 1fr));

      gap: 20px;
    }


    /* =========================
       CHANNEL CARD
    ========================= */

    .channel {
      background: #151821;

      border: 1px solid #272b35;

      border-radius: 14px;

      padding: 18px;

      text-align: center;

      transition: 0.2s;
    }

    .channel:hover {
      transform: translateY(-4px);

      border-color: #4f46e5;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.3);
    }


    /* LOGO */

    .logo {
      width: 100px;
      height: 100px;

      object-fit: contain;

      background: #fff;

      border-radius: 12px;

      padding: 8px;

      margin-bottom: 13px;
    }


    /* LIVE */

    .live {
      display: flex;

      justify-content: center;
      align-items: center;

      gap: 6px;

      color: #22c55e;

      font-size: 11px;

      font-weight: 700;

      margin-bottom: 10px;
    }

    .live-dot {
      width: 7px;
      height: 7px;

      background: #22c55e;

      border-radius: 50%;

      box-shadow:
        0 0 8px #22c55e;
    }


    /* CHANNEL NAME */

    .channel-name {
      font-size: 17px;

      margin-bottom: 14px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    /* WATCH BUTTON */

    .watch-btn {
      display: block;

      width: 100%;

      border: none;

      background: #4f46e5;

      color: white;

      padding: 11px;

      border-radius: 8px;

      font-size: 14px;

      font-weight: 700;

      text-decoration: none;

      cursor: pointer;

      transition: 0.2s;
    }

    .watch-btn:hover {
      background: #6366f1;
    }


    /* =========================
       LOADING
    ========================= */

    .loading {
      grid-column: 1 / -1;

      text-align: center;

      color: #8d94a5;

      padding: 50px 20px;
    }


    /* ERROR */

    .error {
      grid-column: 1 / -1;

      background: #351717;

      border: 1px solid #7f1d1d;

      color: #fca5a5;

      padding: 15px;

      border-radius: 10px;

      text-align: center;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      max-width: 1200px;

      margin: 30px auto 0;

      padding: 20px;

      text-align: center;

      color: #666d7c;

      font-size: 13px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .header-inner {
        padding: 12px 15px;
      }

      .brand-text {
        font-size: 18px;
      }

      .brand-icon {
        width: 36px;
        height: 36px;
        font-size: 17px;
      }

      .telegram-btn {
        padding: 9px 11px;
        font-size: 12px;
      }

      .telegram-icon {
        font-size: 16px;
      }

      .container {
        padding: 22px 12px;
      }

      .page-title h1 {
        font-size: 21px;
      }

      .channels {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 12px;
      }

      .channel {
        padding: 12px;
      }

      .logo {
        width: 75px;
        height: 75px;
      }

      .channel-name {
        font-size: 14px;
      }

      .watch-btn {
        padding: 9px 5px;
        font-size: 12px;
      }
    }

  </style>
</head>

<body>


  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <div class="header-inner">

      <!-- LEFT -->

      <a href="/" class="brand">

        <div class="brand-icon">
          📺
        </div>

        <div class="brand-text">
          SPORTS ZONE TV
        </div>

      </a>


      <!-- RIGHT -->

      <a
        class="telegram-btn"
        href="https://t.me/YOUR_TELEGRAM"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="telegram-icon">
          ✈
        </span>

        JOIN TELEGRAM

      </a>

    </div>

  </header>



  <!-- =========================
       CONTENT
  ========================= -->

  <main class="container">

    <div class="page-title">

      <h1>
        📺 Live Channels
      </h1>

      <p>
        Select a channel to watch
      </p>

    </div>


    <!-- CHANNELS WILL LOAD HERE -->

    <div
      class="channels"
      id="channels"
    >

      <div class="loading">
        Loading channels...
      </div>

    </div>

  </main>



  <!-- =========================
       FOOTER
  ========================= -->

  <footer>
    © 2026 Sports Zone TV
  </footer>



  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    const channelsContainer =
      document.getElementById("channels");


    /*
      LOAD CHANNELS FROM EXTERNAL JSON
    */

    fetch("https://cricketttttt.pages.dev/Secure/tvvv.json")

      .then(response => {

        if (!response.ok) {
          throw new Error(
            "tvvv.json not found"
          );
        }

        return response.json();

      })


      .then(channels => {

        channelsContainer.innerHTML = "";


        /*
          CHECK JSON
        */

        if (
          !Array.isArray(channels) ||
          channels.length === 0
        ) {

          channelsContainer.innerHTML = `
            <div class="error">
              No channels available.
            </div>
          `;

          return;
        }


        /*
          CREATE CHANNEL CARDS
        */

        channels.forEach(channel => {


          /*
            CARD
          */

          const card =
            document.createElement("div");

          card.className = "channel";


          /*
            CHANNEL LOGO
          */

          const logo =
            document.createElement("img");

          logo.className = "logo";

          logo.src = channel.logo;

          logo.alt =
            channel.name || "Channel";


          /*
            FALLBACK LOGO
          */

          logo.onerror = function() {

            this.src =
              "https://via.placeholder.com/100?text=TV";

          };


          /*
            LIVE LABEL
          */

          const live =
            document.createElement("div");

          live.className = "live";

          live.innerHTML = `
            <span class="live-dot"></span>
            LIVE
          `;


          /*
            CHANNEL NAME
          */

          const name =
            document.createElement("h2");

          name.className =
            "channel-name";

          name.textContent =
            channel.name || "Unknown Channel";


          /*
            WATCH BUTTON
          */

          const button =
            document.createElement("a");

          button.className =
            "watch-btn";

          button.href =
            channel.stream || "#";

          button.target =
            "_blank";

          button.rel =
            "noopener noreferrer";

          button.textContent =
            "▶ Watch Live";


          /*
            ADD ELEMENTS TO CARD
          */

          card.appendChild(logo);

          card.appendChild(live);

          card.appendChild(name);

          card.appendChild(button);


          /*
            ADD CARD TO GRID
          */

          channelsContainer.appendChild(card);

        });

      })


      /*
        JSON / NETWORK ERROR
      */

      .catch(error => {

        console.error(
          "Channel JSON Error:",
          error
        );


        channelsContainer.innerHTML = `

          <div class="error">

            Unable to load channels.

            <br>

            Please check the external JSON file.

          </div>

        `;

      });

  </script>

</body>
</html>
