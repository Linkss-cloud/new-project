<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Sportlink-Hls-Player</title>

  <!-- Plyr CSS -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>

  <!-- hls.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7VPXZYQPN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-user-select: none; user-select: none;
    }

    #container {
      position: fixed; inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-wrapper {
      width: 100%;
      max-width: 1400px;
    }

    /* Loading spinner */
    #loader {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; z-index: 9000;
      transition: opacity 0.3s;
    }
    #loader.hidden { opacity: 0; display: none; }
    #loader .spinner {
      width: 44px; height: 44px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader p { color: #888; font-size: 13px; letter-spacing: 0.4px; }

    /* Error overlay */
    #error {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #f87171; background: rgba(0,0,0,0.92);
      padding: 22px 28px; border-radius: 12px;
      font-size: 14px; text-align: center;
      max-width: 90%; display: none; z-index: 9500;
      border: 1px solid rgba(255,255,255,0.08);
      line-height: 1.5;
    }
    #error.show { display: block; }
    #error .title { font-weight: 700; margin-bottom: 8px; font-size: 16px; color: #ef4444; }
    #error .detail { color: #aaa; font-size: 12px; margin-top: 8px; word-break: break-word; }

    /* Status pill */
    #status {
      position: fixed; top: 12px; left: 12px; z-index: 9998;
      padding: 6px 14px; background: rgba(8,8,8,0.9);
      color: #3b82f6; border-radius: 20px;
      font-size: 11px; font-weight: 500;
      border: 1px solid rgba(255,255,255,0.05);
      opacity: 0; transition: opacity 0.3s;
      pointer-events: none;
    }
    #status.show { opacity: 1; }

    /* Live badge */
    #liveBadge {
      position: fixed; top: 12px; right: 12px; z-index: 9998;
      padding: 5px 12px; background: rgba(239,68,68,0.95);
      color: #fff; border-radius: 20px;
      font-size: 10px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      display: none;
    }
    #liveBadge.show { display: block; }
    #liveBadge::before {
      content: "●"; margin-right: 5px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* Plyr overrides */
    .plyr { width: 100%; }
    .plyr--video { background: #000; }
    :root {
      --plyr-color-main: #3b82f6;
      --plyr-video-background: #000;
    }
  </style>
</head>
<body>

  <div id="container">
    <div class="player-wrapper">
      <video
        id="player"
        playsinline
        webkit-playsinline
        crossorigin
      ></video>
    </div>
  </div>

  <div id="loader">
    <div class="spinner"></div>
    <p id="loaderText">Loading stream…</p>
  </div>

  <div id="status"></div>
  <div id="liveBadge">Live</div>

  <div id="error">
    <div class="title">Playback Error</div>
    <div id="errorMsg"></div>
    <div class="detail" id="errorDetail"></div>
  </div>

  <!-- Plyr -->
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

  <script>
    (function () {
      "use strict";

      var $video      = document.getElementById("player");
      var $loader     = document.getElementById("loader");
      var $loaderText = document.getElementById("loaderText");
      var $error      = document.getElementById("error");
      var $errorMsg   = document.getElementById("errorMsg");
      var $errorDetail= document.getElementById("errorDetail");
      var $status     = document.getElementById("status");
      var $liveBadge  = document.getElementById("liveBadge");

      var statusTimer = null;
      var hls         = null;

      // ── Parse ?url= query param ───────────────────────────────────────
      // Supports:
      //   ?url=https://example.com/stream.m3u8
      //   ?url=https://example.com/stream.m3u8|Referer=https://site.com/
      function parseParams() {
        var params  = new URLSearchParams(location.search);
        var raw     = params.get("url") || "";
        var referer = params.get("Referer") || params.get("referer") || "";
        var origin  = params.get("Origin") || params.get("origin") || "";
        var cookie  = params.get("Cookie") || params.get("cookie") || "";

        // Pipe-separated extras: url|Referer=https://…&Origin=https://…
        if (raw.indexOf("|") !== -1) {
          var parts = raw.split("|");
          raw = parts[0];
          for (var i = 1; i < parts.length; i++) {
            var pairs = parts[i].split("&");
            for (var j = 0; j < pairs.length; j++) {
              var kv = pairs[j].split("=");
              var k  = (kv[0] || "").trim().toLowerCase();
              var v  = decodeURIComponent(kv.slice(1).join("=") || "").trim();
              if (k === "referer" || k === "referrer") referer = v;
              else if (k === "origin")                  origin  = v;
              else if (k === "cookie")                  cookie  = v;
            }
          }
        }

        return {
          url:     raw.trim(),
          referer: referer.trim(),
          origin:  origin.trim(),
          cookie:  cookie.trim()
        };
      }

      var PARAMS     = parseParams();
      var STREAM_URL = PARAMS.url;

      // ── Helpers ───────────────────────────────────────────────────────
      function showStatus(msg, dur) {
        $status.textContent = msg;
        $status.classList.add("show");
        if (statusTimer) clearTimeout(statusTimer);
        if (dur !== 0) {
          statusTimer = setTimeout(function () {
            $status.classList.remove("show");
            statusTimer = null;
          }, dur || 3000);
        }
      }

      function showError(msg, detail) {
        $errorMsg.textContent   = msg;
        $errorDetail.textContent= detail || "";
        $error.classList.add("show");
        $loader.classList.add("hidden");
        console.error("[Player]", msg, detail || "");
      }

      function hideError() { $error.classList.remove("show"); }
      function hideLoader() { $loader.classList.add("hidden"); }
      function showLoader(text) {
        if (text) $loaderText.textContent = text;
        $loader.classList.remove("hidden");
      }

      // ── Detect iOS / Safari native HLS ───────────────────────────────
      function isIOS() {
        return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      }
      function isSafariNativeHLS() {
        return $video.canPlayType("application/vnd.apple.mpegurl") !== "";
      }

      // ── Initialise Plyr ───────────────────────────────────────────────
      var player = new Plyr($video, {
        controls: [
          'play-large',
          'play',
          'progress',
          'current-time',
          'mute',
          'volume',
          'settings',
          'pip',
          'airplay',
          'fullscreen'
        ],
        settings: ['speed'],
        speed: {
          selected: 1,
          options: [0.5, 0.75, 1, 1.25, 1.5, 2]
        }
      });

      // ── Main player init ──────────────────────────────────────────────
      function initPlayer() {

        if (!STREAM_URL) {
          showError("Missing stream URL", "Add ?url=https://example.com/stream.m3u8");
          return;
        }

        if (PARAMS.referer || PARAMS.origin || PARAMS.cookie) {
          showStatus("Custom headers active", 3000);
        }

        // iOS / Safari native HLS
        if (isIOS() || (isSafariNativeHLS() && !window.Hls)) {
          console.log("[Player] Native HLS mode (iOS/Safari)");
          if (PARAMS.referer || PARAMS.origin) {
            showStatus("Note: custom headers unavailable on iOS", 4000);
          }
          $video.src = STREAM_URL;
          attachNativeListeners();
          $video.play().catch(function () {
            showStatus("Tap ▶ to start", 5000);
          });
          return;
        }

        // hls.js (Chrome, Firefox, Edge, Android)
        if (window.Hls && window.Hls.isSupported()) {
          console.log("[Player] hls.js mode");
          hls = new Hls({
            lowLatencyMode: true,
            enableWorker: true,
            backBufferLength: 30,
            maxBufferLength: 30,
            maxMaxBufferLength: 60,
            liveSyncDurationCount: 3,
            liveMaxLatencyDurationCount: 10,
            manifestLoadingTimeOut: 20000,
            manifestLoadingMaxRetry: 4,
            manifestLoadingRetryDelay: 1000,
            levelLoadingTimeOut: 20000,
            levelLoadingMaxRetry: 4,
            fragLoadingTimeOut: 20000,
            fragLoadingMaxRetry: 6,
            xhrSetup: function (xhr) {
              if (PARAMS.referer) xhr.setRequestHeader("Referer", PARAMS.referer);
              if (PARAMS.origin)  xhr.setRequestHeader("Origin",  PARAMS.origin);
              if (PARAMS.cookie)  xhr.setRequestHeader("Cookie",  PARAMS.cookie);
            }
          });

          hls.loadSource(STREAM_URL);
          hls.attachMedia($video);

          hls.on(Hls.Events.MANIFEST_PARSED, function () {
            console.log("[Player] Manifest parsed");
            hideLoader();
            $video.play().catch(function () {
              showStatus("Tap ▶ to start", 5000);
            });
          });

          hls.on(Hls.Events.LEVEL_LOADED, function (_, data) {
            if (data && data.details && data.details.live) {
              $liveBadge.classList.add("show");
            }
          });

          hls.on(Hls.Events.ERROR, function (_, data) {
            console.error("[hls.js error]", data);
            var fatal   = data.fatal;
            var type    = data.type;
            var details = data.details;
            var reason  = data.reason || "";

            if (!fatal) {
              showStatus("Recovering…", 2000);
              return;
            }

            if (type === Hls.ErrorTypes.NETWORK_ERROR) {
              showError("Network error", "Failed to load: " + details + " — retrying…");
              setTimeout(function () {
                hideError();
                hls.startLoad();
              }, 2000);
            } else if (type === Hls.ErrorTypes.MEDIA_ERROR) {
              showError("Media error", details + " — recovering…");
              hls.recoverMediaError();
            } else {
              showError("Playback failed", details + (reason ? " (" + reason + ")" : ""));
            }
          });

          $video.addEventListener("waiting", function () { showStatus("Buffering…", 0); });
          $video.addEventListener("playing", function () { hideLoader(); showStatus("● Playing", 2000); });

        }
        // Last-resort native fallback
        else if ($video.canPlayType("application/vnd.apple.mpegurl")) {
          console.log("[Player] Fallback native HLS");
          $video.src = STREAM_URL;
          attachNativeListeners();
          $video.play().catch(function () {
            showStatus("Tap ▶ to start", 5000);
          });
        }
        else {
          showError("HLS not supported", "Your browser cannot play this stream.");
        }
      }

      // ── Native video listeners ────────────────────────────────────────
      function attachNativeListeners() {
        $video.addEventListener("loadedmetadata", hideLoader);
        $video.addEventListener("playing", function () {
          hideLoader();
          showStatus("● Playing", 2000);
        });
        $video.addEventListener("waiting", function () {
          showStatus("Buffering…", 0);
        });
        $video.addEventListener("error", function () {
          var e = $video.error;
          showError(
            "Native playback error",
            e ? (e.message || "code " + e.code) : "unknown"
          );
        });
      }

      // ── Boot ──────────────────────────────────────────────────────────
      document.addEventListener("DOMContentLoaded", initPlayer);

      window.addEventListener("beforeunload", function () {
        if (hls) { try { hls.destroy(); } catch (e) {} }
      });
    })();
  </script>

</body>
</html>
