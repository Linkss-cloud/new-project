<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width,initial-scale=1,
        maximum-scale=1,user-scalable=no,
        viewport-fit=cover">

  <meta name="referrer" content="no-referrer">

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box
    }

    html,body{
      width:100%;
      height:100%;
      background:#0a0a0a;
      overflow:hidden;
      font-family:
        'Segoe UI',
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      -webkit-user-select:none;
      user-select:none
    }

    #overlay{
      position:fixed;
      inset:0;
      background:#0a0a0a;
      z-index:9999;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:14px
    }

    #overlay svg{
      animation:spin 1s linear infinite
    }

    @keyframes spin{
      to{
        transform:rotate(360deg)
      }
    }

    #overlay p{
      color:#555;
      font-size:13px;
      letter-spacing:.4px;
      text-align:center;
      padding:0 24px;
      font-weight:500
    }

    #channel-list{
      position:fixed;
      inset:0;
      background:#0a0a0a;
      z-index:9998;
      display:none;
      flex-direction:column;
      overflow-y:auto;
      padding:
        max(24px,env(safe-area-inset-top))
        16px
        max(24px,env(safe-area-inset-bottom))
    }

    #channel-list h1{
      color:#fff;
      font-size:16px;
      font-weight:600;
      letter-spacing:.5px;
      margin-bottom:20px;
      padding-bottom:12px;
      border-bottom:1px solid #141414;
      text-align:center
    }

    #ch-grid{
      display:grid;
      grid-template-columns:
        repeat(auto-fill,minmax(160px,1fr));
      gap:14px
    }

    .ch-card{
      background:#111;
      border:1px solid #1a1a1a;
      border-radius:12px;
      padding:16px 12px;
      cursor:pointer;
      text-decoration:none;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      gap:10px;
      min-height:120px;
      justify-content:center;
      transition:
        background .25s,
        border-color .25s,
        transform .2s
    }

    .ch-card:hover{
      background:#1a0a0a;
      border-color:#4a1a1a
    }

    .ch-card:active{
      transform:scale(.96)
    }

    .ch-logo{
      width:100%;
      max-width:120px;
      height:auto;
      max-height:60px;
      object-fit:contain;
      border-radius:6px;
      background:rgba(255,255,255,.03);
      padding:4px
    }

    .ch-name{
      color:#e0e0e0;
      font-size:12px;
      font-weight:500;
      line-height:1.3
    }

    .ch-badge{
      font-size:9px;
      color:#ef4444;
      border:1px solid #ef4444;
      padding:2px 10px;
      border-radius:10px;
      letter-spacing:.3px
    }

    .ch-placeholder{
      width:100%;
      max-width:120px;
      height:60px;
      background:
        linear-gradient(135deg,#1a1a1a,#111);
      border-radius:6px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#333;
      font-size:11px;
      font-weight:600
    }

    #pc{
      position:fixed;
      inset:0;
      background:#000;
      display:none;
      align-items:center;
      justify-content:center
    }

    video{
      width:100%;
      height:100%;
      object-fit:contain;
      background:#000
    }

    video.mode-fill{
      object-fit:fill
    }

    video.mode-cover{
      object-fit:cover
    }

    #status{
      position:fixed;
      top:max(12px,env(safe-area-inset-top));
      right:max(12px,env(safe-area-inset-right));
      z-index:9997;
      padding:5px 13px;
      background:rgba(8,8,8,.9);
      border:1px solid rgba(255,255,255,.05);
      font-size:11px;
      border-radius:20px;
      pointer-events:none;
      opacity:0;
      transition:opacity .3s;
      max-width:260px;
      text-align:right
    }

    #status.show{
      opacity:1
    }

    #status.ok{
      color:#ef4444
    }

    #status.warn{
      color:#fb923c
    }

    #status.err{
      color:#f87171
    }

    @media(max-width:400px){
      #ch-grid{
        grid-template-columns:
          repeat(auto-fill,minmax(130px,1fr));
        gap:10px
      }

      .ch-card{
        min-height:100px;
        padding:12px 8px
      }

      .ch-logo{
        max-height:45px
      }
    }

    @media(min-width:768px){
      #ch-grid{
        grid-template-columns:
          repeat(auto-fill,minmax(200px,1fr));
        gap:18px
      }

      .ch-card{
        min-height:140px
      }

      .ch-name{
        font-size:14px
      }
    }
  </style>
</head>

<body>

<div id="overlay">
  <svg width="36" height="36"
       viewBox="0 0 40 40"
       fill="none">
    <circle cx="20" cy="20" r="16"
            stroke="#161616"
            stroke-width="4"/>
    <path d="M20 4a16 16 0 0 1 16 16"
          stroke="#ef4444"
          stroke-width="4"
          stroke-linecap="round"/>
  </svg>

  <p id="loadMsg">Loading…</p>
</div>

<div id="status"></div>

<div id="channel-list">
  <h1>Sportlink · Live</h1>
  <div id="ch-grid"></div>
</div>

<div id="pc">
  <video id="v"
         playsinline
         webkit-playsinline
         preload="none"></video>
</div>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>

<script>
(function(){
"use strict";

var API =
  "https://sportlink-fifa-live.pages.dev/zee5.json";

var $overlay =
  document.getElementById("overlay");

var $loadMsg =
  document.getElementById("loadMsg");

var $status =
  document.getElementById("status");

var $list =
  document.getElementById("channel-list");

var $grid =
  document.getElementById("ch-grid");

var $pc =
  document.getElementById("pc");

var $vid =
  document.getElementById("v");

var statusTimer = null;


/*
 * Put any permitted pre-load initialization
 * here. main() waits for this before requesting
 * the channel JSON.
 */
async function preLoadStep(){
  return true;
}


function setMsg(message){
  if($loadMsg){
    $loadMsg.textContent = message;
  }
}


function hideOverlay(){
  if($overlay){
    $overlay.style.display = "none";
  }
}


function toast(message,type,duration){

  $status.textContent = message;

  $status.className =
    "show " + (type || "ok");

  if(statusTimer){
    clearTimeout(statusTimer);
  }

  if(duration !== 0){

    statusTimer =
      setTimeout(function(){

        $status.className =
          $status.className
            .replace("show","")
            .trim();

        statusTimer = null;

      },duration || 4000);
  }
}


function getChId(){

  return new URLSearchParams(
    location.search
  ).get("id") || "";
}


async function loadData(){

  var response =
    await fetch(API,{
      cache:"no-store",
      headers:{
        Accept:"application/json"
      }
    });

  if(!response.ok){
    throw new Error(
      "HTTP " + response.status
    );
  }

  var data =
    await response.json();

  if(
    !Array.isArray(data) ||
    !data.length
  ){
    throw new Error(
      "No channels found"
    );
  }

  return {
    channels:data.map(
      function(item,index){

        return {
          id:
            item.id ||
            "ch_" + index,

          name:
            item.name ||
            "Channel " +
            (index + 1),

          logo:
            item.logo || "",

          stream_url:
            item.url || "",

          key_id:
            item.KeyId || "",

          key:
            item.Key || "",

          status:"LIVE"
        };
      }
    )
  };
}


function renderList(data){

  hideOverlay();

  var channels =
    data.channels || data;

  var fragment =
    document.createDocumentFragment();

  channels.forEach(function(ch){

    var card =
      document.createElement("a");

    card.className =
      "ch-card";

    card.href =
      "?id=" +
      encodeURIComponent(ch.id);

    var logo;

    if(ch.logo){

      logo =
        '<img class="ch-logo" ' +
        'src="' +
        ch.logo +
        '" alt="' +
        ch.name +
        '" loading="lazy">';

    }else{

      var initials =
        ch.name
          .split(" ")
          .slice(0,2)
          .map(function(word){
            return word[0];
          })
          .join("");

      logo =
        '<div class="ch-placeholder">' +
        initials +
        "</div>";
    }

    card.innerHTML =
      logo +
      '<span class="ch-name">' +
      ch.name +
      "</span>" +
      '<span class="ch-badge">● LIVE</span>';

    fragment.appendChild(card);
  });

  $grid.appendChild(fragment);

  $list.style.display =
    "flex";
}


function errMsg(message){

  setMsg(message);

  $overlay.style.display =
    "flex";

  toast(
    message,
    "err",
    0
  );
}


/*
 * Player initialization is separated so
 * another permitted initialization step can
 * happen immediately before it.
 */
async function prePlayerStep(){
  return true;
}


async function startPlayer(ch){

  /*
   * Anything that is supposed to happen before
   * player initialization belongs here.
   */
  await prePlayerStep();

  $pc.style.display =
    "flex";

  shaka.polyfill.installAll();

  if(
    !shaka.Player.isBrowserSupported()
  ){

    errMsg(
      "Browser not supported."
    );

    return;
  }

  var player =
    new shaka.Player();

  await player.attach($vid);

  new shaka.ui.Overlay(
    player,
    $pc,
    $vid
  ).configure({

    controlPanelElements:[
      "play_pause",
      "mute",
      "volume",
      "time_and_duration",
      "spacer",
      "quality",
      "fullscreen"
    ],

    seekBarColors:{
      base:"#a8a8a8",
      buffered:"#7f1d1d",
      played:"#ef4444"
    }
  });


  var keyId =
    ch.key_id;

  var key =
    ch.key;

  var url =
    ch.stream_url;


  player.configure({

    drm:{
      clearKeys:{
        [keyId]:key
      }
    },

    manifest:{
      defaultPresentationDelay:4,
      ignoreTextStreamFailures:true
    },

    streaming:{
      lowLatencyMode:false,
      bufferingGoal:8,
      rebufferingGoal:1.5,
      bufferBehind:25,
      safeSeekOffset:4,
      stallEnabled:true,
      stallThreshold:1,
      stallSkip:.3
    },

    abr:{
      enabled:true,
      defaultBandwidthEstimate:1000000,
      switchInterval:4
    }
  });


  var refreshing =
    false;

  var retries =
    0;


  async function reload(){

    if(refreshing){
      return;
    }

    if(retries >= 5){

      toast(
        "Stream unavailable.",
        "err",
        0
      );

      return;
    }

    refreshing = true;
    retries++;

    toast(
      "Reconnecting… (" +
      retries +
      "/5)",
      "warn",
      0
    );

    try{

      var data =
        await loadData();

      var channels =
        data.channels || data;

      var fresh =
        channels.find(
          function(item){
            return item.id === ch.id;
          }
        );

      if(!fresh){
        throw new Error(
          "Channel not found"
        );
      }

      keyId =
        fresh.key_id;

      key =
        fresh.key;

      url =
        fresh.stream_url;

      player.configure({
        drm:{
          clearKeys:{
            [keyId]:key
          }
        }
      });

      await player.load(url);

      await $vid.play()
        .catch(function(){});

      retries = 0;

      toast(
        "● Live",
        "ok",
        4000
      );

    }catch(error){

      setTimeout(
        reload,
        Math.min(
          1000 *
          Math.pow(
            2,
            retries - 1
          ),
          8000
        )
      );

    }finally{

      refreshing = false;
    }
  }


  player.addEventListener(
    "error",
    function(event){

      var error =
        event.detail;

      toast(
        "Player error: " +
        (error &&
         error.code ?
         error.code :
         "unknown"),
        "err",
        5000
      );

      reload();
    }
  );


  try{

    setMsg(
      "Loading stream…"
    );

    toast(
      "Loading…",
      "warn",
      0
    );

    await player.load(url);

    hideOverlay();

    toast(
      "Tap ▶ to start",
      "ok",
      5000
    );

  }catch(error){

    hideOverlay();

    toast(
      "Retrying…",
      "warn",
      0
    );

    setTimeout(
      reload,
      1500
    );

    return;
  }


  $vid.addEventListener(
    "playing",
    function(){

      toast(
        "● Live",
        "ok",
        3000
      );
    }
  );


  $vid.addEventListener(
    "waiting",
    function(){

      if(!refreshing){

        toast(
          "Buffering…",
          "warn",
          3000
        );
      }
    }
  );
}


async function main(){

  var id =
    getChId();

  var data;


  /*
   * STEP 1:
   * Pre-load initialization.
   */
  await preLoadStep();


  /*
   * STEP 2:
   * Fetch channel JSON.
   */
  try{

    setMsg(
      "Fetching channels…"
    );

    data =
      await loadData();

  }catch(error){

    errMsg(
      "Connection error."
    );

    return;
  }


  /*
   * STEP 3:
   * Show channel list.
   */
  if(!id){

    renderList(data);

    return;
  }


  /*
   * STEP 4:
   * Find selected channel.
   */
  var channels =
    data.channels || data;

  var channel =
    channels.find(
      function(item){
        return item.id === id;
      }
    );

  if(!channel){

    errMsg(
      "Channel not found."
    );

    return;
  }


  document.title =
    "Sportlink · " +
    channel.name;


  /*
   * STEP 5:
   * Player initialization.
   */
  await startPlayer(channel);
}


document.addEventListener(
  "DOMContentLoaded",
  main
);

})();
</script>

</body>
</html>
