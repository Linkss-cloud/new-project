<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

  <meta name="referrer" content="no-referrer">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">

  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    html,body{
      width:100%;
      height:100%;
      background:#0a0a0a;
      overflow:hidden;
      font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      -webkit-user-select:none;
      user-select:none;
      -webkit-touch-callout:none
    }

    #overlay{
      position:fixed;
      inset:0;
      background:#0a0a0a;
      z-index:9999;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:14px
    }

    #overlay svg{animation:spin 1s linear infinite}

    @keyframes spin{
      to{transform:rotate(360deg)}
    }

    #overlay p{
      color:#555;
      font-size:13px;
      letter-spacing:.4px;
      text-align:center;
      padding:0 24px;
      font-weight:500
    }

    #channel-list{
      position:fixed;
      inset:0;
      background:#0a0a0a;
      z-index:9998;
      display:none;
      flex-direction:column;
      overflow-y:auto;
      padding:max(24px,env(safe-area-inset-top))
             16px
             max(24px,env(safe-area-inset-bottom))
    }

    #channel-list h1{
      color:#fff;
      font-size:16px;
      font-weight:600;
      letter-spacing:.5px;
      margin-bottom:20px;
      padding-bottom:12px;
      border-bottom:1px solid #141414;
      text-align:center
    }

    #ch-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
      gap:14px
    }

    .ch-card{
      background:#111;
      border:1px solid #1a1a1a;
      border-radius:12px;
      padding:16px 12px;
      cursor:pointer;
      text-decoration:none;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      gap:10px;
      transition:background .25s,border-color .25s,
                 transform .2s,box-shadow .25s;
      -webkit-tap-highlight-color:transparent;
      min-height:120px;
      justify-content:center
    }

    .ch-card:hover{
      background:#1a0a0a;
      border-color:#4a1a1a;
      box-shadow:0 4px 20px rgba(239,68,68,.08)
    }

    .ch-card:active{
      transform:scale(.96);
      background:#2a1010
    }

    .ch-card:focus-visible{
      outline:2px solid #ef4444;
      outline-offset:2px
    }

    .ch-logo{
      width:100%;
      max-width:120px;
      height:auto;
      max-height:60px;
      object-fit:contain;
      border-radius:6px;
      background:rgba(255,255,255,.03);
      padding:4px
    }

    .ch-name{
      color:#e0e0e0;
      font-size:12px;
      font-weight:500;
      line-height:1.3;
      letter-spacing:.2px
    }

    .ch-badge{
      font-size:9px;
      color:#666;
      background:rgba(255,255,255,.05);
      padding:2px 10px;
      border-radius:10px;
      letter-spacing:.3px;
      text-transform:uppercase
    }

    .ch-placeholder{
      width:100%;
      max-width:120px;
      height:60px;
      background:linear-gradient(135deg,#1a1a1a,#111);
      border-radius:6px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#333;
      font-size:11px;
      font-weight:600;
      letter-spacing:.5px
    }

    #pc{
      position:fixed;
      inset:0;
      background:#000;
      display:none;
      align-items:center;
      justify-content:center;
      touch-action:manipulation
    }

    video{
      width:100%;
      height:100%;
      object-fit:contain;
      background:#000;
      will-change:transform
    }

    video.mode-fill{object-fit:fill}
    video.mode-cover{object-fit:cover}

    #status{
      position:fixed;
      top:max(12px,env(safe-area-inset-top));
      right:max(12px,env(safe-area-inset-right));
      z-index:9997;
      padding:5px 13px;
      background:rgba(8,8,8,.9);
      border:1px solid rgba(255,255,255,.05);
      font-size:11px;
      font-weight:500;
      letter-spacing:.02em;
      border-radius:20px;
      pointer-events:none;
      opacity:0;
      transition:opacity .3s;
      max-width:260px;
      text-align:right;
      backdrop-filter:blur(4px);
      -webkit-backdrop-filter:blur(4px)
    }

    #status.show{opacity:1}
    #status.ok{color:#ef4444}
    #status.warn{color:#fb923c}
    #status.err{color:#f87171}

    .sp-btn{
      background:transparent!important;
      border:none!important;
      cursor:pointer!important;
      padding:0 8px!important;
      opacity:.8;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:5px;
      height:100%;
      min-width:36px;
      transition:opacity .15s,color .15s;
      color:#fff!important;
      -webkit-tap-highlight-color:transparent
    }

    .sp-btn:hover{opacity:1}

    .sp-btn:active{
      opacity:1;
      transform:scale(.92)
    }

    .sp-btn:focus-visible{
      outline:2px solid #ef4444;
      outline-offset:2px;
      border-radius:6px
    }

    .sp-btn svg{
      width:18px;
      height:18px;
      display:block;
      pointer-events:none;
      flex-shrink:0
    }

    .sp-btn.active{
      opacity:1;
      color:#ef4444!important
    }

    .fit-ratio{
      font-size:11px;
      font-weight:600;
      letter-spacing:.2px;
      line-height:1;
      white-space:nowrap;
      pointer-events:none
    }

    .shaka-controls-container button{
      color:#fff!important
    }

    .shaka-video-container{
      background-color:#000!important
    }

    .shaka-controls-container .shaka-play-button,
    .shaka-controls-container .shaka-mute-button,
    .shaka-controls-container .shaka-volume-bar,
    .shaka-controls-container .shaka-fullscreen-button,
    .shaka-controls-container .shaka-overflow-menu-button{
      color:#ef4444!important
    }

    .shaka-controls-container .shaka-seek-bar .shaka-seek-bar-played{
      background:#ef4444!important
    }

    .shaka-controls-container .shaka-seek-bar .shaka-seek-bar-buffered{
      background:#7f1d1d!important
    }

    @media(max-width:400px){
      .fit-ratio{font-size:9px}
      .sp-btn{
        padding:0 6px!important;
        gap:3px
      }
      #ch-grid{
        grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
        gap:10px
      }
      .ch-card{
        min-height:100px;
        padding:12px 8px
      }
      .ch-logo{max-height:45px}
    }

    @media(min-width:768px){
      #ch-grid{
        grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
        gap:18px
      }
      .ch-card{
        min-height:140px;
        padding:20px 16px
      }
      .ch-logo{max-height:70px}
      .ch-name{font-size:14px}
    }
  </style>
</head>

<body>

<div id="overlay">
  <svg width="36" height="36" viewBox="0 0 40 40" fill="none">
    <circle cx="20" cy="20" r="16"
            stroke="#161616"
            stroke-width="4"/>
    <path d="M20 4a16 16 0 0 1 16 16"
          stroke="#ef4444"
          stroke-width="4"
          stroke-linecap="round"/>
  </svg>

  <p id="loadMsg">Loading…</p>
</div>

<div id="status"></div>

<div id="channel-list">
  <h1>Sportlink · Live</h1>
  <div id="ch-grid"></div>
</div>

<div id="pc">
  <video id="v"
         playsinline
         webkit-playsinline
         preload="none"
         x5-video-player-type="h5"
         x5-video-player-fullscreen="true"></video>
</div>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>

<script>
(function(){
"use strict";

var API =
  "https://sportlink-fifa-live.pages.dev/zee5.json";

var $overlay = document.getElementById("overlay");
var $loadMsg = document.getElementById("loadMsg");
var $status  = document.getElementById("status");
var $list    = document.getElementById("channel-list");
var $grid    = document.getElementById("ch-grid");
var $pc      = document.getElementById("pc");
var $vid     = document.getElementById("v");

var _stTmr = null;

function setMsg(msg){
  if($loadMsg){
    $loadMsg.textContent = msg;
  }
}

function hideOverlay(){
  if($overlay){
    $overlay.style.display = "none";
  }
}

function toast(msg,type,dur){
  $status.textContent = msg;
  $status.className = "show " + (type || "ok");

  if(_stTmr){
    clearTimeout(_stTmr);
  }

  if(dur !== 0){
    _stTmr = setTimeout(function(){
      $status.className =
        $status.className.replace("show","").trim();

      _stTmr = null;
    },dur || 4000);
  }
}

function getChId(){
  return new URLSearchParams(location.search).get("id") || "";
}

function getTier(){
  var mem =
    navigator.deviceMemory || 4;

  var cores =
    navigator.hardwareConcurrency || 4;

  var mob =
    /Android|iPhone|iPad|iPod/i.test(
      navigator.userAgent
    );

  var conn =
    navigator.connection ||
    navigator.mozConnection ||
    navigator.webkitConnection;

  var net =
    conn ?
    (conn.effectiveType || "4g") :
    "4g";

  if(!mob){
    return "high";
  }

  if(
    mem <= 1.5 ||
    cores <= 2 ||
    net === "slow-2g" ||
    net === "2g"
  ){
    return "low";
  }

  if(
    mem <= 3 ||
    cores <= 4
  ){
    return "mid";
  }

  return "high";
}

var TIER = getTier();

var PROF = {
  low:{
    buf:5,
    reBuf:1.5,
    behind:15,
    maxH:480,
    maxBw:1200000,
    bwEst:400000
  },

  mid:{
    buf:8,
    reBuf:1.5,
    behind:25,
    maxH:720,
    maxBw:3500000,
    bwEst:1000000
  },

  high:{
    buf:12,
    reBuf:1.5,
    behind:30,
    maxH:1080,
    maxBw:0,
    bwEst:2000000
  }
}[TIER];

async function loadData(){

  var response = await fetch(API,{
    cache:"no-store",
    headers:{
      Accept:"application/json"
    }
  });

  if(!response.ok){
    throw new Error(
      "HTTP " + response.status
    );
  }

  var data = await response.json();

  if(
    !Array.isArray(data) ||
    !data.length
  ){
    throw new Error(
      "No channels found"
    );
  }

  return {
    channels:data.map(function(item,index){
      return {
        id:
          item.id ||
          "ch_" + index,

        name:
          item.name ||
          "Channel " + (index + 1),

        logo:
          item.logo || "",

        stream_url:
          item.url || "",

        key_id:
          item.KeyId ||
          "00000000000000000000000000000000",

        key:
          item.Key ||
          "00000000000000000000000000000000",

        status:"LIVE",
        time:"",
        cover_image:item.logo || ""
      };
    })
  };
}

function renderList(data){

  hideOverlay();

  var channels =
    data.channels || data;

  var fragment =
    document.createDocumentFragment();

  channels.forEach(function(ch){

    var a =
      document.createElement("a");

    a.className = "ch-card";

    a.href =
      "?id=" +
      encodeURIComponent(ch.id);

    var logoHtml = "";

    if(ch.logo && ch.logo.trim()){

      logoHtml =
        '<img class="ch-logo" ' +
        'src="' + ch.logo + '" ' +
        'alt="' + ch.name + '" ' +
        'loading="lazy" ' +
        'onerror="this.style.display=\'none\'">';

    }else{

      var initials =
        ch.name
          .split(" ")
          .slice(0,2)
          .map(function(w){
            return w[0];
          })
          .join("");

      logoHtml =
        '<div class="ch-placeholder">' +
        initials +
        "</div>";
    }

    var badgeHtml = "";

    if(
      ch.status &&
      ch.status.toUpperCase() === "LIVE"
    ){

      badgeHtml =
        '<span class="ch-badge" ' +
        'style="color:#ef4444;' +
        'border:1px solid #ef4444;">' +
        "● LIVE" +
        "</span>";

    }else if(ch.time){

      badgeHtml =
        '<span class="ch-badge">' +
        ch.time +
        "</span>";
    }

    a.innerHTML =
      logoHtml +
      '<span class="ch-name">' +
      ch.name +
      "</span>" +
      badgeHtml;

    fragment.appendChild(a);
  });

  $grid.appendChild(fragment);

  $list.style.display = "flex";
}

function errMsg(msg){
  setMsg(msg);

  $overlay.style.display =
    "flex";

  toast(msg,"err",0);
}

function shakaErrStr(e){

  if(!e){
    return "Unknown error";
  }

  var categories = {
    1:"Network",
    2:"Text",
    3:"Media",
    4:"Manifest",
    5:"Streaming",
    6:"DRM",
    7:"Player"
  };

  var str =
    (categories[e.category] || "Err") +
    " " +
    e.category +
    ":" +
    e.code;

  if(
    e.data &&
    e.data[0] &&
    typeof e.data[0] === "string"
  ){

    str +=
      " — " +
      e.data[0].slice(0,72);
  }

  return str;
}

async function startPlayer(ch){

  $pc.style.display = "flex";

  shaka.polyfill.installAll();

  if(!shaka.Player.isBrowserSupported()){

    errMsg(
      "Browser not supported."
    );

    return;
  }

  var player =
    new shaka.Player();

  await player.attach($vid);

  new shaka.ui.Overlay(
    player,
    $pc,
    $vid
  ).configure({
    controlPanelElements:[
      "play_pause",
      "mute",
      "volume",
      "time_and_duration",
      "spacer",
      "quality",
      "fullscreen"
    ],

    seekBarColors:{
      base:"#a8a8a8",
      buffered:"#7f1d1d",
      played:"#ef4444"
    }
  });

  var keyId = ch.key_id;
  var key   = ch.key;
  var url   = ch.stream_url;

  function buildCfg(){

    return {
      drm:{
        clearKeys:{
          [keyId]:key
        }
      },

      manifest:{
        defaultPresentationDelay:4,
        ignoreTextStreamFailures:true
      },

      streaming:{
        lowLatencyMode:false,
        bufferingGoal:PROF.buf,
        rebufferingGoal:PROF.reBuf,
        bufferBehind:PROF.behind,
        safeSeekOffset:4,
        stallEnabled:true,
        stallThreshold:1,
        stallSkip:.3
      },

      abr:{
        enabled:true,
        defaultBandwidthEstimate:PROF.bwEst,
        switchInterval:4,
        restrictions:{
          maxHeight:PROF.maxH,
          maxBandwidth:
            PROF.maxBw || Infinity
        }
      }
    };
  }

  player.configure(buildCfg());

  var refreshing = false;
  var retries = 0;

  async function reload(){

    if(refreshing){
      return;
    }

    if(retries >= 5){

      toast(
        "Stream unavailable.",
        "err",
        0
      );

      return;
    }

    refreshing = true;
    retries++;

    toast(
      "Reconnecting… (" +
      retries +
      "/5)",
      "warn",
      0
    );

    try{

      var data =
        await loadData();

      var channels =
        data.channels || data;

      var fresh =
        channels.find(function(c){
          return c.id === ch.id;
        });

      if(!fresh){
        throw new Error(
          "Channel missing"
        );
      }

      keyId = fresh.key_id;
      key = fresh.key;
      url = fresh.stream_url;

      player.configure(
        buildCfg()
      );

      await player.load(url);

      $vid.play().catch(
        function(){}
      );

      retries = 0;

      toast(
        "● Live",
        "ok",
        4000
      );

    }catch(e){

      setTimeout(
        reload,
        Math.min(
          1000 *
          Math.pow(2,retries - 1),
          8000
        )
      );

    }finally{

      refreshing = false;
    }
  }

  player.addEventListener(
    "error",
    function(event){

      var error =
        event.detail;

      if(
        error &&
        [
          1001,
          1002,
          1003,
          4012,
          6006,
          6007,
          7000,
          7001,
          7002
        ].indexOf(error.code) !== -1
      ){

        reload();

      }else{

        toast(
          shakaErrStr(error),
          "err",
          6000
        );
      }
    }
  );

  try{

    setMsg(
      "Loading stream…"
    );

    toast(
      "Loading…",
      "warn",
      0
    );

    await player.load(url);

    hideOverlay();

    toast(
      "Tap ▶ to start",
      "ok",
      5000
    );

  }catch(e){

    hideOverlay();

    toast(
      "Retrying…",
      "warn",
      0
    );

    setTimeout(
      reload,
      1500
    );

    return;
  }

  $vid.addEventListener(
    "playing",
    function(){

      toast(
        "● Live",
        "ok",
        3000
      );
    }
  );

  $vid.addEventListener(
    "waiting",
    function(){

      if(!refreshing){

        toast(
          "Buffering…",
          "warn",
          3000
        );
      }
    }
  );
}

async function main(){

  var id =
    getChId();

  var data;

  try{

    setMsg(
      "Fetching channels…"
    );

    data =
      await loadData();

  }catch(_){

    errMsg(
      "Connection error."
    );

    return;
  }

  if(!id){

    renderList(data);

    return;
  }

  var channels =
    data.channels || data;

  var ch =
    channels.find(function(c){
      return c.id === id;
    });

  if(!ch){

    errMsg(
      "Channel not found."
    );

    return;
  }

  document.title =
    "Sportlink · " +
    ch.name;

  await startPlayer(ch);
}

document.addEventListener(
  "DOMContentLoaded",
  main
);

})();
</script>

</body>
</html>
