<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAYAN 10 · Kids Live</title>
  <meta name="referrer" content="no-referrer">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

  <!-- Shaka Player -->
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">

  <style>
    /* ============ GRID / HOME ============ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #080a0f;
      --surface: #0e1219;
      --card: #131820;
      --border: rgba(255,255,255,0.06);
      --accent: #e8ff00;
      --accent2: #ff3d3d;
      --text: #f0f4ff;
      --muted: rgba(240,244,255,0.45);
      --radius: 14px;
    }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8,10,15,0.9);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }
    .logo {
      font-family: 'Bebas Neue', cursive;
      font-size: 26px;
      letter-spacing: 3px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo span { color: var(--accent); }
    .live-badge {
      background: var(--accent2);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 1px;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
    .updated { font-size: 11px; color: var(--muted); }
    .hero {
      padding: 48px 24px 32px;
      text-align: center;
      background: linear-gradient(180deg, rgba(232,255,0,0.03) 0%, transparent 100%);
    }
    .hero h1 {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(40px, 8vw, 96px);
      letter-spacing: 6px;
      line-height: 1;
      color: var(--text);
    }
    .hero h1 em { color: var(--accent); font-style: normal; }
    .hero p {
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 1px;
    }
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 24px 24px;
      justify-content: center;
    }
    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 18px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all .2s;
      font-family: 'DM Sans', sans-serif;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
      padding: 0 24px 60px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: transform .2s, border-color .2s, box-shadow .2s;
      position: relative;
      border: 1px solid var(--border);
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(232,255,0,0.35);
      box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(232,255,0,0.1);
    }
    .card-thumb {
      aspect-ratio: 16/9;
      background: #0a0d14;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    .card-thumb::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.6));
      pointer-events: none;
    }
    .card-thumb img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
      transition: transform .25s;
    }
    .card:hover .card-thumb img { transform: scale(1.08); }
    .card-live-dot {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(0,0,0,0.6);
      border-radius: 100px;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 700;
      color: #ff5a5a;
      letter-spacing: 0.5px;
    }
    .card-live-dot::before {
      content: '';
      width: 6px;
      height: 6px;
      background: #ff3d3d;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }
    .card-body { padding: 14px 14px 16px; }
    .card-name { font-size: 13px; font-weight: 700; letter-spacing: 0.3px; line-height: 1.3; }
    .card-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .card-watch {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 12px;
      background: var(--accent);
      color: #000;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 6px 14px;
      border-radius: 100px;
      transition: opacity .2s;
    }
    .card:hover .card-watch { opacity: 0.85; }
    footer {
      text-align: center;
      padding: 24px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      margin-top: auto;
    }
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 0;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    @media (max-width: 600px) {
      .hero h1 { font-size: 42px; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 14px 40px; }
      header { padding: 0 14px; }
      .hero { padding: 32px 14px 24px; }
      .filter-bar { padding: 0 14px 20px; }
    }

    /* ============ PLAYER OVERLAY ============ */
    .player-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: none;
    }
    .player-overlay.active { display: block; }

    .player-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 15px 25px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, transparent 100%);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: opacity 0.3s ease;
      font-family: 'Outfit', sans-serif;
    }
    .header-left { display: flex; align-items: center; gap: 15px; }
    .header-right { display: flex; align-items: center; gap: 10px; }

    .back-btn {
      color: white;
      text-decoration: none;
      font-size: 20px;
      background: rgba(255,255,255,0.1);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .back-btn:hover { background: #ff3e3e; transform: scale(1.1); }

    .channel-info { display: flex; align-items: center; gap: 12px; }
    .channel-logo {
      height: 35px;
      width: auto;
      max-width: 100px;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
    }
    .channel-name {
      color: white;
      font-weight: 700;
      font-size: 18px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      font-family: 'Outfit', sans-serif;
    }
    .brand-mark {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      color: white;
      letter-spacing: 1px;
      font-weight: 800;
    }
    .brand-mark span { color: #ff3e3e; }

    .custom-watermark {
      position: absolute;
      z-index: 40;
      pointer-events: none;
      top: 15%;
      right: 5%;
      font-size: 12px;
      font-weight: 800;
      color: rgba(255,255,255,0.15);
      letter-spacing: 1px;
      font-family: 'Outfit', sans-serif;
    }

    .shaka-video-container {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .shaka-video-container video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Player loading overlay */
    #player-loading {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      gap: 16px;
    }
    #player-loading.hidden { display: none; }
    #player-loading .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255,62,62,0.15);
      border-top-color: #ff3e3e;
    }
    #loading-msg {
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      font-family: 'Outfit', sans-serif;
      letter-spacing: 0.5px;
    }

    /* Player block overlay */
    .block-overlay {
      position: absolute;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
      text-align: center;
    }
    .block-box {
      padding: 40px;
      max-width: 500px;
      width: 90%;
      background: rgba(20, 20, 20, 0.95);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .block-title {
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 15px;
      text-transform: uppercase;
      font-family: 'Outfit', sans-serif;
    }
    .block-sub {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      line-height: 1.6;
      font-family: 'Outfit', sans-serif;
    }
    .block-sub a { color: #ff3e3e; text-decoration: none; }

    @media(max-width:700px){
      .player-header { padding: 10px 15px; }
      .channel-name { font-size: 15px; }
      .channel-logo { height: 25px; }
    }
  </style>
</head>
<body>

<!-- ================= HOME / GRID ================= -->
<header>
  <div class="logo">⚡ KIDS <span>SPECIAL</span></div>
  <div style="display:flex;align-items:center;gap:10px">
    <div class="live-badge">● LIVE</div>
    <div class="updated" id="updated-time"></div>
  </div>
</header>

<section class="hero">
  <h1>WATCH <em>LIVE</em></h1>
  <p>All Kids Channels · HD Quality · Zero Cost</p>
</section>

<div class="filter-bar" id="filter-bar">
  <button class="filter-btn active" data-filter="all">All Channels</button>
  <button class="filter-btn" data-filter="hindi">Hindi</button>
  <button class="filter-btn" data-filter="english">English</button>
  <button class="filter-btn" data-filter="tamil">Tamil</button>
  <button class="filter-btn" data-filter="telugu">Telugu</button>
  <button class="filter-btn" data-filter="kannada">Kannada</button>
  <button class="filter-btn" data-filter="sports">Sports</button>
  <button class="filter-btn" data-filter="movies">Movies</button>
</div>

<div id="loading"><div class="spinner"></div> Fetching channels…</div>
<div class="grid" id="grid" style="display:none"></div>

<footer>Data auto-fetched from live source · Tap any channel to watch</footer>

<!-- ================= PLAYER OVERLAY ================= -->
<div class="player-overlay" id="player-overlay">
  <div class="player-header" id="player-header">
    <div class="header-left">
      <button class="back-btn" id="back-btn" aria-label="Back">←</button>
      <div class="channel-info">
        <img id="ch-logo" src="" alt="" class="channel-logo" onerror="this.style.display='none'">
        <span class="channel-name" id="ch-name">Loading…</span>
      </div>
    </div>
    <div class="header-right">
      <span class="brand-mark">SPORT<span>LINK</span></span>
    </div>
  </div>

  <div class="shaka-video-container" id="player-container">
    <video id="video" autoplay muted playsinline preload="metadata"></video>
    <div class="custom-watermark">Sayan</div>
  </div>

  <div id="player-loading">
    <div class="spinner"></div>
    <div id="loading-msg">Loading channel…</div>
  </div>
</div>

<script>
/* ================================================================
   GRID SCRIPT
================================================================ */
(function() {
  const JSON_URL = 'https://sportlink-jiotv10.vercel.app/kid.json';

  function getChannelCategory(name) {
    const n = name.toLowerCase();
    if (n.includes('sports') || n.includes('ten') || n.includes('six')) return 'sports';
    if (n.includes('max') || n.includes('pix') || n.includes('wah') || n.includes('movies')) return 'movies';
    if (n.includes('hindi')) return 'hindi';
    if (n.includes('tamil')) return 'tamil';
    if (n.includes('telugu')) return 'telugu';
    if (n.includes('kannada')) return 'kannada';
    if (n.includes('malayalam')) return 'malayalam';
    if (n.includes('bengali')) return 'bengali';
    if (n.includes('marathi')) return 'marathi';
    return 'english';
  }

  function formatISTClock() {
    const now = new Date();
    const ist = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
    const h = String(ist.getHours()).padStart(2, '0');
    const m = String(ist.getMinutes()).padStart(2, '0');
    const s = String(ist.getSeconds()).padStart(2, '0');
    return h + ':' + m + ':' + s + ' IST';
  }

  const loadingEl = document.getElementById('loading');
  const gridEl = document.getElementById('grid');
  const updatedTimeEl = document.getElementById('updated-time');

  function updateClock() {
    if (updatedTimeEl) updatedTimeEl.textContent = formatISTClock();
  }
  updateClock();
  setInterval(updateClock, 1000);

  async function initGrid() {
    try {
      const res = await fetch(JSON_URL + '?_=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const channels = await res.json();

      loadingEl.style.display = 'none';
      gridEl.style.display = 'grid';
      gridEl.innerHTML = '';

      if (!channels || channels.length === 0) {
        gridEl.innerHTML = '<div class="empty-state">No channels available</div>';
        return;
      }

      channels.forEach(ch => {
        const category = getChannelCategory(ch.name);
        const card = document.createElement('a');
        card.className = 'card';
        card.href = 'javascript:void(0)';
        card.dataset.lang = category;
        card.dataset.channelId = ch.id || ch.name.replace(/\s+/g, '-').toLowerCase();

        const logoUrl = ch.logo || '';
        const img = document.createElement('img');
        img.src = logoUrl;
        img.alt = ch.name;
        img.loading = 'lazy';
        img.onerror = function() {
          this.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Ctext y='45' font-size='44'%3E📺%3C/text%3E%3C/svg%3E";
        };

        const thumbDiv = document.createElement('div');
        thumbDiv.className = 'card-thumb';
        thumbDiv.appendChild(img);

        const dot = document.createElement('div');
        dot.className = 'card-live-dot';
        dot.textContent = 'LIVE';
        thumbDiv.appendChild(dot);

        const body = document.createElement('div');
        body.className = 'card-body';

        const nameDiv = document.createElement('div');
        nameDiv.className = 'card-name';
        nameDiv.textContent = ch.name;

        const subDiv = document.createElement('div');
        subDiv.className = 'card-sub';
        subDiv.textContent = (category.charAt(0).toUpperCase() + category.slice(1)) + ' · HD';

        const watchBtn = document.createElement('div');
        watchBtn.className = 'card-watch';
        watchBtn.textContent = '▶ Watch Now';

        body.appendChild(nameDiv);
        body.appendChild(subDiv);
        body.appendChild(watchBtn);

        card.appendChild(thumbDiv);
        card.appendChild(body);

        // Click → open player
        card.addEventListener('click', (e) => {
          e.preventDefault();
          if (window.PlayerApp) {
            window.PlayerApp.open(ch);
          }
        });

        gridEl.appendChild(card);
      });

      // Filters
      const filterBtns = document.querySelectorAll('.filter-btn');
      filterBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          filterBtns.forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          const f = this.dataset.filter;
          document.querySelectorAll('.card').forEach(card => {
            card.style.display = (f === 'all' || card.dataset.lang === f) ? 'block' : 'none';
          });
        });
      });

    } catch (error) {
      loadingEl.innerHTML = '<span style="color:#ff5a5a;">⚠️ Failed to load channels. Please refresh.</span>';
      console.warn('Fetch error:', error);
    }
  }

  initGrid();
})();


/* ================================================================
   PLAYER SCRIPT
================================================================ */
(function(){
  const CHANNEL_JSON_URL = 'https://sportlink-jiotv10.vercel.app/kid.json';
  const COOKIE_URL = 'https://allinonereborn2.online/jstrweb2/cookies.json';

  // ─── DOM refs ───
  const overlay      = document.getElementById('player-overlay');
  const video        = document.getElementById('video');
  const container    = document.getElementById('player-container');
  const loadingOvl   = document.getElementById('player-loading');
  const loadingMsg   = document.getElementById('loading-msg');
  const chName       = document.getElementById('ch-name');
  const chLogo       = document.getElementById('ch-logo');
  const header       = document.getElementById('player-header');
  const backBtn      = document.getElementById('back-btn');

  // ─── State ───
  let player = null;
  let ui = null;
  let hideHeaderTimer = null;
  let allChannels = [];

  // ─── Helpers ───
  function setLoadingMsg(msg){ if (loadingMsg) loadingMsg.textContent = msg; }
  function showLoading(){ loadingOvl.classList.remove('hidden'); }
  function hideLoading(){ loadingOvl.classList.add('hidden'); }

  function isSandboxedEnv(){
    try {
      if (window.self === window.top) return false;
      if (window.frameElement && window.frameElement.hasAttribute('sandbox')) return true;
      try {
        document.domain = document.domain;
        if (window.frameElement && !window.frameElement.getAttribute('sandbox')) return false;
      } catch (e) { return true; }
      return false;
    } catch(e) { return true; }
  }

  function triggerBlockScreen(title, message){
    try { video.pause(); video.removeAttribute('src'); video.load(); } catch(e){}
    const blockOverlay = document.createElement('div');
    blockOverlay.className = 'block-overlay';
    blockOverlay.innerHTML = `<div class="block-box"><div class="block-title">${title}</div><div class="block-sub">${message}</div></div>`;
    overlay.appendChild(blockOverlay);
    container.style.display = 'none';
    header.style.display = 'none';
    hideLoading();
  }

  function clearBlockScreen(){
    const block = overlay.querySelector('.block-overlay');
    if (block) block.remove();
    container.style.display = '';
    header.style.display = '';
  }

  // ─── Cookie fetching ───
  async function fetchCookie() {
    const sources = [
      COOKIE_URL,
      'https://sportlink-fifa-live.pages.dev/cookie.json',
      'https://sportlink-fifa-live.pages.dev/cookie2.json'
    ];

    for (const url of sources) {
      try {
        console.log('Attempting to fetch cookie from:', url);
        const res = await fetch(url, {
          cache: 'no-store',
          headers: { 'Accept': 'application/json' }
        });
        if (!res.ok) continue;

        const text = await res.text();
        try {
          const data = JSON.parse(text);
          const cookie = extractCookie(data);
          if (cookie) return cookie;
        } catch (e) {
          if (text.trim() && text.includes('=')) return text.trim();
        }
      } catch(e) {
        console.warn(`Cookie fetch failed for ${url}:`, e);
      }
    }
    return generateFallbackCookie();
  }

  function extractCookie(data) {
    if (Array.isArray(data)) {
      for (const item of data) {
        const r = extractCookie(item);
        if (r) return r;
      }
    } else if (data && typeof data === 'object') {
      const fields = ['cookie', 'cookies', 'token', 'auth', '__hdnea__'];
      for (const f of fields) {
        if (data[f]) {
          const val = String(data[f]).trim();
          if (val) return val.startsWith('__hdnea__=') ? val : '__hdnea__=' + val;
        }
      }
      for (const v of Object.values(data)) {
        if (typeof v === 'object') {
          const r = extractCookie(v);
          if (r) return r;
        } else if (typeof v === 'string' && v.includes('__hdnea__')) {
          return v.trim();
        }
      }
    }
    return null;
  }

  function generateFallbackCookie() {
    const now = Math.floor(Date.now() / 1000);
    const expires = now + 21600;
    return `__hdnea__=st=${now}~exp=${expires}~acl=/*~hmac=fallback${Math.random().toString(36).substring(2, 8)}`;
  }

  // ─── Load channel list once ───
  async function ensureChannels() {
    if (allChannels.length) return allChannels;
    const res = await fetch(CHANNEL_JSON_URL + '?_=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    allChannels = await res.json();
    return allChannels;
  }

  // ─── Player lifecycle ───
  async function startPlayer(channel) {
    clearBlockScreen();

    if (isSandboxedEnv()) {
      triggerBlockScreen('Access Denied', 'Please open in a standard browser.');
      return;
    }

    // Update UI
    chName.textContent = channel.name || 'Live';
    chLogo.src = channel.logo || '';
    chLogo.style.display = channel.logo ? '' : 'none';
    document.title = (channel.name || 'Live') + ' · Sportlink';

    showLoading();
    setLoadingMsg('Preparing player…');

    // Ensure shaka is ready
    if (!window.shaka) {
      triggerBlockScreen('Player Error', 'Shaka Player failed to load.');
      return;
    }
    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported()) {
      triggerBlockScreen('Browser Unsupported', 'Please use Chrome or Edge.');
      return;
    }

    // Destroy previous instance
    if (player) {
      try { await player.destroy(); } catch(e){}
      player = null;
      ui = null;
    }

    // Fetch cookie
    setLoadingMsg('Fetching stream token…');
    let cookieValue = null;
    try {
      cookieValue = await fetchCookie();
      console.log('Cookie obtained:', cookieValue ? cookieValue.substring(0, 50) + '…' : 'null');
    } catch(e) {
      console.warn('Cookie error:', e);
    }
    if (!cookieValue && channel.cookie) cookieValue = channel.cookie;
    if (!cookieValue) cookieValue = generateFallbackCookie();

    // Setup player
    setLoadingMsg('Starting stream…');
    player = new shaka.Player();
    await player.attach(video);

    ui = new shaka.ui.Overlay(player, container, video);
    ui.configure({
      addBigPlayButton: true,
      controlPanelElements: ['mute','play_pause','time_and_duration','spacer','quality','picture_in_picture','fullscreen']
    });

    const drmConfig = {};
    if (channel.keyId && channel.key) drmConfig.clearKeys = { [channel.keyId]: channel.key };

    player.configure({
      drm: drmConfig,
      manifest: { defaultPresentationDelay: 5 },
      streaming: {
        lowLatencyMode: true,
        bufferingGoal: 10,
        rebufferingGoal: 2,
        safeSeekOffset: 5
      }
    });

    // Request filter
    const streamUrl = channel.streamUrl || channel.url;
    if (!streamUrl) {
      triggerBlockScreen('Error', 'No stream URL available for this channel.');
      return;
    }

    player.getNetworkingEngine().clearAllRequestFilters();
    player.getNetworkingEngine().registerRequestFilter((type, request) => {
      request.headers['Referer'] = 'https://www.jiotv.com/';
      request.headers['User-Agent'] = 'plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6';

      if (cookieValue) {
        let formattedCookie = cookieValue.startsWith('__hdnea__=') ? cookieValue : '__hdnea__=' + cookieValue;
        request.headers['Cookie'] = formattedCookie;

        let urlCookie = cookieValue.startsWith('__hdnea__=') ? cookieValue.substring(10) : cookieValue;
        const isManifestOrSegment = (type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
                                     type === shaka.net.NetworkingEngine.RequestType.SEGMENT);
        if (isManifestOrSegment && !request.uris[0].includes('__hdnea__')) {
          const sep = request.uris[0].includes('?') ? '&' : '?';
          request.uris[0] += sep + '__hdnea__=' + urlCookie;
        }
      }
    });

    // Load & play
    try {
      await player.load(streamUrl);
      await video.play().catch(() => {});
      hideLoading();
      scheduleHeaderHide();
    } catch(e) {
      console.error('Playback error:', e);
      triggerBlockScreen('Playback Error', 'Stream unavailable right now.<br>Tap ← to go back.');
    }
  }

  // ─── Header auto-hide ───
  function scheduleHeaderHide() {
    clearTimeout(hideHeaderTimer);
    header.style.opacity = '1';
    hideHeaderTimer = setTimeout(() => {
      header.style.opacity = '0';
    }, 3000);
  }
  function showHeader() {
    header.style.opacity = '1';
    clearTimeout(hideHeaderTimer);
    hideHeaderTimer = setTimeout(() => { header.style.opacity = '0'; }, 3000);
  }

  // ─── Public API ───
  window.PlayerApp = {
    async open(channel) {
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
      await startPlayer(channel);
    },
    async close() {
      // Stop playback
      if (player) {
        try { await player.destroy(); } catch(e){}
        player = null;
        ui = null;
      }
      try { video.pause(); video.removeAttribute('src'); video.load(); } catch(e){}

      clearBlockScreen();
      overlay.classList.remove('active');
      document.body.style.overflow = '';
      document.title = 'SAYAN 10 · Kids Live';
      hideLoading();
    }
  };

  // ─── Back button ───
  backBtn.addEventListener('click', () => window.PlayerApp.close());

  // ─── ESC key closes ───
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('active')) {
      window.PlayerApp.close();
    }
  });

  // ─── Header show on interaction ───
  container.addEventListener('mousemove', showHeader);
  container.addEventListener('touchstart', showHeader);

  // Unmute on first play
  video.addEventListener('play', () => { video.muted = false; });
})();
</script>
