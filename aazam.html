<!-- Plyr CSS -->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">

<div class="video-container">
    <video id="video-player" playsinline controls>
        <source src="https://dd-stream.vercel.app/download?path=6a7574d5ac7f37d1039ac097" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</div>

<style>
.video-container {
    width: 100%;
    max-width: 1000px;
    margin: auto;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
}

#video-player {
    width: 100%;
    height: auto;
    display: block;
}

.plyr {
    --plyr-color-main: #00b4ff; /* Change to your accent color */
}
</style>

<!-- Plyr JS -->
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

<script>
const player = new Plyr('#video-player', {
    controls: [
        'play-large',
        'play',
        'progress',
        'current-time',
        'mute',
        'volume',
        'captions',
        'settings',
        'pip',
        'airplay',
        'fullscreen'
    ],
    seekTime: 10,
    keyboard: {
        focused: true,
        global: true
    }
});
</script>
