<!-- Plyr CSS -->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">

<style>
body {
    margin: 0;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: Arial, sans-serif;
}

.video-container {
    width: 100%;
    max-width: 1000px;
    padding: 20px;
}

#video-player {
    width: 100%;
    height: auto;
    display: block;
}

.plyr {
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    --plyr-color-main: #00b4ff;
}
</style>

<div class="video-container">
    <video id="video-player" playsinline controls>
        <source src="https://dd-stream.vercel.app/download?path=6a7574d5ac7f37d1039ac097" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</div>

<!-- Plyr JS -->
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

<script>
const player = new Plyr('#video-player', {
    controls: [
        'play-large',
        'play',
        'progress',
        'current-time',
        'mute',
        'volume',
        'captions',
        'settings',
        'pip',
        'airplay',
        'fullscreen'
    ],
    seekTime: 10,
    keyboard: {
        focused: true,
        global: true
    }
});
</script>
