<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sports Zone - Live Player</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    width: 100%;
    height: 100%;
}

#main-iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    position: absolute;
    top: 0;
    left: 0;
}

.error-msg {
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
    position: absolute;
    width: 100%;
    top: 50%;
    transform: translateY(-50%);
}
</style>
</head>

<body>

<iframe
    id="main-iframe"
    allowfullscreen
    allow="encrypted-media; fullscreen; autoplay">
</iframe>

<script>
const urlParams = new URLSearchParams(window.location.search);
const id = urlParams.get("id");
const iframe = document.getElementById("main-iframe");

if (id) {

    fetch("https://cricketttttt.pages.dev/Secure/frame.json")
        .then(function(res) {
            if (!res.ok) {
                throw new Error("Failed to load JSON");
            }

            return res.json();
        })
        .then(function(data) {

            if (data[id]) {
                iframe.src = data[id];
            } else {
                showError("Stream not found");
            }

        })
        .catch(function(error) {
            console.error(error);
            showError("Error loading data");
        });

} else {
    showError("No ID provided");
}

function showError(msg) {
    const h2 = document.createElement("h2");

    h2.className = "error-msg";
    h2.innerText = msg;

    document.body.appendChild(h2);
    iframe.style.display = "none";
}
</script>

</body>
</html>
