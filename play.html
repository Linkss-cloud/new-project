<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sports Zone - Live Player</title>

<style>

html,body{
margin:0;
padding:0;
background:#000;
overflow:hidden;
width:100%;
height:100%;
}

#main-iframe{
width:100%;
height:100%;
border:none;
display:block;
position:absolute;
top:0;
left:0;
}

.telegram-btn{
position:absolute;
top:15px;
left:15px;
z-index:9999;
display:flex;
align-items:center;
gap:12px;
background:linear-gradient(135deg,#1e88e5,#1565c0);
padding:10px 16px;
border-radius:14px;
text-decoration:none;
color:#fff;
font-size:16px;
font-weight:600;
font-family:Arial,sans-serif;
box-shadow:0 6px 18px rgba(0,0,0,0.5);
}

.telegram-icon{
width:34px;
height:34px;
background:rgba(255,255,255,0.15);
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
border:2px solid #fff;
}

.telegram-icon svg{
width:18px;
height:18px;
fill:#fff;
}

.error-msg{
color:white;
text-align:center;
font-family:sans-serif;
margin-top:20px;
position:absolute;
width:100%;
top:50%;
transform:translateY(-50%);
}

</style>
</head>

<body>

<iframe 
id="main-iframe" 
allowfullscreen 
allow="encrypted-media; fullscreen; autoplay">
</iframe>

<script>

const urlParams = new URLSearchParams(window.location.search);

const id = urlParams.get('id');

const iframe = document.getElementById('main-iframe');

if(id){

fetch('https://cricketttttt.pages.dev/Secure/frame.json')

.then(res => res.json())

.then(data => {

if(data[id]){

iframe.src = data[id];

}else{

showError("Stream not found");

}

})

.catch(()=>{

showError("Error loading data");

});

}else{

showError("No ID provided");

}

function showError(msg){

const h2 = document.createElement('h2');

h2.className = 'error-msg';

h2.innerText = msg;

document.body.appendChild(h2);

iframe.style.display = 'none';

const badge = document.querySelector('.telegram-btn');

if(badge) badge.style.display = 'none';

}

});


function showAlert() {
document.getElementById('blur-bg').style.display = 'block'; // Show background blur
document.getElementById('alert-box').style.display = 'block'; // Show alert box
}
function closeAlert() {
document.getElementById('blur-bg').style.display = 'none'; // Hide background blur
document.getElementById('alert-box').style.display = 'none'; // Hide alert box
}
setTimeout(showAlert, 0); // Show alert after 2 seconds
</script>
</body>
</html>
