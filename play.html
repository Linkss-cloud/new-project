<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:#0a0a0f;font-family:'Segoe UI',sans-serif;overflow:hidden;}

#main-iframe{width:100%;height:100%;border:none;display:block;position:absolute;top:0;left:0;}

.social-badges{
  position:absolute;top:15px;left:15px;z-index:9999;
  display:flex;flex-direction:column;gap:8px;
}

.telegram-btn{
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,#1e88e5,#1565c0);
  padding:9px 15px;border-radius:12px;
  text-decoration:none;color:#fff;font-size:15px;font-weight:600;
  box-shadow:0 4px 14px rgba(0,0,0,0.5);
}
.telegram-icon{width:30px;height:30px;background:rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff;}
.telegram-icon svg{width:16px;height:16px;fill:#fff;}

.whatsapp-btn{
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,#25d366,#128c7e);
  padding:9px 15px;border-radius:12px;
  text-decoration:none;color:#fff;font-size:15px;font-weight:600;
  box-shadow:0 4px 14px rgba(0,0,0,0.5);
}
.whatsapp-icon{width:30px;height:30px;background:rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff;}
.whatsapp-icon svg{width:17px;height:17px;fill:#fff;}

#picker{position:absolute;inset:0;overflow-y:auto;background:#0a0a0f;display:none;}

.picker-header{
  position:sticky;top:0;z-index:10;
  background:linear-gradient(180deg,#0a0a0f 80%,transparent);
  padding:20px 16px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.picker-title{color:#fff;font-size:20px;font-weight:700;letter-spacing:.5px;flex-shrink:0;}
.picker-title span{color:#1e88e5;}

.picker-links{display:flex;align-items:center;gap:8px;flex-shrink:0;}

.tg-link{
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,#1e88e5,#1565c0);
  padding:8px 13px;border-radius:10px;
  text-decoration:none;color:#fff;font-size:13px;font-weight:600;
}
.tg-link svg{width:15px;height:15px;fill:#fff;}

.wa-link{
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,#25d366,#128c7e);
  padding:8px 13px;border-radius:10px;
  text-decoration:none;color:#fff;font-size:13px;font-weight:600;
}
.wa-link svg{width:15px;height:15px;fill:#fff;}

.search-bar{padding:0 16px 12px;}
.search-bar input{
  width:100%;background:#1a1a2e;border:1px solid #2a2a40;
  border-radius:10px;padding:10px 14px;color:#fff;font-size:14px;outline:none;
}
.search-bar input::placeholder{color:#555;}
.search-bar input:focus{border-color:#1e88e5;}

.channel-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;padding:0 16px 24px;
}
.channel-card{
  background:#141420;border:1px solid #1e1e30;border-radius:12px;
  padding:14px 12px;cursor:pointer;
  transition:background .15s,border-color .15s,transform .1s;
  display:flex;align-items:center;gap:10px;text-decoration:none;
}
.channel-card:active{transform:scale(.97);}
.channel-card:hover{background:#1a1a2e;border-color:#1e88e5;}
.channel-dot{width:8px;height:8px;border-radius:50%;background:#1e88e5;flex-shrink:0;box-shadow:0 0 6px #1e88e5;}
.channel-name{color:#e0e0e0;font-size:13px;font-weight:500;line-height:1.3;}
.no-results{color:#444;text-align:center;padding:40px 16px;font-size:14px;}
</style>
</head>
<body>

<div class="social-badges" id="social-badges">
  <a href="https://t.me/+rtK_sfY8t_A2NDU1" target="_blank" class="whatsapp-btn">

      <a href="https://t.me/+rtK_sfY8t_A2NDU1" target="_blank" class="tg-link">

    <input type="text" id="search-input" placeholder="Search channels…" autocomplete="off">
  </div>
  <div class="channel-grid" id="channel-grid"></div>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('id');
  const iframe = document.getElementById('main-iframe');
  const socialBadges = document.getElementById('social-badges');
  const picker = document.getElementById('picker');

  if (id) {
    fetch('https://sportlink18.pages.dev/id.json')
      .then(res => res.json())
      .then(data => {
        const targetData = data.iframes.find(item => item.id === id);
        if (targetData && targetData.iframeSrc) {
          iframe.src = targetData.iframeSrc;
          if (targetData.hit) fetch(targetData.hit).catch(() => {});
        } else {
          showPickerMode(data.iframes);
        }
      })
      .catch(() => showError("Error loading data"));
  } else {
    socialBadges.style.display = 'none';
    iframe.style.display = 'none';
    fetch('https://sportlink18.pages.dev/id.json')
      .then(res => res.json())
      .then(data => showPickerMode(data.iframes))
      .catch(() => showError("Error loading channels"));
  }

  function showPickerMode(channels) {
    socialBadges.style.display = 'none';
    iframe.style.display = 'none';
    picker.style.display = 'block';
    renderChannels(channels);
    document.getElementById('search-input').addEventListener('input', e => {
      const q = e.target.value.toLowerCase();
      renderChannels(channels.filter(c => c.name.toLowerCase().includes(q)));
    });
  }

  function renderChannels(channels) {
    const grid = document.getElementById('channel-grid');
    grid.innerHTML = '';
    if (!channels.length) {
      grid.innerHTML = '<div class="no-results">No channels found</div>';
      return;
    }
    const seen = new Set();
    channels.forEach(ch => {
      if (seen.has(ch.name)) return;
      seen.add(ch.name);
      const card = document.createElement('a');
      card.className = 'channel-card';
      card.href = '?id=' + encodeURIComponent(ch.id);
      card.innerHTML = '<div class="channel-dot"></div><div class="channel-name">' + ch.name + '</div>';
      grid.appendChild(card);
    });
  }

  function showError(msg) {
    socialBadges.style.display = 'none';
    iframe.style.display = 'none';
    const h2 = document.createElement('h2');
    h2.style.cssText = 'color:#fff;text-align:center;font-family:sans-serif;position:absolute;width:100%;top:50%;transform:translateY(-50%);';
    h2.innerText = msg;
    document.body.appendChild(h2);
  }
});
</script>
