<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Live TV Player</title>

    <!-- Shaka Player & UI CSS/JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/controls.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mux.js@6.2.0/dist/mux.min.js"></script>

    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1c1c24;
            --primary: #ff4500;
            --text: #ffffff;
            --text-muted: #a0a0a0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
        }

        header {
            padding: 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
        }

        /* Filter Buttons */
        #filter-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 0 20px;
        }

        .filter-btn {
            background-color: var(--card-bg);
            color: var(--text);
            border: 1px solid #333;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        /* Grid Layout */
        #grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Channel Cards */
        .channel-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            border: 1px solid #2a2a35;
        }

        .channel-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255, 69, 0, 0.2);
            border-color: var(--primary);
        }

        .channel-card img {
            width: 100%;
            height: auto;
            aspect-ratio: 16/9;
            object-fit: cover;
            border-bottom: 1px solid #2a2a35;
        }

        .channel-card h3 {
            font-size: 14px;
            padding: 10px;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #loading-text {
            text-align: center;
            color: var(--text-muted);
            margin-top: 50px;
        }

        /* Fullscreen Player Modal */
        #player-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #player-modal.hidden {
            display: none;
        }

        .shaka-video-container {
            width: 100%;
            height: 100%;
        }

        video {
            width: 100%;
            height: 100%;
        }

        /* Close Button Overlay */
        #close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s;
        }

        #close-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        .idle-hide {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <header>
        <h2>Live TV Player</h2>
        <div id="filter-container">
            <button class="filter-btn active" data-category="All">All</button>
        </div>
    </header>

    <h3 id="loading-text">Fetching channels securely...</h3>

    <div id="grid-container"></div>

    <!-- Player Modal popup -->
    <div id="player-modal" class="hidden">
        <button id="close-btn">&times;</button>
        <div class="shaka-video-container">
            <video autoplay playsinline></video>
        </div>
    </div>

    <!-- Player Logic Script -->
    <script>
        let channelsData = [];

        // 🚀 PUT YOUR WORKER URL HERE
        const jsonUrl = "https://as-test.xyzplay.workers.dev/api/drm/?name=star%20sports";

        window.activePlayer = null;
        window.activeUI = null;

        async function initializeApp() {
            try {
                const response = await fetch(jsonUrl);
                if (!response.ok) throw new Error('Network response failed');
                channelsData = await response.json();

                const loadingText = document.getElementById('loading-text');
                if (loadingText) loadingText.style.display = 'none';

                setupFilters();
                loadAllChannels('All');
            } catch (error) {
                console.error('Failed to fetch JSON:', error);
                const loadingText = document.getElementById('loading-text');
                if (loadingText) loadingText.innerText = 'Error: Could not load channels. Check Worker API.';
            }
        }

        function loadAllChannels(filterCategory = 'All') {
            const grid = document.getElementById('grid-container');
            if (!grid) return;
            grid.innerHTML = '';

            const filteredChannels = filterCategory === 'All'
                ? channelsData
                : channelsData.filter(c => c.category === filterCategory);

            if (filteredChannels.length === 0) {
                grid.innerHTML = '<h3 id="loading-text" style="display:block">No channels found.</h3>';
                return;
            }

            filteredChannels.forEach(channel => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.innerHTML = `<img src="${channel.logo}" alt="${channel.name}" onerror="this.src='https://via.placeholder.com/300x169?text=No+Image'"> <h3>${channel.name}</h3>`;

                card.onclick = () => playChannel(channel);
                grid.appendChild(card);
            });
        }

        function setupFilters() {
            const filterContainer = document.getElementById('filter-container');
            if (!filterContainer) return;

            const categories = new Set(channelsData.map(c => c.category).filter(Boolean));

            categories.forEach(category => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.category = category;
                btn.innerText = category;
                btn.onclick = () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    loadAllChannels(category);
                };
                filterContainer.appendChild(btn);
            });

            const allBtn = filterContainer.querySelector('[data-category="All"]');
            if (allBtn) {
                allBtn.onclick = () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    allBtn.classList.add('active');
                    loadAllChannels('All');
                };
            }
        }

        document.addEventListener('DOMContentLoaded', initializeApp);

        const modal = document.getElementById('player-modal');
        const closeBtn = document.getElementById('close-btn');
        let hideTimeout;

        function resetHideTimer() {
            if (!closeBtn) return;
            closeBtn.classList.remove('idle-hide');
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => {
                closeBtn.classList.add('idle-hide');
            }, 2500);
        }

        if (modal) {
            modal.addEventListener('mousemove', resetHideTimer);
            modal.addEventListener('touchstart', resetHideTimer);
        }

        if (closeBtn) {
            closeBtn.onclick = async () => {
                modal.classList.add('hidden');
                if (window.activePlayer) await window.activePlayer.destroy();
                if (window.activeUI) await window.activeUI.destroy();
                window.activePlayer = null;
                window.activeUI = null;
            };
        }

        async function playChannel(channel) {
            const streamUrl = channel.streamurl || channel.url;
            if (!streamUrl) return alert("Stream URL not available.");

            if (modal) {
                modal.classList.remove('hidden');
                resetHideTimer();
            }

            // DRM Setup
            let drmConfig = {};
            if (channel.keyId && channel.key && !channel.keyId.includes("Error")) {
                drmConfig = {
                    clearKeys: {
                        [channel.keyId]: channel.key
                    }
                };
            }

            const rawToken = channel.token || "";

            shaka.polyfill.installAll();
            if (!shaka.Player.isBrowserSupported()) {
                alert('Browser not supported for Shaka Player');
                return;
            }

            const video = document.querySelector('video');
            const player = new shaka.Player();
            window.activePlayer = player;
            await player.attach(video);

            const container = document.querySelector('.shaka-video-container');
            const ui = new shaka.ui.Overlay(player, container, video);
            window.activeUI = ui;

            const originalSelectAudioLanguage = player.selectAudioLanguage.bind(player);
            player.selectAudioLanguage = (language, role) => {
                originalSelectAudioLanguage(language, role);
                const tracks = player.getVariantTracks().filter(t => t.language === language);
                if (tracks.length > 0) {
                    player.selectVariantTrack(tracks[0], true);
                    player.configure({ abr: { enabled: true } });
                }
            };

            ui.configure({
                controlPanelElements: [
                    'play_pause', 'time_and_duration', 'mute', 'volume',
                    'spacer', 'picture_in_picture', 'fullscreen', 'overflow_menu'
                ],
                overflowMenuButtons: ['quality', 'language', 'cast'],
                volumeBarColors: { base: 'rgba(63, 187, 1, 1)', level: '#ff4500' },
                seekBarColors: { base: 'rgb(41, 41, 163)', buffered: 'rgb(35, 99, 3)', played: '#ff4500' }
            });

            player.configure({
                drm: drmConfig,
                abr: {
                    enabled: true,
                    defaultBandwidthEstimate: 8000000,
                    switchInterval: 2,
                    bandwidthUpgradeTarget: 0.7,
                    bandwidthDowngradeTarget: 0.5
                }
            });

            // Network Token Injection
            player.getNetworkingEngine().registerRequestFilter((type, request) => {
                request.headers['Referer'] = 'https://live-pv-ta.amazon.fastly-edge.com/';
                request.headers['User-Agent'] = "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";

                if (rawToken) request.headers['Cookie'] = rawToken;
                request.headers['Connection'] = 'keep-alive';
                request.headers['Keep-Alive'] = 'timeout=60';

                if ((type === shaka.net.NetworkingEngine.RequestType.MANIFEST || type === shaka.net.NetworkingEngine.RequestType.SEGMENT) && request.uris[0] && !request.uris[0].includes('__hdnea__=')) {
                    const separator = request.uris[0].includes('?') ? '&' : '?';
                    request.uris[0] += separator + rawToken;
                }
            });

            player.addEventListener('error', (event) => {
                console.error('Player error:', event.detail);
                if (event.detail && event.detail.type === shaka.util.Error.Severity.RECOVERABLE) {
                    player.load(streamUrl).catch(e => {
                        setTimeout(() => player.load(streamUrl).catch(console.error), 3000);
                    });
                }
            });

            video.addEventListener('waiting', () => { if (player) player.getConfiguration().streaming.rebufferingGoal = 30; });

            let stallTimeout;
            video.addEventListener('stalled', () => {
                if (stallTimeout) clearTimeout(stallTimeout);
                stallTimeout = setTimeout(() => {
                    if (video.readyState < 3) {
                        video.load();
                        player.load(streamUrl).catch(console.error);
                    }
                }, 5000);
            });

            try {
                await player.load(streamUrl);
                video.play();
            } catch (error) {
                console.error('Load error:', error);
                setTimeout(() => player.load(streamUrl).catch(console.error), 5000);
            }
        }
    </script>
</body>

</html>
